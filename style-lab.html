<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilgrim's Progress · Style lab</title>
<style>
body{margin:0;background:#2e2c33;font-family:Georgia,serif;color:#e9e1d3}
#wrap{max-width:1100px;margin:0 auto;padding:10px}
canvas{display:block;width:100%;border-radius:8px;touch-action:manipulation}
.row{display:flex;flex-wrap:wrap;gap:10px 22px;margin:12px 4px;align-items:center}
label{display:flex;flex-direction:column;font-size:14px;color:#cfc4b4;min-width:140px;flex:1}
input[type=range]{width:100%;accent-color:#c9a46a}
button{font-family:Georgia,serif;font-size:16px;padding:.45em 1.1em;border-radius:30px;border:1.5px solid #c9a46a;background:#3a3640;color:#f0e6d4;cursor:pointer}
.chk{flex-direction:row;align-items:center;gap:6px;min-width:0;flex:0}
p.hint{font-size:14px;color:#a89c8c;margin:4px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<p class="hint">Tap a house to redraw just that one.</p>
<div class="row">
  <button id="new">New street</button>
  <label class="chk"><input type="checkbox" id="pilgrim" checked> Christian</label>
  <label class="chk"><input type="checkbox" id="back" checked> Back row</label>
</div>
<div class="row">
  <label>Lean <input type="range" id="lean" min="0" max="10" value="4"></label>
  <label>Timber detail <input type="range" id="timber" min="0" max="10" value="6"></label>
  <label>Line wobble <input type="range" id="wob" min="0" max="10" value="4"></label>
  <label>Line weight <input type="range" id="lw" min="0" max="10" value="4"></label>
  <label>Ink darkness <input type="range" id="ink" min="0" max="10" value="6"></label>
  <label>Distance haze <input type="range" id="haze" min="0" max="10" value="6"></label>
</div>
</div>

const VW = 960, VH = 540, GY = 452;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);

// ---------- seeded random ----------
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const rr = (a, b) => a + (b - a) * R();
const pick = a => a[R() * a.length | 0];
const val = id => +document.getElementById(id).value / 10;

const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const HAZE = hex('#c9d3dc');

// ---------- the style: every drawing goes through these ----------

}
// a wobbly hand-drawn line through points
function wobble(pts, closed) {

  c.fillStyle = g; c.fillRect(x0, y0, x1 - x0, y1 - y0);
  if (o.top) { const v = c.createLinearGradient(0, y0, 0, y0 + o.top); v.addColorStop(0, css([50, 40, 40], .22)); v.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = v; c.fillRect(x0, y0, x1 - x0, o.top); }
  // pigment pooled at the edge
  trace(c, p, true); c.strokeStyle = css(mix(col, [40, 30, 30], .35), o.far ? .12 : .35); c.lineWidth = 3; c.stroke();
  // pigment grain
  if (!o.far) { c.fillStyle = css(mix(col, [40, 30, 30], .4), .12); const cnt = Math.min(500, (x1 - x0) * (y1 - y0) / 60); for (let i = 0; i < cnt; i++) { const r = .5 + R() * 1.1; c.fillRect(rr(x0, x1), rr(y0, y1), r, r); } }
  // a few blooms
  if (!o.far && (x1 - x0) * (y1 - y0) > 1500) for (let i = 0; i < 3; i++) {
    const bx = rr(x0, x1), by = rr(y0, y1), br = rr(8, 22);
    const bg = c.createRadialGradient(bx, by, 0, bx, by, br); bg.addColorStop(0, css(mix(col, [90, 70, 60], .25), .25)); bg.addColorStop(1, css(col, 0));

}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];

// ---------- one house ----------
const PLASTER = ['#efe3c8', '#f2e8d2', '#e8d6b4', '#eadcc2', '#e3d3bd'];
const ROOF = [['#5d6a80', 'slate'], ['#6f7686', 'slate'], ['#8a7a5a', 'thatch'], ['#9a7a58', 'tile'], ['#7a6a58', 'tile']];
function makeHouse(seed, x, far) {
  R = rng(seed);
  const floors = far ? pick([2, 2, 3]) : pick([1, 2, 2, 2, 3, 3]);
  const fh = rr(46, 66), w = floors === 1 ? rr(80, 120) : rr(76, 160);
  const h = {
    seed, x, w, floors, fh, far,

    gable: R() < .6, roofH: rr(48, 86), overhang: rr(6, 12),
    plaster: pick(PLASTER), roof: pick(ROOF), timberCol: pick(['#6a4c36', '#5e4433', '#74563c']),
    lean: (R() < .5 ? -1 : 1) * rr(.4, 1), chim: R() < .85 ? pick(['l', 'r', 'm']) : '', chimH: rr(30, 55),
    dormer: R() < .4, stone: R() < .25, door: rr(.15, .7), seed2: (R() * 1e9) | 0,

function drawHouse(c, hs, opts = {}) {
  R = rng(hs.seed2);

  // floors (upper floors jut out a little)

  const fl = [];
  for (let f = 0; f < hs.floors; f++) {
    if (f > 0) { xl -= hs.jetty; xr += hs.jetty; }
    fl.push({ xl, xr, y0: y - hs.fh, y1: y });
    y -= hs.fh;
  }
  const top = y, ov = hs.overhang;
  // chimney sits behind the roof

    const cx = hs.chim === 'l' ? xl + W * .18 : hs.chim === 'r' ? xr - W * .25 : (xl + xr) / 2 + W * .12, cw = 16 + R() * 6;

  }

    const p = rect(f.xl, f.y0, f.xr - f.xl, f.y1 - f.y0);
    fill(c, p, hs.stone && f === fl[0] ? '#b9b2a4' : hs.plaster, { ...o, top: f === fl[fl.length - 1] ? 18 : 9 });
  }
  // timber frame
  if (S.timber > .05 && (!far || S.haze < .5)) for (const f of fl) {
    if (hs.stone && f === fl[0]) continue;
    const tc = hs.timberCol, tw = 2 + S.timber * 3.5, fw = f.xr - f.xl;
    const nPostX = 0;
    const nPost = Math.max(1, Math.round(fw / (110 - S.timber * 88)));
    const beam = (pts, wd = tw) => { c.save(); c.lineCap = 'butt'; c.strokeStyle = css(far ? mix(hex(tc), HAZE, far) : hex(tc), .92); c.lineWidth = wd; trace(c, wobble(pts), false); c.stroke(); c.restore(); };
    beam([[f.xl, f.y0 + 2], [f.xr, f.y0 + 2]], 5); beam([[f.xl, f.y1 - 2], [f.xr, f.y1 - 2]], 5);
    for (let k = 0; k <= nPost; k++) { const px = f.xl + 2 + (fw - 4) * k / nPost; beam([[px, f.y0], [px, f.y1]]); }
    if (S.timber > .3) beam([[f.xl, (f.y0 + f.y1) / 2], [f.xr, (f.y0 + f.y1) / 2]], 3.4);
    for (let k = 0; k < nPost; k++) if (R() < S.timber * .8) {
      const a = f.xl + (fw - 4) * k / nPost + 2, b = f.xl + (fw - 4) * (k + 1) / nPost + 2;
      if (R() < .5) beam([[a, f.y1], [b, f.y0]], 3.4); else beam([[a, f.y0], [b, f.y1]], 3.4);
    }
  }
  // windows and door

    const f = fl[fi], fw = f.xr - f.xl, n = fw > 130 ? 2 : (R() < .3 ? 2 : 1);
    for (let k = 0; k < n; k++) {
      if (R() < .15) continue;
      const ww = rr(14, 21), wh = rr(15, 20);
      let wx = f.xl + fw * (n === 1 ? .5 : (k ? .72 : .28)) - ww / 2;
      if (fi === 0 && Math.abs(wx + ww / 2 - (X + W * hs.door)) < 30) continue;
      window_(c, wx, f.y0 + hs.fh * .3, ww, wh, o, ink);
    }
  }
  const dx = X + W * hs.door - 12;
  fill(c, [[dx, B], [dx, B - 42], [dx + 12, B - 47], [dx + 24, B - 42], [dx + 24, B]], '#7a5a40', o);
  line(c, [[dx, B], [dx, B - 42], [dx + 12, B - 47], [dx + 24, B - 42], [dx + 24, B]], ink);
  if (!far) { line(c, [[dx + 8, B - 40], [dx + 8, B - 2]], { w: .5 }); line(c, [[dx + 16, B - 40], [dx + 16, B - 2]], { w: .5 }); }
  // roof
  const [rc, kind] = hs.roof;
  let roofPts;
  if (hs.gable) {
    const ax = (xl + xr) / 2, ay = top - hs.roofH;
    // gable wall
    fill(c, [[xl, top], [ax, ay + 8], [xr, top]], hs.plaster, o);
    if (!far || S.haze < .5) { const b = (p) => { c.save(); c.strokeStyle = css(hex(hs.timberCol), .9); c.lineWidth = 3.6; trace(c, wobble(p), false); c.stroke(); c.restore(); };
      b([[ax, ay + 10], [ax, top]]); if (S.timber > .4) { b([[xl + (ax - xl) * .45, top - (top - ay) * .45], [xl + (ax - xl) * .45, top]]); b([[xr - (xr - ax) * .45, top - (top - ay) * .45], [xr - (xr - ax) * .45, top]]); } }
    if (hs.floors > 1) window_(c, ax - 9, top - hs.roofH * .45, 18, 18, o, ink);
    // roof edges (we see the tiles along the slopes)

    roofPts = [[xl - ov, top + 2], [ax, ay - 4], [xr + ov, top + 2], [xr + ov - t * .7, top + 2 + t * .2], [ax, ay + t - 4], [xl - ov + t * .7, top + 2 + t * .2]];
    fill(c, roofPts, rc, o); line(c, roofPts, { closed: 1, ...ink });
  } else {
    const inset = rr(10, 22);
    roofPts = [[xl - ov, top + 3], [xl + inset, top - hs.roofH], [xr - inset, top - hs.roofH], [xr + ov, top + 3]];
    fill(c, roofPts, rc, { ...o, top: 8, shade: .22 }); line(c, roofPts, { closed: 1, ...ink });
    if (!far) for (let k = 1; k < 4; k++) { const yy = top - hs.roofH * k / 4; const fr = k / 4; line(c, [[xl - ov + (inset + ov) * fr + 4, yy], [xr + ov - (inset + ov) * fr - 4, yy]], { w: .45, col: 'rgba(60,50,50,.35)' }); }
    if (kind === 'thatch' && !far) for (let k = 0; k < 14; k++) { const xx = rr(xl, xr), yy = rr(top - hs.roofH * .8, top); line(c, [[xx, yy], [xx + rr(-3, 3), yy + 8]], { w: .4, col: 'rgba(70,55,35,.4)' }); }

      window_(c, dxm + 7, dy + 9, 16, 15, o, ink);

  c.restore();

}
function window_(c, x, y, w, h, o, ink) {
  fill(c, rect(x - 2, y - 2, w + 4, h + 4), '#6a4c36', o);

    c.restore();
    line(c, rect(x - 2, y - 2, w + 4, h + 4), { closed: 1, w: .7, ...ink });
    fill(c, rect(x - 4, y + h + 2, w + 8, 4), '#7a5a40', o);
  }
}

// ---------- ground, bushes, road ----------
function bush(c, x, y, s, far) {
  const cols = ['#7c9a5e', '#6e8c55', '#8fae6c'];
  for (let k = 0; k < 4; k++) {
    const bx = x + rr(-14, 14) * s, by = y - rr(4, 16) * s, br = rr(9, 15) * s, n = 12, p = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, rad = br * (1 + (R() - .5) * .35); p.push([bx + Math.cos(a) * rad, by + Math.sin(a) * rad * .85]); }
    fill(c, p, cols[k % 3], { far: far ? .5 : 0, shade: .25 });
  }
}
function blob(cx, cy, rx, ry, n = 16) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + Math.cos(a) * rx * (1 + (R() - .5) * .25), cy + Math.sin(a) * ry * (1 + (R() - .5) * .4)]); } return p; }
function road(c) {
  fill(c, [[-10, GY - 4], [VW + 10, GY - 2], [VW + 10, VH + 10], [-10, VH + 10]], '#d9c49e', { shade: .08, top: 16 });
  R = rng(77);
  c.save(); c.globalAlpha = .55;
  for (let k = 0; k < 10; k++) fill(c, blob(rr(-40, VW + 40), rr(GY + 18, VH - 6), rr(70, 190), rr(5, 12)), pick(['#c4a77d', '#bca07a', '#cbb08a', '#b9a58c']), { shade: .04 });
  c.restore();
  for (let k = 0; k < 3; k++) { const x = rr(60, VW - 140), y = rr(GY + 40, VH - 22), w = rr(60, 120), p = blob(x, y, w / 2, 6, 18);
    fill(c, p, '#c3d1d8', { shade: .04 }); c.save(); c.strokeStyle = 'rgba(120,100,80,.35)'; c.lineWidth = 1; trace(c, p, true); c.stroke(); c.restore();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(x - w * .25, y - 1.5, w * .3, 1.4); }
  for (let k = 0; k < 16; k++) { const x = rr(0, VW), y = rr(GY + 10, VH - 8), r = rr(1.6, 3.4); fill(c, blob(x, y, r * 1.3, r * .8, 8), '#9e958a', { shade: .3 }); }
  c.save(); c.lineCap = 'round';
  for (let x = 0; x < VW; x += rr(3, 9)) { const hgt = rr(4, 13); c.strokeStyle = css(pick([[110, 140, 80], [130, 160, 95], [95, 125, 75]]), .85); c.lineWidth = rr(1, 2); c.beginPath(); c.moveTo(x, GY + 2); c.quadraticCurveTo(x + rr(-2, 2), GY - hgt / 2, x + rr(-4, 4), GY - hgt); c.stroke(); }
  c.restore();
}

// ---------- scene ----------
let street = [], backRow = [], seed = 11;
function plan() {
  R = rng(seed);
  street = []; backRow = [];
  let x = -40; while (x < VW + 40) { const s = (R() * 1e9) | 0, h = makeHouse(s, x, false); street.push(h); R = rng(s + 1); x += h.w + 2 * h.jetty + (R() < .25 ? rr(30, 60) : rr(-4, 10)); }
  R = rng(seed + 99);
  x = -60; while (x < VW + 60) { const s = (R() * 1e9) | 0, h = makeHouse(s, x, true); h.w *= .7; h.fh *= .62; h.roofH *= .7; h.chimH *= .6; backRow.push(h); R = rng(s + 2); x += h.w + rr(-30, 10); }
}
const SKY = new Image(), WALK = new Image();
const PAPER = document.createElement('canvas'); PAPER.width = PAPER.height = 256;
{ const c = PAPER.getContext('2d'), d = c.createImageData(256, 256); const r = rng(3); for (let i = 0; i < d.data.length; i += 4) { const v = 215 + r() * 40; d.data[i] = v; d.data[i + 1] = v - 1; d.data[i + 2] = v - 6; d.data[i + 3] = 255; } c.putImageData(d, 0, 0); }
function render() {
  setStyle();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // painted sky (from Gemini), scaled to fill
  ctx.drawImage(SKY, 0, 0, SKY.width * VH / SKY.height, VH);
  const lx = 860, ly = 200, g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 110);
  g.addColorStop(0, 'rgba(255,250,225,.85)'); g.addColorStop(.2, 'rgba(255,232,170,.4)'); g.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = g; ctx.fillRect(lx - 120, ly - 120, 240, 240);
  // back row, pale and hazy, raised a little so the rooftops peek over
  if (document.getElementById('back').checked) {
    ctx.save(); ctx.translate(0, -62);
    for (const h of backRow) drawHouse(ctx, h);
    R = rng(5); for (let x = 0; x < VW; x += rr(40, 120)) bush(ctx, x, GY, 1.6, true);
    ctx.restore();
  }
  for (const h of street) drawHouse(ctx, h);
  R = rng(9); for (let x = 10; x < VW; x += rr(70, 190)) bush(ctx, x, GY + 2, rr(.7, 1.1), false);
  road(ctx);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .16; ctx.fillStyle = ctx.createPattern(PAPER, 'repeat'); ctx.fillRect(0, 0, VW, VH); ctx.restore();
  if (document.getElementById('pilgrim').checked && WALK.complete) {
    const s = .58, w = WALK.width * s, h = WALK.height * s, x = 300;
    ctx.fillStyle = 'rgba(60,50,60,.18)'; ctx.beginPath(); ctx.ellipse(x, GY + 4, 30, 6, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.shadowColor = 'rgba(40,30,30,.45)'; ctx.shadowBlur = 5; ctx.drawImage(WALK, x - w * .55, GY + 4 - h, w, h); ctx.restore();
  }

document.getElementById('new').onclick = () => { seed = (Math.random() * 1e6) | 0; plan(); render(); };
for (const id of ['lean', 'timber', 'wob', 'lw', 'ink', 'haze', 'pilgrim', 'back']) { const el = document.getElementById(id); el.addEventListener('input', render); el.addEventListener('change', render); }
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * VW / r.width, y = (e.clientY - r.top) * VH / r.height;
  for (let i = street.length - 1; i >= 0; i--) { const b = street[i].box; if (b && x > b[0] && x < b[2] && y > b[1] && y < b[3]) { const old = street[i]; const h = makeHouse((Math.random() * 1e9) | 0, old.x, false); street[i] = h; render(); return; } }
});
let loaded = 0; const go = () => { if (++loaded === 2) { plan(); render(); } };
SKY.onload = go; WALK.onload = go; SKY.src = ART_SRC.sky; WALK.src = SPR_SRC.walk;
</script>
