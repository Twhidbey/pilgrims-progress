<title>Pilgrim's Progress · Style lab</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#26252b;font-family:Georgia,'Times New Roman',serif;color:#e9e1d3}
#top{position:sticky;top:0;z-index:2;background:#26252b;padding:8px 8px 6px}
#frame{position:relative;margin:0 auto;width:min(100%,calc(60vh * 16 / 9),1100px)}
canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:8px;background:#444}
#build{position:absolute;right:8px;bottom:5px;font-size:12px;color:rgba(255,250,235,.8);text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
#panel{max-width:1100px;margin:0 auto;padding:2px 12px 40px}
h3{font-weight:400;font-style:italic;font-size:17px;color:#d9b77c;margin:16px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 22px}
label.s{display:flex;flex-direction:column;font-size:15px;color:#d6ccbc}
input[type=range]{width:100%;height:30px;accent-color:#d9b77c;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row span{font-size:15px;color:#a89c8c;margin-right:2px}
button{font-family:inherit;font-size:15px;padding:.45em 1em;border-radius:30px;border:1.5px solid #6d6470;background:#35323b;color:#efe6d4;cursor:pointer}
button.on{border-color:#d9b77c;background:#544a3c}
p.hint{font-size:14px;color:#a89c8c;margin:10px 0 0;line-height:1.45}
#code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c9bfae;word-break:break-all;user-select:all;-webkit-user-select:all}
a{color:#d9b77c}
</style>

// ============================================================
// Style lab: one screen of the layered-silhouette look.
// Every depth layer is one colour. Far layers are pale, near layers dark,
// with mist between them. Rain on the left clears to golden light on the right.
// ============================================================
const VW = 960, VH = 540, GY = 455, PAN = 520;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const tmp = mk(8, 8), tctx = tmp.getContext('2d');      // one scratch canvas, reused for every layer
const sceneC = mk(8, 8), sctx = sceneC.getContext('2d'); // the finished painting (everything but the falling rain)
const skyC = mk(480, 270), kctx = skyC.getContext('2d'); // sky is soft, so half size is plenty
let S = 1;                                                // canvas pixels per scene unit

// ---------- controls ----------
const CTRL = [
  ['Light and weather'],
  { id: 'clear', label: 'Rain ↔ golden light', v: 50 },
  { id: 'rain', label: 'Rain', v: 60 },
  { id: 'gold', label: 'Golden glow', v: 65 },
  { id: 'mist', label: 'Mist between layers', v: 29 },
  ['Layers'],
  { id: 'n', label: 'How many layers', v: 4, min: 2, max: 9 },
  { id: 'depth', label: 'Pale far layers', v: 80 },
  { id: 'thru', label: 'See-through overlap', v: 30 },
  { id: 'soft', label: 'Soft edges', v: 66 },
  ['Shapes'],
  { id: 'city', label: 'Countryside ↔ city', v: 41 },
  { id: 'hills', label: 'Hills', v: 19 },
  { id: 'trees', label: 'Trees', v: 55 },
  { id: 'win', label: 'Lit windows', v: 35 },
  ['Look around'],
  { id: 'walk', label: 'Walk along', v: 0 },
];
const SL = CTRL.filter(c => !Array.isArray(c));
const V = { pal: 0, who: 1, fg: 1, seed: 3 };
for (const c of SL) V[c.id] = c.v;
const DEF = { ...V };

// each palette: rain side (cool) and golden side (warm)
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const PALS = [
  { name: 'Storm to gold', skyC: ['#5d6b80', '#b3bdc7'], skyW: ['#e6c687', '#fff2cc'], hazeC: '#b7c2cc', hazeW: '#ffe9b8', nearC: '#1d2838', nearW: '#3b2a1b', cloud: '#3f4a5c', light: '#fff0c4', win: '#ffd27a' },
  { name: 'Violet dusk', skyC: ['#4c4a6c', '#a8a2be'], skyW: ['#eeb48a', '#ffe6c6'], hazeC: '#aea8c2', hazeW: '#ffdcc0', nearC: '#1c1932', nearW: '#42233a', cloud: '#34304e', light: '#ffe2c2', win: '#ffc978' },
  { name: 'Green morning', skyC: ['#667c7a', '#bccbc4'], skyW: ['#e6da98', '#fbf6d2'], hazeC: '#bfcdc6', hazeW: '#f6efc0', nearC: '#1a2e2b', nearW: '#2f3a1d', cloud: '#465c5a', light: '#fdf6cc', win: '#ffdf8a' },
  { name: 'Ink and paper', skyC: ['#a59c8c', '#ddd5c4'], skyW: ['#e6d5a8', '#f8f0da'], hazeC: '#dcd4c4', hazeW: '#f4e8c8', nearC: '#26221f', nearW: '#3a2c1d', cloud: '#6e665a', light: '#fff4d6', win: '#f6d48e' },
].map(p => { const o = {}; for (const k in p) o[k] = k === 'name' ? p[k] : Array.isArray(p[k]) ? p[k].map(hex) : hex(p[k]); return o; });
const WHO = ['Plain black', 'Silhouette', 'Hidden'];   // owner chose the silhouette (Nov 14 2026)

// ---------- small helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);
const rr = (a, b) => a + (b - a) * R();
// fractal noise, -1..1: big slow shapes with smaller and smaller detail on top (how real land looks)
function mkNoise() {
  const o = R() * 1000, h = i => { const v = Math.sin(i * 127.1 + o) * 43758.5453; return v - Math.floor(v); };
  return (x, wl, oct = 5, gain = .5) => {
    let v = 0, a = 1, t = 0, f = 1 / wl;
    for (let k = 0; k < oct; k++) { const q = x * f + k * 31.7, i = Math.floor(q), u = q - i, w = u * u * (3 - 2 * u); v += a * (lerp(h(i), h(i + 1), w) * 2 - 1); t += a; a *= gain; f *= 2.07; }
    return v / t;
  };
}

// ---------- the weather: 0 = rain, 1 = golden, across the screen ----------
let clearAt = .5;
const warm = fx => smooth(clearAt - .32, clearAt + .32, fx);
// a left-to-right gradient that follows the weather. a and b are [r,g,b] with alphas aa, ab
function hGrad(c, a, b, aa = 1, ab = 1, x0 = 0) {
  const g = c.createLinearGradient(x0, 0, x0 + VW, 0);
  for (let i = 0; i <= 10; i++) { const t = i / 10, w = warm(t); g.addColorStop(t, css(mix(a, b, w), lerp(aa, ab, w))); }
  return g;
}
// draw something soft: paint it small on the scratch canvas, then stretch it back up
function soft(c, q, alpha, op, fn) {
  const w = Math.max(2, Math.ceil(cv.width * q)), h = Math.max(2, Math.ceil(cv.height * q));
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, w + 2, h + 2);
  tctx.setTransform(w / VW, 0, 0, h / VH, 0, 0);
  fn(tctx);
  c.save(); c.globalAlpha = alpha; c.globalCompositeOperation = op || 'source-over';
  c.drawImage(tmp, 0, 0, w, h, 0, 0, VW, VH); c.restore();
}

// ---------- shapes: everything is a filled outline ----------
let L;                                    // the layer being built
const poly = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); L.shapes.push(p); };
const blob = (p, x, y, rx, ry) => { p.moveTo(x + rx, y); p.ellipse(x, y, rx, ry, 0, 0, 6.2832); };

function house(x, gy, w, h, s, tall) {
  const b = gy + 60, top = gy - h, ln = (R() - .5) * .035 * h, k = R();
  let rh;
  if (tall) {                             // a tower or steeple
    rh = w * rr(1.6, 2.6);
    poly([[x, b], [x, top], [x - 1.5 * s, top], [x + w / 2, top - rh], [x + w + 1.5 * s, top], [x + w, top], [x + w, b]]);
  } else if (k < .55) {                   // gable end toward us, sometimes with a jutting upper floor
    rh = w * rr(.5, .85);
    const j = R() < .45 ? 3.5 * s : 0, jy = top + h * rr(.4, .55);
    poly([[x, b], [x, jy], [x - j, jy], [x - j + ln, top], [x - j - 2 * s + ln, top], [x + w / 2 + ln, top - rh], [x + w + j + 2 * s + ln, top], [x + w + j + ln, top], [x + w + j, jy], [x + w, jy], [x + w, b]]);
  } else {                                // roof seen from the side: a long ridge
    rh = w * rr(.22, .38) + 8 * s;
    const e = w * rr(.08, .2);
    poly([[x, b], [x + ln, top], [x - 3 * s + ln, top], [x + e + ln, top - rh], [x + w - e + ln, top - rh], [x + w + 3 * s + ln, top], [x + w + ln, top], [x + w, b]]);
    if (R() < .4 && w > 50 * s) { const dx = x + w * rr(.3, .7), dw = 9 * s; poly([[dx - dw, top - rh * .2], [dx, top - rh * .2 - dw * 1.3], [dx + dw, top - rh * .2]]); }
  }
  if (!tall && R() < .75) {               // chimney
    const cx = x + w * rr(.18, .78) + ln, cw = rr(5, 8) * s, ct = top - rh * rr(.55, 1) - rr(5, 12) * s;
    poly([[cx, top], [cx, ct], [cx - 1.2 * s, ct], [cx - 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct], [cx + cw, ct], [cx + cw, top]]);
  }
  // windows that may be lit
  if (!tall && s > .4) {
    const cols = Math.max(1, Math.round(w / (24 * s))), rows = Math.max(1, Math.floor(h / (34 * s)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      L.wins.push([x + (c + .5) * w / cols - 3 * s + ln * (1 - r / rows), top + 12 * s + r * 32 * s, 6 * s, 8.5 * s, R()]);
  }
}
function tree(x, gy, s, kind) {
  const p = new Path2D(), ln = rr(-5, 5) * s;
  if (kind === 0) {                       // round, leafy
    const th = rr(13, 26) * s, Rr = rr(24, 40) * s, cy = gy - th - Rr * .5;
    poly([[x - 4 * s, gy + 20], [x - 3 * s, gy], [x - 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 3 * s, gy], [x + 4 * s, gy + 20]]);
    for (let i = 0; i < 9; i++) { const a = R() * 6.283, d = R() * Rr * .55; blob(p, x + ln + Math.cos(a) * d * 1.35, cy + Math.sin(a) * d * .75, Rr * rr(.42, .68), Rr * rr(.36, .56)); }
    for (let i = 0; i < 22; i++) { const a = R() * 6.283; blob(p, x + ln + Math.cos(a) * Rr * 1.02, cy + Math.sin(a) * Rr * .6, Rr * rr(.1, .22), Rr * rr(.07, .15)); }
    // a branch or two showing under the leaves
    poly([[x + ln * .6, gy - th * .7], [x + ln + Rr * .5, cy + Rr * .2], [x + ln + Rr * .45, cy + Rr * .3]]);
  } else if (kind === 1) {                // tall and narrow, like a poplar
    const hh = rr(62, 105) * s, w = rr(8, 12) * s, lf = [], rt = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, ww = w * Math.pow(Math.sin(Math.PI * Math.pow(t, .62)), .8) + .6 * s, y = gy - hh * (.1 + t * .9), cx = x + ln * t * .6; lf.push([cx - ww * rr(.82, 1.1), y]); rt.unshift([cx + ww * rr(.82, 1.1), y]); }
    poly([[x - 1.5 * s, gy + 20], ...lf, ...rt, [x + 1.5 * s, gy + 20]]);
  } else {                                // a low bush or hedge
    const n = 3 + (R() * 4 | 0);
    for (let i = 0; i < n; i++) blob(p, x + (i - n / 2) * 11 * s + rr(-3, 3) * s, gy - rr(3, 9) * s, rr(8, 14) * s, rr(7, 13) * s);
  }
  L.shapes.push(p);
}
function tuft(x, gy, hgt) {
  const n = 3 + (R() * 4 | 0);
  for (let i = 0; i < n; i++) { const bx = x + (i - n / 2) * 3, h = hgt * rr(.5, 1), lx = rr(-.5, .5) * h; poly([[bx - 1.3, gy + 4], [bx + lx, gy - h], [bx + 1.3, gy + 4]]); }
}
// a field fence far enough back to look the right size next to Christian
function fence(x0, gy, n) {
  for (let k = 0, x = x0; k < n; k++, x += 15) {
    const t = rr(-1, 1), y = gy(x), y2 = gy(x + 15);
    poly([[x - 1.1, y + 3], [x - 1.1 + t, y - 13 - rr(0, 2)], [x + 1.1 + t, y - 13], [x + 1.1, y + 3]]);
    if (k < n - 1) { poly([[x, y - 10.5], [x + 15, y2 - 10.5 + rr(-.7, .7)], [x + 15, y2 - 9], [x, y - 9]]); poly([[x, y - 5.5], [x + 15, y2 - 5.5 + rr(-.7, .7)], [x + 15, y2 - 4.2], [x, y - 4.2]]); }
  }
}

// ---------- build the layers (shapes only; colour comes at paint time) ----------
let layers = [], front = null;
function build() {
  const n = V.n, hills = V.hills / 50, treeAmt = V.trees / 100;
  layers = [];
  for (let i = 0; i < n; i++) {
    const d = n === 1 ? 1 : i / (n - 1);
    R = rng(V.seed * 7919 + i * 977 + 11);
    const last = i === n - 1, first = i === 0 && n > 2;
    const par = .05 + .95 * Math.pow(d, 1.6), W = VW + PAN * par + 60;
    const s = .26 + .74 * Math.pow(d, 1.15);
    const base = lerp(292, GY, Math.pow(d, .9));
    const edge = lerp(-140, VW + 160, V.city / 100) * (1 + PAN * par / VW * .25) + rr(-50, 50);
    const amp = last ? 0 : lerp(105, 24, Math.pow(d, .55)) * hills * (first ? 1.25 : 1);
    const nz = mkNoise(), cl = mkNoise(), wd = mkNoise(), fine = mkNoise(), wl = lerp(380, 640, d);
    // a mountain range: long ridgelines that rise to rounded peaks, with shoulders and small crags
    const range = (x, w, sharp) => {
      const n0 = nz(x + 70 * wd(x, 400, 2), w, 3, .45) * 2.3, r = 1 - Math.min(1, Math.sqrt(n0 * n0 + .02) - .1);   // ridges with rounded tops
      const roll = clamp(nz(x + 999, w * .55, 4, .5) * 1.7 * .5 + .5);                      // rolling shoulders
      return Math.pow(r, sharp) * .68 + roll * .32 + fine(x, 46, 3, .5) * .022;
    };
    const gy = x => {
      if (last) return GY;
      if (first) return base - 14 - amp * range(x, 820, 1.7);
      // rolling hills: broad rounded tops, wide valleys, and a rough edge where woods grow on the skyline
      let v = clamp(nz(x + 90 * wd(x, 500, 2), wl, 5, .46) * 1.9 * .5 + .5);
      v = Math.pow(v, 1.25);
      const woods = smooth(.05, .4, wd(x + 300, 260 * s + 90, 2)) * (fine(x, 15 * s + 3, 2, .6) * .5 + .5) * 5.5 * s;
      const cityFlat = lerp(.5, 1, smooth(edge - 120, edge + 260, x));
      return base - amp * v * cityFlat - woods * cityFlat;
    };
    L = { d, par, W, base, s, shapes: [], wins: [], gy };
    const hp = [[-30, VH + 20]]; for (let x = -30; x <= W + 6; x += 2.5) hp.push([x, gy(x)]); hp.push([W + 6, VH + 20]);
    if (first) {                            // a second, paler range behind: same colour, half strength
      const bp = [[-30, VH + 20]]; for (let x = -30; x <= W + 6; x += 2.5) bp.push([x, base - 34 - amp * 1.25 * range(x * .8 + 4321, 1000, 1.5)]); bp.push([W + 6, VH + 20]);
      poly(bp); L.back = L.shapes.pop();
    }
    poly(hp);
    if (last) {
      // the ground Christian walks on
      for (let x = rr(0, 30); x < W; x += rr(16, 70)) tuft(x, GY, rr(5, 13));
    } else if (!first) {
      // city on the left
      const hh = lerp(62, 118, d);
      let steeple = d < .55 && R() < .8 ? rr(.25, .75) : -1;
      for (let x = -50 * s - R() * 50 * s; x < edge;) {
        const tp = clamp((edge - x) / (300 * s), .5, 1);
        const w = rr(44, 88) * s, h = rr(.5, 1) * hh * tp;
        if (steeple >= 0 && x > edge * steeple) { steeple = -1; const tw = rr(20, 26) * s; house(x, gy(x + tw / 2), tw, hh * 1.25, s, true); x += tw * .7; continue; }
        house(x, gy(x + w / 2), w, h, s);
        x += w + rr(-9, 5) * s; if (R() < .1) x += rr(14, 50) * s;
      }
      // countryside on the right: trees gather in groves, with open fields between
      for (let x = Math.max(edge + 20 * s, -30); x < W + 30; x += rr(16, 46) * s / (.25 + treeAmt)) {
        if (cl(x, 420 * s + 120) * .5 + .5 > treeAmt * 1.15 - .08) continue;
        const k = R(); tree(x, gy(x), s * rr(.75, 1.2), k < .58 ? 0 : k < .78 ? 1 : 2);
      }
      // an odd tree among the houses
      for (let x = rr(60, 200); x < edge - 60; x += rr(160, 420)) if (R() < treeAmt) tree(x, gy(x), s * rr(.7, 1), R() < .6 ? 0 : 1);
      if (i === n - 2) for (let x = Math.max(edge + 90, 30); x < W - 150; x += rr(380, 560)) fence(x, gy, 8 + (R() * 8 | 0));
    }
    layers.push(L);
  }
  // framing in front of everything: a trunk and hanging leaves on the left, tall grass along the bottom
  R = rng(V.seed * 31 + 5);
  L = front = { d: 1.3, par: 1.3, W: VW + PAN * 1.3 + 60, shapes: [], wins: [] };
  poly([[-40, VH + 10], [-30, -10], [8, -10], [10, 120], [16, 300], [34, VH + 10]]);
  poly([[6, 46], [150, 8], [300, -10], [6, -10]]);
  { const p = new Path2D();
    for (let i = 0; i < 60; i++) { const x = rr(-20, 330), y = rr(-12, 18) + (1 - x / 330) * rr(0, 50); blob(p, x, y, rr(9, 20), rr(6, 12)); }
    for (let i = 0; i < 90; i++) { const x = rr(0, 360); blob(p, x, rr(8, 34) + (1 - x / 360) * rr(10, 78), rr(2.5, 6), rr(1.5, 3.5)); }
    L.shapes.push(p); }
  poly([[-30, VH + 10], [-30, VH - 12], [L.W, VH - 10], [L.W, VH + 10]]);
  for (let x = -10; x < L.W; x += rr(5, 22)) { const big = R() < .25; tuft(x, VH - 10, big ? rr(26, 52) : rr(8, 22)); }
}

// ---------- sky (cached; only changes with the sliders) ----------
function paintSky() {
  const P = PALS[V.pal], c = kctx, rain = V.rain / 100, gold = V.gold / 100;
  R = rng(V.seed * 13 + 3);
  c.setTransform(480 / VW, 0, 0, 270 / VH, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = hGrad(c, P.skyC[0], P.skyW[0]); c.fillRect(0, 0, VW, VH);
  // the lower sky fades in over the upper sky
  soft(c, .25, 1, 'source-over', t => {
    t.fillStyle = hGrad(t, P.skyC[1], P.skyW[1]); t.fillRect(0, 0, VW, VH);
    t.globalCompositeOperation = 'destination-in';
    const g = t.createLinearGradient(0, 0, 0, GY - 60); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
    t.fillStyle = g; t.fillRect(0, 0, VW, VH);
  });
  // the shining light
  const sx = SUN[0], sy = SUN[1], vis = warm(sx / VW) * gold;
  let g = c.createRadialGradient(sx, sy, 0, sx, sy, 330);
  g.addColorStop(0, css(P.light, .95 * vis)); g.addColorStop(.12, css(P.light, .6 * vis)); g.addColorStop(.45, css(P.light, .2 * vis)); g.addColorStop(1, css(P.light, 0));
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  // clouds: heavy and dark over the rain, thin and bright toward the light
  const puff = (x, y, rx, ry, col, a) => { c.save(); c.translate(x, y); c.scale(rx, ry); const q = c.createRadialGradient(0, 0, 0, 0, 0, 1); q.addColorStop(0, css(col, a)); q.addColorStop(.55, css(col, a * .55)); q.addColorStop(1, css(col, 0)); c.fillStyle = q; c.fillRect(-1, -1, 2, 2); c.restore(); };
  for (let i = 0; i < 70; i++) { const x = rr(-80, VW + 80), y = rr(-30, 210) * rr(.3, 1), w = 1 - warm(x / VW); const a = rr(.1, .22) * w * (.35 + rain * .75); if (a > .01) puff(x, y, rr(70, 200), rr(22, 56), P.cloud, a); }
  for (let i = 0; i < 22; i++) { const x = rr(-80, VW + 80), y = rr(20, 250), w = warm(x / VW); const a = rr(.12, .3) * w * (.3 + gold * .7); if (a > .01) puff(x, y, rr(80, 220), rr(7, 18), P.light, a); }
}
const SUN = [790, 205];

// ---------- paint the whole picture ----------
let fig = null, figSil = mk(8, 8);
function layerCol(P, d) {
  const t = 1 - (V.depth / 100) * .95 * (1 - Math.pow(clamp(d), 1.35));
  return [mix(P.hazeC, P.nearC, t), mix(P.hazeW, P.nearW, t)];
}
function paintLayer(c, P, Lr, off, col, alpha, q) {
  soft(c, q, alpha, 'source-over', t => {
    t.translate(-off, 0);
    t.fillStyle = hGrad(t, col[0], col[1], 1, 1, off);
    if (Lr.back) { t.globalAlpha = .5; t.fill(Lr.back); t.globalAlpha = 1; }
    for (const p of Lr.shapes) t.fill(p);
  });
}
function paint() {
  const P = PALS[V.pal], c = sctx, n = layers.length;
  const rain = V.rain / 100, gold = V.gold / 100, mist = V.mist / 100, thru = V.thru / 100, sf = V.soft / 100, pan = V.walk / 100 * PAN;
  clearAt = 1.3 - V.clear / 100 * 1.6;
  paintSky();
  c.setTransform(S, 0, 0, S, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.imageSmoothingQuality = 'high';
  c.drawImage(skyC, 0, 0, VW, VH);
  // a few birds in the clear sky
  R = rng(V.seed + 77); c.lineCap = 'round';
  for (let i = 0; i < 6; i++) { const x = rr(520, 900), y = rr(70, 190), w = rr(4, 8), a = warm(x / VW) * .5; c.strokeStyle = css(P.nearW, a); c.lineWidth = 1.3; c.beginPath(); c.moveTo(x - w, y - w * .35); c.quadraticCurveTo(x - w * .4, y - w * .6, x, y); c.quadraticCurveTo(x + w * .4, y - w * .6, x + w, y - w * .3); c.stroke(); }
  const mid = Math.max(0, Math.floor((n - 1) / 2) - (n > 4 ? 0 : 1));
  for (let i = 0; i < n; i++) {
    const Lr = layers[i], off = pan * Lr.par, col = layerCol(P, Lr.d), last = i === n - 1;
    const alpha = last ? 1 : 1 - thru * .62;
    const q = 1 / (1 + sf * (5 * Math.pow(1 - Lr.d, 1.3) + .5));
    paintLayer(c, P, Lr, off, col, alpha, q);
    // lit windows
    const wn = V.win / 100;
    if (wn > 0) for (const w of Lr.wins) {
      if (w[4] > wn * .6) continue;
      const x = w[0] - off; if (x < -20 || x > VW + 20) continue;
      const a = (.55 + .45 * Lr.d) * (1 - warm(x / VW) * .75) * alpha;
      const g = c.createRadialGradient(x + w[2] / 2, w[1] + w[3] / 2, 0, x + w[2] / 2, w[1] + w[3] / 2, w[3] * 2.4);
      g.addColorStop(0, css(P.win, a * .45)); g.addColorStop(1, css(P.win, 0));
      c.fillStyle = g; c.fillRect(x - w[3] * 2.4, w[1] - w[3] * 2.4, w[3] * 5.4, w[3] * 5.4);
      c.fillStyle = css(P.win, a); c.fillRect(x, w[1], w[2], w[3]);
    }
    if (last) break;
    // mist settles in front of this layer, behind the next one
    const nb = layers[i + 1].base, m = mist * lerp(.62, .34, Lr.d);
    const g = c.createLinearGradient(0, Lr.base - 150, 0, nb + 30);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
    soft(c, .2, m, 'source-over', t => {
      t.fillStyle = hGrad(t, P.hazeC, P.hazeW); t.fillRect(0, 0, VW, VH);
      t.globalCompositeOperation = 'destination-in';
      const v = t.createLinearGradient(0, Lr.base - 150, 0, nb + 30); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(.75, 'rgba(0,0,0,.8)'); v.addColorStop(1, '#000');
      t.fillStyle = v; t.fillRect(0, 0, VW, VH);
    });
    if (i === mid) {
      // far-off sheets of rain
      R = rng(V.seed + 5);
      if (rain > 0) soft(c, .1, rain * .9, 'source-over', t => {
        t.lineCap = 'butt';
        for (let k = 0; k < 16; k++) { const x = rr(-60, VW + 100), a = (1 - warm(x / VW)) * rr(.05, .16); if (a < .01) continue; t.strokeStyle = css(mix(P.hazeC, P.cloud, .35), a); t.lineWidth = rr(30, 110); t.beginPath(); t.moveTo(x, -30); t.lineTo(x - 95, GY + 30); t.stroke(); }
      });
      // glow and soft beams from the light
      const vis = warm(SUN[0] / VW) * gold;
      if (vis > .01) soft(c, .14, vis, 'screen', t => {
        const g2 = t.createRadialGradient(SUN[0], SUN[1], 0, SUN[0], SUN[1], 420);
        g2.addColorStop(0, css(P.light, .75)); g2.addColorStop(.3, css(P.light, .3)); g2.addColorStop(1, css(P.light, 0));
        t.fillStyle = g2; t.fillRect(0, 0, VW, VH);
        R = rng(V.seed + 9);
        for (let k = 0; k < 9; k++) {
          const a = lerp(1.25, 2.85, (k + rr(.1, .9)) / 9), da = rr(.025, .07), len = 900;
          const rg = t.createRadialGradient(SUN[0], SUN[1], 30, SUN[0], SUN[1], len * .75);
          rg.addColorStop(0, css(P.light, rr(.16, .34))); rg.addColorStop(1, css(P.light, 0));
          t.fillStyle = rg; t.beginPath(); t.moveTo(SUN[0], SUN[1]); t.lineTo(SUN[0] + Math.cos(a - da) * len, SUN[1] + Math.sin(a - da) * len); t.lineTo(SUN[0] + Math.cos(a + da) * len, SUN[1] + Math.sin(a + da) * len); t.fill();
        }
      });
    }
  }
  // puddles on the rainy road catch the sky
  R = rng(V.seed + 21);
  const gl = layers[n - 1], goff = pan * gl.par;
  for (let k = 0; k < 7; k++) {
    const x = rr(20, gl.W * .8) - goff, w = rr(26, 80), a = (1 - warm(x / VW)) * rain * .5;
    if (a < .02 || x < -90 || x > VW + 90) continue;
    c.fillStyle = css(mix(P.skyC[1], P.hazeC, .5), a); c.beginPath(); c.ellipse(x, GY + rr(9, 30), w, w * .09, 0, 0, 6.2832); c.fill();
  }
  // Christian
  if (V.who < 2 && fig) {
    const h = 156, w = fig.width * h / fig.height, x = 330, y = GY + 3;
    if (V.who === 0) {
      c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x, GY + 3, 30, 4.5, 0, 0, 6.2832); c.fill();
      c.drawImage(fig, x - w * .5, y - h, w, h);
    } else {
      const k = figSil.getContext('2d'), col = layerCol(P, 1), wm = warm(x / VW);
      figSil.width = fig.width; figSil.height = fig.height;
      k.drawImage(fig, 0, 0); k.globalCompositeOperation = 'source-in';
      k.fillStyle = css(mix(col[0], col[1], wm)); k.fillRect(0, 0, fig.width, fig.height);
      k.globalCompositeOperation = 'source-over'; for (let r = 0; r < 5; r++) k.drawImage(figSil, 0, 0);   // make thin paint solid, so no pale spots show through
      // the light catches his front edge
      k.globalCompositeOperation = 'source-atop';
      const g = k.createLinearGradient(fig.width * .45, 0, fig.width, 0); g.addColorStop(0, css(P.light, 0)); g.addColorStop(1, css(P.light, .3 * gold * (.3 + .7 * wm)));
      k.fillStyle = g; k.fillRect(0, 0, fig.width, fig.height);
      c.drawImage(figSil, x - w * .5, y - h, w, h);
    }
  }
  // framing in front
  if (V.fg) { const col = layerCol(P, 1).map(v => mix(v, [8, 8, 12], .4)); paintLayer(c, P, front, pan * front.par, col, 1, 1 / (1 + .6 + sf)); }
  // the rain side is dulled, the golden side is warmed
  c.globalCompositeOperation = 'multiply';
  c.fillStyle = hGrad(c, mix(P.cloud, [255, 255, 255], .45), [255, 255, 255], .2 + rain * .5, 0); c.fillRect(0, 0, VW, VH);
  c.globalCompositeOperation = 'soft-light';
  c.fillStyle = hGrad(c, P.light, P.light, 0, gold * .5); c.fillRect(0, 0, VW, VH);
  c.globalCompositeOperation = 'source-over';
  const vg = c.createRadialGradient(VW / 2, VH * .45, VH * .45, VW / 2, VH * .45, VW * .72);
  vg.addColorStop(0, 'rgba(20,18,28,0)'); vg.addColorStop(1, 'rgba(20,18,28,.3)');
  c.fillStyle = vg; c.fillRect(0, 0, VW, VH);
  // a little paper grain so flat colour feels painted
  c.globalCompositeOperation = 'multiply'; c.globalAlpha = .1;
  c.fillStyle = c.createPattern(paper, 'repeat'); c.fillRect(0, 0, VW, VH);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}
const paper = mk(200, 200);
{ const c = paper.getContext('2d'), d = c.createImageData(200, 200), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = 205 + r() * 50; d.data[i] = v; d.data[i + 1] = v - 2; d.data[i + 2] = v - 6; d.data[i + 3] = 255; }
  c.putImageData(d, 0, 0); }

// ---------- falling rain (the only thing that moves) ----------
const drops = []; { const r = rng(9); for (let i = 0; i < 260; i++) drops.push({ x: r() * (VW + 160), y: r() * VH, l: 14 + r() * 24, v: 9 + r() * 8, a: .12 + r() * .3 }); }
function frame() {
  if (dirty) { if (dirty > 1) build(); paint(); dirty = 0; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sceneC, 0, 0);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  const P = PALS[V.pal], n = Math.round(V.rain / 100 * drops.length);
  ctx.strokeStyle = css(mix(P.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v; d.x -= d.v * .2; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)); if (a < .02) continue;
    ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- page plumbing ----------
let dirty = 2;                              // 1 = repaint, 2 = rebuild shapes and repaint
function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  S = clamp(cv.clientWidth * dpr / VW, .4, 2);
  const w = Math.round(VW * S), h = Math.round(VH * S);
  if (cv.width === w && cv.height === h) return;
  for (const k of [cv, tmp, sceneC]) { k.width = w; k.height = h; }
  dirty = Math.max(dirty, 1);
}
const SHAPE_IDS = { n: 1, city: 1, hills: 1, trees: 1 };
function save() {
  const s = SL.map(c => V[c.id]).join('.') + '-' + [V.pal, V.who, V.fg, V.seed].join('.');
  document.getElementById('code').textContent = 'look=' + s;
  try { history.replaceState(null, '', '#' + s); } catch (e) {}
}
function load() {
  const m = location.hash.slice(1).split('-'); if (m.length !== 2) return;
  const a = m[0].split('.').map(Number), b = m[1].split('.').map(Number);
  SL.forEach((c, i) => { if (Number.isFinite(a[i])) V[c.id] = clamp(a[i], c.min ?? 0, c.max ?? 100); });
  if (b.length === 4 && b.every(Number.isFinite)) { V.pal = clamp(b[0], 0, PALS.length - 1) | 0; V.who = clamp(b[1], 0, 2) | 0; V.fg = b[2] ? 1 : 0; V.seed = b[3] | 0; }
}
function ui() {
  const box = document.getElementById('ctrls'); box.innerHTML = '';
  let grid;
  for (const c of CTRL) {
    if (Array.isArray(c)) { const h = document.createElement('h3'); h.textContent = c[0]; box.appendChild(h); grid = document.createElement('div'); grid.className = 'grid'; box.appendChild(grid); continue; }
    const l = document.createElement('label'); l.className = 's'; l.textContent = c.label;
    const r = document.createElement('input'); r.type = 'range'; r.min = c.min ?? 0; r.max = c.max ?? 100; r.value = V[c.id];
    r.oninput = () => { V[c.id] = +r.value; dirty = Math.max(dirty, SHAPE_IDS[c.id] ? 2 : 1); save(); };
    l.appendChild(r); grid.appendChild(l);
  }
  const group = (id, names, key) => {
    const el = document.getElementById(id); el.innerHTML = '';
    names.forEach((nm, i) => { const b = document.createElement('button'); b.textContent = nm; b.className = V[key] === i ? 'on' : ''; b.onclick = () => { V[key] = i; dirty = Math.max(dirty, 1); ui(); save(); }; el.appendChild(b); el.append(' '); });
  };
  group('pals', PALS.map(p => p.name), 'pal'); group('whos', WHO, 'who');
  document.getElementById('fg').className = V.fg ? 'on' : '';
}
document.getElementById('new').onclick = () => { V.seed = (V.seed % 999) + 1; dirty = 2; save(); };
document.getElementById('fg').onclick = () => { V.fg = V.fg ? 0 : 1; dirty = Math.max(dirty, 1); ui(); save(); };
document.getElementById('reset').onclick = () => { const keep = V.seed; Object.assign(V, DEF, { seed: keep }); dirty = 2; ui(); save(); };
addEventListener('resize', fit);
load(); ui(); fit(); save();
{ const im = new Image(); im.onload = () => { fig = im; dirty = Math.max(dirty, 1); }; im.src = SPR_SRC; }
requestAnimationFrame(frame);
</script>
