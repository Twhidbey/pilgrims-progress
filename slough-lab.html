<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilgrim's Progress · Slough lab</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#1d1d20;font-family:Georgia,'Times New Roman',serif;color:#e9e1d3}
#top{padding:8px 8px 6px}

</style>
</head>
<body>
<div id="top"><div id="frame"><canvas id="cv"></canvas><div id="build">slough lab · build 77 · Nov 15 2026</div></div></div>
<div id="panel">
  <div class="row" id="shots"></div>
  <div class="row"><button id="new">Another oak</button><button id="play">Watch them move</button></div>
  <canvas id="mv" width="640" height="380" style="display:none;width:min(100%,640px);aspect-ratio:640/380;margin-top:8px"></canvas>
  <p id="note"></p>
  <p>Three still pictures for Level 2, the Slough of Despond, to settle the look before it is built. Nothing moves yet. <a href="story-lab.html">Level 1</a></p>
</div>
<script>
// ============================================================
// Slough lab: three stills for Level 2 (the Slough of Despond).
// A silver picture with a breath of colour: dark sky, white mist, still water that mirrors, one black twisted oak.
// To be deleted once the level is built (keep the files trim).
// ============================================================
const VW = 960, VH = 540, S = 2, CHR_K = .52;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'); cv.width = VW * S; cv.height = VH * S;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// The whole picture is painted in tones between these two: cool in the darks, warm in the lights (the breath of colour).
const DARK = [17, 19, 27], LIGHT = [247, 243, 233], GOLD = [255, 205, 120];
const tone = v => mix(DARK, LIGHT, clamp(v));

// ---------- the three pictures ----------
// z = how wide the camera is (Level 1 is 1; smaller = further back), cx = where it looks along the road (the oak stands at 0),
// wl = the water line on the screen, mist 0..1, veil = mist over the far bank, gold = how much colour has come back
const SHOTS = [
  { name: '1 · The fall', z: .8, cx: -470, wl: 392, mist: 1, veil: .84, gold: 0, disc: .3, sky: .36,
    note: 'They fall in. Two small figures in white nothing; the oak is only a grey shape far off. The few lights he gathered are the only colour left.' },
  { name: '2 · Help', z: .66, cx: -250, wl: 352, mist: .3, veil: 0, gold: .1, disc: 1, sky: .2,
    note: 'He cannot climb out. The camera has drawn back. The long limb reaches over the water as Help kneels and grips the hand of Christian, sunk to the chest; the far light sits in the branches.' },
  { name: '3 · Looking back', z: .74, cx: -330, wl: 372, mist: .25, veil: 0, gold: 1, disc: 1, sky: .26,
    note: 'On sound ground he looks back. His lights settle on the steps that were there all along, each doubled in the water, and the gold comes back from the oak outward.' }
];
let shot = Math.max(0, Math.min(2, (parseInt(location.hash.slice(1)) || 2) - 1)), oakSeed = parseInt(location.hash.split('.')[1]) || 18;

// ---------- noise ----------
function noise2(seed) {
  const h = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7 + seed) * 43758.5453; return v - Math.floor(v); };
  const n = (x, y) => { const i = Math.floor(x), j = Math.floor(y), u = x - i, v = y - j, a = u * u * (3 - 2 * u), b = v * v * (3 - 2 * v);
    return lerp(lerp(h(i, j), h(i + 1, j), a), lerp(h(i, j + 1), h(i + 1, j + 1), a), b); };
  return (x, y) => { let s = 0, a = 1, t = 0; for (let k = 0; k < 5; k++) { s += a * n(x, y); t += a; a *= .5; x = x * 2.03 + 17; y = y * 2.03 + 9; } return s / t; };
}

// ---------- the oak: a thick short trunk, great low limbs that wander and elbow, a lace of twigs ----------
// Returns ribbons: each a line of [x, y, width] points. 0,0 is the foot of the trunk; up is -y. Angles: 0 = up, + = right.
function oak(seed, hero = true, depth = 4) {
  const R = rng(seed), rr = (a, b) => a + (b - a) * R(), out = [];
  function grow(x, y, a, len, w, d, o = {}) {
    const step = Math.max(2.6, len / 24), n = Math.max(3, Math.round(len / step)), w0 = o.w0 ?? w, pts = [[x, y, Math.max(w, w0)]], taper = o.taper ?? .62;
    let nextKid = rr(.16, .34) * n, side = R() < .5 ? -1 : 1;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      a += (R() - .5) * (o.wander ?? .36);
      if (R() < (o.elbow ?? .08)) a += (R() < .5 ? -1 : 1) * rr(.3, .65);          // a sudden elbow: what makes an oak look old
      const ga = o.guide ? o.guide(t) : null; if (ga != null) a += (ga - a) * .22; else a -= a * t * t * .13;          // tips turn up toward the sky
      if (y > -14 && !o.guide) a *= .8;                                            // nothing grows into the ground
      x += Math.sin(a) * step; y -= Math.cos(a) * step;
      // a branch leaves its parent as thick as the parent and narrows over a short way: the collar that makes a fork look grown, not stuck on
      const ww = w * (1 - taper * t) + Math.max(0, w0 - w) * Math.exp(-i * step / (w0 * .6)); pts.push([x, y, ww]);
      if (d > 0 && i >= nextKid && i < n) {
        side = -side; if (R() < .25) side = -side;
        if (o.reach && R() < .75) side = 1;                                        // the reaching limb sends its shoots upward
        const ka = a + side * rr(.45, 1.15), kl = len * (1 - t * .6) * rr(.42, .78), kw = ww * rr(.5, .76);
        if (kl > 6 && kw > .3) grow(x, y, ka, kl, kw, d - 1, { w0: ww * .9 });
        nextKid = i + rr(.09, .22) * n;
      }
    }
    out.push(pts);
    if (d > 0 && !o.stub) { const ew = w * (1 - taper); grow(x, y, a - rr(.3, .7), len * .42, ew * .85, d - 1, { w0: ew }); grow(x, y, a + rr(.3, .7), len * .36, ew * .75, d - 1, { w0: ew }); }
    return [x, y, a];
  }
  if (!hero) {                                                                     // a plain bare tree for the far mist
    const [x, y] = grow(0, 0, rr(-.15, .15), 80, 20, 0, { taper: .3, wander: .12, elbow: 0 });
    for (const a of [-1.1, -.45, .2, .9]) grow(x, y, a + rr(-.2, .2), rr(150, 230), rr(9, 13), depth);
    return out;
  }
  // The great limbs sweep out wide from the head of a short thick trunk. Each one leaves the trunk along the trunk's own line,
  // as thick as the trunk can spare, and curves away to its own direction while it narrows: a smooth join, not a stuck-on one.
  const [tx, ty, ta] = grow(0, 0, -.06, 92, 58, 0, { wander: .1, elbow: 0, taper: .14, w0: 90, guide: t => lerp(-.06, -.24, t) });
  const limb = (dx, dy, to, len, w, o = {}) => grow(tx + dx, ty + dy, lerp(ta, to, .35), len, w, depth, { w0: 40, ...o,
    guide: t => t < .13 ? lerp(lerp(ta, to, .35), to, t / .13) : o.then ? o.then((t - .13) / .87) : null });
  // the limb that reaches out over the water: long and low, nearly level, sagging only a little under its own weight and lifting a little at its end
  limb(-8, 9, -1.34, 372, 25, { wander: .2, elbow: .03, taper: .7, reach: true, w0: 44, then: t => t < .6 ? lerp(-1.34, -1.61, t / .6) : lerp(-1.61, -1.3, (t - .6) / .4) });
  limb(-4, 2, -.74, 250, 24); limb(0, 0, -.1, 236, 22); limb(4, 2, .54, 262, 24);
  limb(9, 14, 1.24, 304, 23, { w0: 44 });
  // roots gripping the bank
  // (each root starts deep inside the trunk, so its square end never shows as a notch on the trunk's edge)
  grow(-2, -30, -2.4, 112, 14, 0, { wander: .12, elbow: 0, taper: .9, w0: 40, guide: t => lerp(-2.5, -1.72, t * 2) });
  grow(4, -30, 2.4, 124, 14, 0, { wander: .12, elbow: 0, taper: .9, w0: 40, guide: t => lerp(2.5, 1.7, t * 2) });
  return out;
}
function ribbons(c, tree) {
  c.beginPath();
  for (const p of tree) {
    const n = p.length, L = [], Rr = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, w = Math.max(.35, p[i][2]) / 2;
      L.push([p[i][0] - dy / l * w, p[i][1] + dx / l * w]); Rr.push([p[i][0] + dy / l * w, p[i][1] - dx / l * w]);
    }
    c.moveTo(L[0][0], L[0][1]); for (let i = 1; i < n; i++) c.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) c.lineTo(Rr[i][0], Rr[i][1]); c.closePath();
  }
  c.fill();
  c.beginPath(); for (const p of tree) if (p[0][2] > 2 && p[0][1] < -30) { c.moveTo(p[0][0] + p[0][2] / 2, p[0][1]); c.arc(p[0][0], p[0][1], p[0][2] / 2, 0, 7); } c.fill();   // round where a branch begins
}
let OAK = oak(oakSeed);
const GHOSTS = [[-760, .5, 3, .8], [-1500, .36, 5, .88], [560, .46, 8, .84], [-230, .3, 9, .9], [-2300, .42, 12, .86]].map(g => ({ x: g[0], p: g[1], t: g[3], tree: oak(g[2], false, 3) }));

// ---------- the land: the far bank (sound ground, where the oak stands) and the bank they fell from ----------
const bankN = noise2(4);
const BANK0 = -160, HOME0 = -905;                       // where each bank meets the water
const bankY = x => x >= BANK0 ? -(30 * smooth(BANK0, BANK0 + 105, x) + (bankN(x * .012, 1) - .5) * 14 * smooth(BANK0, BANK0 + 150, x))
                 : x <= HOME0 ? -(20 * smooth(HOME0, HOME0 - 90, x) + (bankN(x * .012, 7) - .5) * 10 * smooth(HOME0, HOME0 - 120, x)) : 0;

// ---------- the people (frames from the game's packs) ----------
const CHR = [], PLI = [], STD = []; const HELPF = [], REACH = [], LIFT = [];
const META = { chr: { ax: 93, ground: 295 }, pli: { ax: 98, ground: 298 }, std: { ax: 101, ground: 302 }, help: { ax: 94, ground: 309 }, reach: { ax: 70, ground: 307 }, lift: { ax: 257, ground: 307 } };
// lift: both men in one picture (assets/lift.pack), placed by Help's front boot on the bank; the water line is 10 below `ground`   // reach: Christian reaching up (assets/christian-reach.pack)
// Where the two hands are, in video pixels from each figure's feet: Help's open hand is 82 left of his front boot and 55 up;
// Christian's fingertips are 129 right of his feet and 283 up. He stands so that his hand overlaps Help's by 15.
const GRASP = { dx: -(82 - 15 + 129), dy: 283 - 55 };   // Help's frames (assets/help.pack) are placed by his front boot, which stays put while he kneels
async function loadPack(name, into, only) {
  const buf = await (await fetch('assets/' + name + '.pack?v=6')).arrayBuffer(), dv = new DataView(buf), n = dv.getUint32(0, true);
  let off = 4 + 4 * n; const jobs = [];
  for (let i = 0; i < n; i++) { const len = dv.getUint32(4 + 4 * i, true), o = off; off += len;
    if (!only || only.includes(i)) jobs.push(createImageBitmap(new Blob([buf.slice(o, o + len)], { type: 'image/webp' })).then(im => { into[i] = im; })); }
  await Promise.all(jobs);
}
const figC = mk(8, 8);
// one figure, tinted, standing with its feet at world (x, y); nothing of it is drawn below the water line `cut`
function figure(c, im, meta, x, y, face, tint, k, cut) {
  if (!im) return;
  const f = figC.getContext('2d'); figC.width = im.width; figC.height = im.height;
  f.drawImage(im, 0, 0); f.globalCompositeOperation = 'multiply'; f.fillStyle = css(tint); f.fillRect(0, 0, im.width, im.height);
  f.globalCompositeOperation = 'destination-in'; f.drawImage(im, 0, 0); f.globalCompositeOperation = 'source-over';
  c.save();
  if (cut != null) { c.beginPath(); c.rect(-1e5, -1e5, 2e5, 1e5 + cut); c.clip(); }
  c.translate(x, y); c.scale(face * k, k); c.drawImage(figC, -meta.ax, -meta.ground); c.restore();
}

// ---------- soft drawing: paint small, stretch back up ----------
const tmp = mk(VW * S * .125, VH * S * .125);
function soft(c, alpha, fn, op) {
  const t = tmp.getContext('2d'); t.setTransform(1, 0, 0, 1, 0, 0); t.clearRect(0, 0, tmp.width, tmp.height); t.setTransform(tmp.width / VW, 0, 0, tmp.height / VH, 0, 0);
  fn(t); c.save(); c.globalAlpha = alpha; c.globalCompositeOperation = op || 'source-over'; c.drawImage(tmp, 0, 0, VW, VH); c.restore();
}
const glow = (c, x, y, r, col, a) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, css(col, a)); g.addColorStop(.35, css(col, a * .45)); g.addColorStop(1, css(col, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); };

const skyC = mk(240, 135), nearC = mk(VW * S, VH * S), paper = mk(256, 256), cloudN = noise2(21);
{ const c = paper.getContext('2d'), d = c.createImageData(256, 256), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = 200 + r() * 55; d.data[i] = v; d.data[i + 1] = v - 1; d.data[i + 2] = v - 4; d.data[i + 3] = 255; }
  c.putImageData(d, 0, 0); }

// the last phrase of the tune ("was blind, but now I see"), as heights for the lights on the steps: a higher note floats higher
const STEP_NOTES = [0, 4, 2, 0, 4, 2, 0, -3, -5, -3, 0];

function paint() {
  const sh = SHOTS[shot], z = sh.z, wl = sh.wl, hor = wl - 140 * z;            // the horizon, by the game's own depth rule
  const X = x => (x - sh.cx) * z + VW / 2, Y = y => wl + y * z;
  const warmth = sh.gold, lightCol = mix(LIGHT, GOLD, warmth * .8);
  const discX = X(72), discY = Y(-258);
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // --- sky: dark above, luminous toward the horizon, long soft clouds ---
  { const k = skyC.getContext('2d'), d = k.createImageData(240, 135);
    for (let j = 0; j < 135; j++) for (let i = 0; i < 240; i++) {
      const fy = j / 134, cl = cloudN(i * .016 + shot * 3, j * .06), cl2 = cloudN(i * .05 + 40, j * .16 + 3);
      let v = lerp(sh.sky, .97, Math.pow(fy, 1.25)) + (smooth(.42, .72, cl) * .34 + (cl2 - .5) * .1) * (1 - fy * .75);
      v = lerp(v, .93, sh.mist * .62 + (1 - sh.mist) * .5 * smooth(.8, 1, fy));
      const dx = (i / 240 * VW - discX) / 300, dy = (fy * hor - discY) / 220; v += sh.disc * .22 * Math.exp(-(dx * dx + dy * dy));
      const col = mix(tone(v), GOLD, warmth * .26 * Math.exp(-(dx * dx + dy * dy) * .5) * clamp(v)), o = (j * 240 + i) * 4;
      d.data[o] = col[0]; d.data[o + 1] = col[1]; d.data[o + 2] = col[2]; d.data[o + 3] = 255;
    }
    k.putImageData(d, 0, 0); ctx.imageSmoothingEnabled = true; ctx.drawImage(skyC, 0, 0, 240, 135, 0, 0, VW, hor + 1); }
  // --- the far light: a white disc through the mist ---
  soft(ctx, 1, c => { glow(c, discX, discY, 210, lightCol, .5 * sh.disc); glow(c, discX, discY, 70, lightCol, .7 * sh.disc); });
  ctx.fillStyle = css(mix(LIGHT, GOLD, warmth * .35), .9 * sh.disc); ctx.beginPath(); ctx.arc(discX, discY, 15 * z / .66, 0, 7); ctx.fill();

  // --- the water: it mirrors the sky, pale under the mist at the horizon, deeper toward us ---
  { const g = ctx.createLinearGradient(0, hor, 0, VH); g.addColorStop(0, css(tone(.95))); g.addColorStop(.3, css(tone(lerp(.84, .9, sh.mist))));
    g.addColorStop(1, css(tone(lerp(.5, .66, sh.mist)))); ctx.fillStyle = g; ctx.fillRect(0, hor, VW, VH - hor); }
  soft(ctx, .8, c => glow(c, discX, 2 * hor - discY + 30, 150, lightCol, .5 * sh.disc));      // the light, mirrored
  if (warmth > .5) soft(ctx, warmth * .5, c => glow(c, discX, hor + 40, 520, GOLD, .5), 'soft-light');

  // --- far shore and the ghost trees, each fainter than the last, each with its own short reflection ---
  ctx.fillStyle = css(tone(.86)); ctx.beginPath(); ctx.moveTo(0, hor + 1);
  for (let x = 0; x <= VW; x += 6) ctx.lineTo(x, hor - 3 - 9 * z * cloudN((x / z + sh.cx) * .004, 3)); ctx.lineTo(VW, hor + 1); ctx.fill();
  for (const g of GHOSTS) {
    const s = z * g.p * .9, gx = (g.x - sh.cx * g.p) * z + VW / 2, gy = hor + (wl - hor) * g.p * .55;
    if (gx < -200 || gx > VW + 200) continue;
    for (const fl of [1, -1]) { ctx.save(); ctx.translate(gx, gy); ctx.scale(s, s * fl * (fl < 0 ? .7 : 1)); ctx.globalAlpha = fl < 0 ? .3 : 1; ctx.fillStyle = css(tone(g.t)); ribbons(ctx, g.tree); ctx.restore(); }
  }
  // --- mist lying on the far water, hiding the horizon ---
  soft(ctx, 1, c => { const g = c.createLinearGradient(0, hor - 90, 0, wl + 20); g.addColorStop(0, css(LIGHT, 0)); g.addColorStop(.5, css(LIGHT, .35 + .6 * sh.mist)); g.addColorStop(.75, css(LIGHT, .25 + .5 * sh.mist)); g.addColorStop(1, css(LIGHT, 0));
    c.fillStyle = g; c.fillRect(0, hor - 90, VW, wl + 110 - hor); });

  // --- everything near: the banks, the oak, the people, the steps and their lights. Painted apart so the water can mirror it ---
  const n = nearC.getContext('2d'); n.setTransform(1, 0, 0, 1, 0, 0); n.clearRect(0, 0, nearC.width, nearC.height);
  n.setTransform(S * z, 0, 0, S * z, S * (VW / 2 - sh.cx * z), S * wl);        // world units from here on; the water line is y = 0
  const x0 = sh.cx - VW / z, x1 = sh.cx + VW / z, land = tone(.065), ink = tone(.02), fig = tone(.3 - .1 * warmth);
  n.fillStyle = css(land); n.beginPath(); n.moveTo(x0, 0); for (let x = x0; x <= x1; x += 5) n.lineTo(x, bankY(x)); n.lineTo(x1, 0); n.fill();
  n.save(); n.translate(0, bankY(0) + 4); n.fillStyle = css(ink); ribbons(n, OAK); n.restore();
  const mote = (x, y, r, a) => { glow(n, x, y, r * 7, GOLD, a * .6); n.fillStyle = css(mix(GOLD, LIGHT, .5), a); n.beginPath(); n.arc(x, y, r, 0, 7); n.fill(); };
  const R = rng(31 + shot);
  if (shot === 0) {
    figure(n, PLI[0], META.pli, -838, 62, 1, fig, CHR_K, 0); figure(n, CHR[12], META.chr, -752, 84, 1, fig, CHR_K, 0);
    for (let i = 0; i < 7; i++) mote(-790 - R() * 46, -52 - R() * 40, 1.6 + R(), .55 + R() * .3);
  } else if (shot === 1) {
    const HX = BANK0 + 34, HY = bankY(HX) + 4;
    figure(n, LIFT[0], META.lift, HX, HY, 1, fig, CHR_K, 0);   // Help kneeling at the edge and Christian sunk to the chest, gripping hands (the first frame of the lift)
    for (let i = 0; i < 7; i++) mote(BANK0 - 118 - R() * 50, -30 - R() * 34, 1.5 + R(), .4 + R() * .25);
  } else {
    figure(n, STD[62], META.std, BANK0 + 46, bankY(BANK0 + 46) + 5, -1, fig, CHR_K);
    let sx = BANK0 - 6;                                                            // the steps: low flat stones, no two alike
    STEP_NOTES.forEach(nt => { const w = 20 + R() * 20, h = 4 + R() * 4, lean = (R() - .5) * 10; sx -= w + 34 + R() * 34;
      n.fillStyle = css(land); n.beginPath(); n.moveTo(sx - w, 1); n.quadraticCurveTo(sx - w * .8 + lean, -h * 1.5, sx + lean, -h); n.quadraticCurveTo(sx + w * .85, -h * .6, sx + w, 1); n.fill();
      mote(sx, -40 - nt * 6, 3.4, 1); sx -= w; });
    for (let i = 0; i < 4; i++) mote(BANK0 + 40 - R() * 40, -150 - R() * 40, 1.8 + R(), .8);
  }
  ctx.drawImage(nearC, 0, 0, VW, VH);
  // --- the mirror: the near picture upside down under the water line, in thin strips that wander more the nearer they are ---
  { const wob = noise2(9);
    for (let y = 0; y < VH - wl; y += 1) {
      const d = y / (VH - wl), dx = (wob(y * .21, 2) - .5) * (1.5 + 13 * d) + Math.sin(y * .9) * d * 1.6;
      ctx.globalAlpha = lerp(.82, .5, d);

  const rings = (wx, k) => { for (let i = 1; i <= 3; i++) { const rx = (18 + i * 26) * z * k, cx = X(wx);
    ctx.lineWidth = 1.3 - i * .25; ctx.strokeStyle = css(LIGHT, .75 - i * .17); ctx.beginPath(); ctx.ellipse(cx, wl + 2, rx, rx * .11, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = css(DARK, .28 - i * .06); ctx.beginPath(); ctx.ellipse(cx, wl + 3.6, rx, rx * .11, 0, 0, Math.PI); ctx.stroke(); } };
  if (shot === 0) { rings(-838, .9); rings(-752, 1.15); } else if (shot === 1) rings(BANK0 + 34 + GRASP.dx * CHR_K, 1);

  soft(ctx, 1, c => { c.fillStyle = css(LIGHT, .3 * sh.mist); for (let i = 0; i < 5; i++) { const x = (i * 263 + shot * 90) % VW; c.beginPath(); c.ellipse(x, wl - 6 + (i % 3) * 7, 190, 9, 0, 0, 7); c.fill(); } });

  // --- the gold coming back from the oak outward ---
  if (warmth > 0) { ctx.globalCompositeOperation = 'soft-light'; const g = ctx.createRadialGradient(discX, discY + 60, 20, discX, discY + 60, 760);
    g.addColorStop(0, css(GOLD, .8 * warmth)); g.addColorStop(.55, css(GOLD, .4 * warmth)); g.addColorStop(1, css(GOLD, 0)); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); ctx.globalCompositeOperation = 'source-over'; }
  // --- finish: the edges burned in as in a darkroom print, and paper grain ---
  { const g = ctx.createRadialGradient(VW * .5, VH * .5, VH * .42, VW * .5, VH * .5, VW * .78); g.addColorStop(0, css(DARK, 0)); g.addColorStop(1, css(DARK, .5)); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const t = ctx.createLinearGradient(0, 0, 0, VH * .3); t.addColorStop(0, css(DARK, .28)); t.addColorStop(1, css(DARK, 0)); ctx.fillStyle = t; ctx.fillRect(0, 0, VW, VH * .3); }
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .13; ctx.fillStyle = ctx.createPattern(paper, 'repeat'); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  document.getElementById('note').textContent = sh.note;
  document.querySelectorAll('#shots button').forEach((b, i) => b.classList.toggle('on', i === shot));
  history.replaceState(null, '', '#' + (shot + 1) + '.' + oakSeed);
}
SHOTS.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { shot = i; paint(); }; document.getElementById('shots').appendChild(b); });
document.getElementById('new').onclick = () => { oakSeed = oakSeed % 99 + 1; OAK = oak(oakSeed); paint(); };
// Help's whole movement, played at the video's own speed on a small canvas of its own: stand, step, kneel, reach, hold
const HELP_SRC = [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 42, 44, 46, 48, 50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72, 74, 76, 78, 80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100, 102, 104, 106, 108, 110, 112, 114, 116, 118, 120, 122, 124, 126, 128, 130, 132, 136, 140, 144, 148, 152, 156, 160, 164, 168, 172, 176, 180, 184, 188, 192, 196, 200, 204, 208, 212, 216, 220, 224, 228, 232, 236];
const REACH_SRC = [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 80, 82, 84, 86, 88, 90, 92, 94, 96, 98, 100, 102, 104, 106, 108, 110, 112, 114, 116, 118, 120, 122, 124, 128, 134, 140, 146, 152, 158, 164, 170, 176, 182, 188, 194, 200, 206, 212, 218, 224, 230, 236];
const LIFT_SRC = [...Array(76).keys()].map(i => i * 2).concat([...Array(11).keys()].map(i => 156 + i * 8));
const at = (src, t) => { let k = 0; while (k + 1 < src.length && src[k + 1] <= t) k++; return k; };
let playing = 0;
// The two movements together on a small canvas, each at its video's own speed: Help comes to the edge and kneels while
// Christian, sunk to the chest, lifts his head and reaches up; they grip hands; Help rises and hauls him out onto the bank.
document.getElementById('play').onclick = () => {
  const mv = document.getElementById('mv'), c = mv.getContext('2d'); mv.style.display = 'block'; const me = ++playing, t0 = performance.now();
  const K = .8, WL = 268, HX = 470, HY = WL - 6;
  (function tick(now) {
    if (me !== playing) return;
    const t = ((now - t0) / 1000 * 24) % 470, vt = Math.min(t, 150), lt = Math.min(t - 150, 236), mixIn = clamp((t - 150) / 8);
    c.fillStyle = css(tone(.9)); c.fillRect(0, 0, 640, 380);
    if (mixIn < 1) {                       // Help comes and kneels, Christian reaches: two separate figures
      figure(c, REACH[at(REACH_SRC, vt)], META.reach, HX + GRASP.dx * K, HY + GRASP.dy * K, 1, tone(.3), K, WL);
      figure(c, HELPF[at(HELP_SRC, vt)], META.help, HX, HY + 3, 1, tone(.3), K);
    }
    if (mixIn > 0) { c.globalAlpha = mixIn; figure(c, LIFT[at(LIFT_SRC, lt)], META.lift, HX, HY + 3, 1, tone(.3), K, WL); c.globalAlpha = 1; }   // the grip and the lift: both men in one picture
    c.fillStyle = css(tone(.065)); c.beginPath(); c.moveTo(640, 380); c.lineTo(640, HY); c.lineTo(HX - 46, HY); c.lineTo(HX - 62, WL); c.lineTo(HX - 62, 380); c.fill();
    c.fillStyle = css(tone(.7)); c.fillRect(0, WL, HX - 62, 380 - WL);
    requestAnimationFrame(tick);
  })(t0);
};
paint();
Promise.all([loadPack('christian-walk', CHR, [12]), loadPack('pliable', PLI, [0]), loadPack('christian-stand', STD, [62]), loadPack('help', HELPF, null), loadPack('christian-reach', REACH, null), loadPack('lift', LIFT, null)]).then(paint, () => {});
