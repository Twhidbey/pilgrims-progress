<head>

<title>Pilgrim's Progress</title>
<style>
html,body{margin:0;height:100%;background:#2e2c33;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.portrait #wrap{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;border-radius:6px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#3a3340}
.card h1{font-weight:400;font-style:italic;font-size:clamp(28px,6.5vw,64px);margin:0 0 .15em;color:#3b3550;letter-spacing:.5px}
.card h2{font-weight:400;font-size:clamp(14px,2.6vw,24px);margin:0 0 1.2em;color:#6b5f55}
.card p{font-size:clamp(14px,2.3vw,20px);margin:.2em 1em;color:#4a4048}
.btn{font-family:Georgia,serif;font-size:clamp(16px,2.6vw,24px);padding:.45em 1.5em;border-radius:40px;border:2px solid #4b4060;background:rgba(255,250,238,.8);color:#3b3550;cursor:pointer;margin:.6em .3em 0}
.btn:active{transform:scale(.96)}
#title{background:rgba(250,245,233,.35)}
#endc{background:rgba(250,245,233,.72);display:none}
#dlg{position:absolute;left:4%;right:4%;bottom:4%;min-height:3.6em;background:rgba(253,249,240,.93);border:1.5px solid rgba(70,60,80,.45);border-radius:14px;padding:.6em 3.2em .7em 1em;font-family:Georgia,serif;color:#352f3a;display:none;box-shadow:0 2px 0 rgba(60,50,70,.15)}
#dlg .who{font-size:clamp(12px,1.9vw,17px);font-style:italic;color:#7a5c3c;margin-bottom:.15em}
#dlg .txt{font-size:clamp(15px,2.6vw,25px);line-height:1.35}
#dlg .more{position:absolute;right:.7em;bottom:.45em;font-size:clamp(13px,2vw,18px);color:#8a7a6a}
#dlg .say{position:absolute;right:.45em;top:.35em;border:none;background:none;font-size:clamp(18px,3vw,26px);cursor:pointer;padding:.1em}
#hud{position:absolute;left:1.6%;top:2.5%;font-family:Georgia,serif;font-size:clamp(13px,2.2vw,22px);color:#5a4630;background:rgba(253,249,240,.75);padding:.15em .7em;border-radius:20px;display:none}
#build{position:absolute;right:1.2%;bottom:1%;font:12px Georgia,serif;color:rgba(60,50,70,.8);pointer-events:none}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(253,249,240,.28);border:2px solid rgba(253,249,240,.55);color:rgba(255,255,255,.9);font-size:30px;display:none;align-items:center;justify-content:center;touch-action:none;bottom:max(18px,env(safe-area-inset-bottom))}
.tb.on{background:rgba(253,249,240,.55)}
body.touch.playing .tb{display:flex}
#tl{left:18px}#tr{left:108px}#tj{right:22px;width:88px;height:88px}
body.portrait .tb{bottom:max(40px,env(safe-area-inset-bottom));width:90px;height:90px}
body.portrait #tr{left:126px}body.portrait #tj{width:104px;height:104px}
#rot{position:fixed;left:0;right:0;text-align:center;font:15px Georgia,serif;color:#cfc6bb;display:none}
body.portrait #rot{display:block}
</style>
</head>

const VW = 960, VH = 540, GY = 440, LEVEL_W = 5800;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let DPR = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  const portrait = h > w;
  document.body.classList.toggle('portrait', portrait);
  let sw = w, sh = w * VH / VW;
  if (sh > h) { sh = h; sw = h * VW / VH; }
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
  DPR = Math.min(2, (window.devicePixelRatio || 1) * sw / VW);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  document.getElementById('rot').style.top = (sh + 26) + 'px';
}
addEventListener('resize', fit); fit();

// seeded random so the painting is the same every time
let seed = 7;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function gauss() { return (rnd() + rnd() + rnd() - 1.5) / 1.5; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgba(c, a) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function shade(c, k) { return c.map(v => v * k); }

// ---------- watercolor kit ----------
// rough edge: subdivide a polygon and push the midpoints in and out
function rough(pts, amt, depth) {
  let p = pts;
  for (let d = 0; d < depth; d++) {
    const q = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const off = gauss() * amt * len;
      q.push(a, [(a[0] + b[0]) / 2 - dy / len * off, (a[1] + b[1]) / 2 + dx / len * off]);
    }
    p = q; amt *= 0.62;
  }
  return p;
}
function path(c, p) { c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.closePath(); }
// a wash: several thin glazes of a rough shape, darker at the edge, with a little pigment grain
function wash(c, pts, col, o = {}) {
  if (typeof col === 'string') col = hex(col);
  const base = rough(pts, o.rough ?? 0.07, 3);
  const n = o.layers ?? 4, a = o.a ?? 0.2;
  c.save();
  if (o.under) { c.globalAlpha = o.underA ?? 1; path(c, base); c.fillStyle = o.under; c.fill(); c.globalAlpha = 1; }
  c.globalCompositeOperation = 'multiply';
  let last;
  for (let i = 0; i < n; i++) {
    last = rough(base, o.wob ?? 0.035, 2);
    path(c, last); c.fillStyle = rgba(col, a); c.fill();
  }
  if (o.edge !== 0) { path(c, last); c.strokeStyle = rgba(shade(col, .78), o.edge ?? 0.32); c.lineWidth = o.ew ?? 1.3; c.stroke(); }
  if (o.grain !== 0) {
    path(c, base); c.clip();
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const q of base) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
    const cnt = Math.min(900, (x1 - x0) * (y1 - y0) / (o.gs ?? 70));
    c.fillStyle = rgba(shade(col, .7), o.grain ?? 0.12);
    for (let i = 0; i < cnt; i++) { const r = rr(.4, 1.6); c.fillRect(rr(x0, x1), rr(y0, y1), r, r); }
  }
  c.restore();
}
function rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function ell(cx, cy, rx, ry, n = 14) { const p = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; p.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); } return p; }
// broken dry-brush ink line
function ink(c, x1, y1, x2, y2, o = {}) {
  const len = Math.hypot(x2 - x1, y2 - y1), steps = Math.max(2, len / 7 | 0);
  c.save(); c.lineCap = 'round'; c.strokeStyle = o.col || 'rgba(45,36,48,.72)';
  let on = true, run = 0;
  for (let i = 0; i < steps; i++) {
    const t0 = i / steps, t1 = (i + 1) / steps;
    if (rnd() < (o.gap ?? 0.18)) on = !on;
    if (!on) continue;
    c.lineWidth = (o.w ?? 1.8) * rr(.5, 1.3);
    c.beginPath();
    c.moveTo(x1 + (x2 - x1) * t0 + gauss() * .8, y1 + (y2 - y1) * t0 + gauss() * .8);
    c.lineTo(x1 + (x2 - x1) * t1 + gauss() * .8, y1 + (y2 - y1) * t1 + gauss() * .8);
    c.stroke();
  }

}
function splats(c, x, y, r, col, n = 8) { col = hex(col); c.save(); c.globalCompositeOperation = 'multiply'; for (let i = 0; i < n; i++) { c.fillStyle = rgba(col, rr(.08, .25)); c.beginPath(); c.arc(x + gauss() * r, y + gauss() * r * .5, rr(.6, 2.4), 0, 7); c.fill(); } c.restore(); }

  P.x += P.vx;
  P.x = Math.max(30, Math.min(LEVEL_W - 30, P.x));
  for (const b of solidsNear(P.x - 40, P.x + 40)) {
    if (P.y > b.y + 2 && P.y - P.h < b.y + b.h && P.x + P.w / 2 > b.x && P.x - P.w / 2 < b.x + b.w) {

      P.vx = 0;
    }

  if (P.y >= GY) { P.y = GY; P.vy = 0; P.ground = true; }
  for (const b of solidsNear(P.x - P.w / 2, P.x + P.w / 2)) {
    if (P.x + P.w / 2 - 4 > b.x && P.x - P.w / 2 + 4 < b.x + b.w) {
      if (P.vy >= 0 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }
      else if (P.vy < 0 && P.y - P.h < b.y + b.h && P.prevB - P.h >= b.y + b.h - 1) { P.y = b.y + b.h + P.h; P.vy = 0; }
    }
  }
  for (const b of ONE) if (P.vy >= 0 && P.x > b.x - 10 && P.x < b.x + b.w + 10 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }
  if (P.ground && Math.abs(P.vx) > .3) P.anim += Math.abs(P.vx) * .045; else if (P.ground) P.anim = 0;
  if (inMud && Math.abs(P.vx) > .3 && G.t % 10 === 0) tone(90, .1, 'sine', .04);
  // sparks
  for (const s of SPARKS) if (!s.got && Math.abs(s.x - P.x) < 34 && s.y > P.y - P.h - 20 && s.y < P.y + 10) {
    s.got = true; s.ga = 1; G.got++; document.getElementById('cnt').textContent = G.got; chime();
  }
  // triggers
  if (!G.evanDone && P.x > G.evan.x - 120) { G.evanDone = true; P.vx = 0; P.face = 1; talk(EVAN, () => { G.evanGone = 1; }); }
  if (G.evanGone) G.evanGone++;
  for (const t of TRIG) if (!t.done && P.x > t.x) {
    t.done = true;
    if (t.kind === 'roll') { for (let i = 0; i < t.n; i++) G.barrels.push({ x: G.cam + VW + 60 + i * 260, y: GY - 28, vx: -3.4 - (i % 2) * .5, rot: 0, alive: true }); if (!G.tipped) { G.tipped = true; talk([[N, 'Look out! Barrels are rolling down the street. Jump over them!']]); } }
    if (t.kind === 'neighbors') { G.obst = { x: G.cam - 80, mode: 'run' }; G.pli = { x: G.cam - 140, mode: 'run' }; }
    if (t.kind === 'end') { P.vx = 0; talk(END, finish); }
  }
  // barrels
  for (const b of G.barrels) {
    if (!b.alive) continue;
    b.x += b.vx; b.rot += b.vx / 28;
    if (SOL.some(s => b.x - 22 < s.x + s.w && b.x + 22 > s.x && s.y < GY - 10 && s.h > 30)) { b.alive = false; continue; }
    if (b.x < G.cam - 120) b.alive = false;
    if (P.hurt === 0 && Math.abs(b.x - P.x) < 36 && P.y > GY - 54) {
      P.hurt = 50; P.vx = 6; P.vy = -7; P.ground = false; G.shake = 10; tone(110, .25, 'triangle', .07);
    }
  }
  // neighbors arrive, talk, then one goes home and one follows
  if (G.obst && G.obst.mode === 'run') {
    G.obst.x += 5.2; G.pli.x += 5.2;
    if (G.obst.x > P.x - 170) { G.obst.mode = 'talk'; G.pli.mode = 'talk'; P.vx = 0; P.face = -1; talk(NEIGH, () => { G.obst.mode = 'home'; G.pli.mode = 'follow'; P.face = 1; G.trail = []; }); }
  }
  if (G.obst && G.obst.mode === 'home') G.obst.x -= 3.4;
  G.trail.push({ x: P.x, y: P.y, face: P.face, moving: Math.abs(P.vx) > .3 && P.ground }); if (G.trail.length > 40) G.trail.shift();
  if (G.pli && G.pli.mode === 'follow' && G.trail.length > 30) { const t = G.trail[0]; G.pli.x = t.x - 70 * t.face; G.pli.y = t.y; G.pli.face = t.face; G.pli.moving = t.moving; }
  cameraTick();
}
function cameraTick() {
  const target = Math.max(0, Math.min(LEVEL_W - VW, P.x - VW * .38 + P.face * 40));
  G.cam += (target - G.cam) * .08;
  if (G.shake > 0) G.shake--;
}
function finish() {
  G.state = 'end'; document.body.classList.remove('playing');
  document.getElementById('endtxt').textContent = `You gathered ${G.got} of ${SPARKS.length} sparks of light.`;
  document.getElementById('endc').style.display = 'flex'; document.getElementById('hud').style.display = 'none';
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .6, 'sine', .05, i * .14));
}

// ---------- drawing ----------
function layer(img, k) {
  const sx = G.cam * k;
  ctx.drawImage(img, sx, 0, VW, VH, 0, 0, VW, VH);
}
function drawFig(f, x, y, face, bob = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y + bob); ctx.scale(face, 1); ctx.drawImage(f.c, -f.ax, -f.h); ctx.restore();
}
function drawLight() {
  const lx = 880 - G.cam * PAR.sky, ly = 196, p = 1 + Math.sin(G.t / 30) * .08;
  const near = Math.min(1, G.cam / (LEVEL_W - VW));
  const r = (26 + 22 * near) * p;
  const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 3);
  g.addColorStop(0, 'rgba(255,250,225,.85)'); g.addColorStop(.18, 'rgba(255,232,170,.4)'); g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, r * 3, 0, 7); ctx.fill();
}
function drawPlayer() {
  if (P.hurt > 0 && (P.hurt >> 2) % 2) ctx.globalAlpha = .55;
  let im = SPR.stand, bob = 0;
  if (!P.ground) im = SPR.jump;
  else if (Math.abs(P.vx) > .3) { const f = Math.floor(P.anim) % 2; im = f ? SPR.run : SPR.walk; bob = -Math.abs(Math.sin(P.anim * Math.PI)) * 3; }
  const s = .56, w = im.width * s, h = im.height * s;
  // soft shadow
  const ground = groundUnder(P.x);
  ctx.fillStyle = 'rgba(70,60,80,.16)'; ctx.beginPath(); ctx.ellipse(P.x - G.cam, ground + 2, 26 * (1 - Math.min(.5, (ground - P.y) / 300)), 5, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(P.x - G.cam, P.y + bob + 2); ctx.scale(P.face, 1); ctx.drawImage(im, -w * .55, -h, w, h); ctx.restore();
  ctx.globalAlpha = 1;
}
function groundUnder(x) { let g = GY; for (const b of SOL) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); for (const b of ONE) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); return g; }
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = G.shake ? (Math.random() - .5) * G.shake * .6 : 0;
  ctx.translate(sh, 0);
  layer(L.sky, PAR.sky);
  drawLight();
  layer(L.far, PAR.far);
  layer(L.mid, PAR.mid);
  layer(L.near, 1);
  // Evangelist, pointing to the light; he fades away after speaking
  if (G.evanGone < 90) drawFig(NPC.evan, G.evan.x - G.cam, GY, 1, 0, 1 - G.evanGone / 90);
  if (G.obst && G.obst.x > G.cam - 100) drawFig(NPC.obst, G.obst.x - G.cam, GY, G.obst.mode === 'home' ? -1 : 1, G.obst.mode !== 'talk' ? -Math.abs(Math.sin(G.t / 5)) * 3 : 0);
  if (G.pli) drawFig(NPC.pli, G.pli.x - G.cam, G.pli.y ?? GY, G.pli.face ?? 1, (G.pli.mode === 'run' || G.pli.moving) ? -Math.abs(Math.sin(G.t / 5)) * 3 : 0);
  // sparks
  for (const s of SPARKS) {
    if (s.got && !(s.ga > 0)) continue;
    const x = s.x - G.cam; if (x < -30 || x > VW + 30) continue;
    let y = s.y + Math.sin(G.t / 20 + s.ph) * 4, a = 1, r = 9;
    if (s.got) { s.ga -= .05; a = s.ga; y -= (1 - s.ga) * 30; r = 9 + (1 - s.ga) * 14; }
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `rgba(255,250,225,${a})`); g.addColorStop(.3, `rgba(250,215,120,${.75 * a})`); g.addColorStop(1, 'rgba(240,200,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill();
  }
  for (const b of G.barrels) if (b.alive) { ctx.save(); ctx.translate(b.x - G.cam, b.y); ctx.rotate(b.rot); ctx.drawImage(NPC.barrel, -30, -35); ctx.restore(); }
  if (G.state !== 'title') drawPlayer();
  // paper grain over everything
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .14;
  ctx.fillStyle = paperPat; ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- input ----------
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j' };
addEventListener('keydown', e => {
  if (G.state === 'dialog' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight')) { if (!e.repeat) next(); e.preventDefault(); return; }
  const k = KMAP[e.code]; if (!k) return; e.preventDefault();
  if (k === 'j' && !keys.j) keys.jPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
for (const [id, k] of [['tl', 'l'], ['tr', 'r'], ['tj', 'j']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); if (G.state === 'dialog') { next(); return; } if (k === 'j') keys.jPressed = true; keys[k] = true; el.classList.add('on'); });
  const up = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
cv.addEventListener('pointerdown', () => { if (G.state === 'dialog') next(); });

function start() {
  document.getElementById('title').style.display = 'none';
  document.getElementById('endc').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.body.classList.add('playing');
  reset(); tone(392, .4, 'sine', .04);
  talk(INTRO);
}
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;

// ---------- boot: paint everything once, then play ----------
(async function boot() {
  await loadSprites();
  draw0();
  await new Promise(r => setTimeout(r, 30));
  seed = 7; paintSky(); paintFar(); paintMid();
  seed = 99; buildLevel(); paintNear(); paintPeople();
  paperPat = ctx.createPattern(paper, 'repeat');
  reset();
  document.getElementById('sub').textContent = 'Level 1 · The City of Destruction';
  document.getElementById('play').style.visibility = 'visible';
  loop();
})();
function draw0() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#f3ede1'; ctx.fillRect(0, 0, VW, VH); }
</script>
