<head>

<title>Pilgrim's Progress</title>
<style>
html,body{margin:0;height:100%;background:#2e2c33;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.portrait #wrap{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;border-radius:6px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#3a3340}
.card h1{font-weight:400;font-style:italic;font-size:clamp(28px,6.5vw,64px);margin:0 0 .15em;color:#3b3550;letter-spacing:.5px}
.card h2{font-weight:400;font-size:clamp(14px,2.6vw,24px);margin:0 0 1.2em;color:#6b5f55}
.card p{font-size:clamp(14px,2.3vw,20px);margin:.2em 1em;color:#4a4048}
.btn{font-family:Georgia,serif;font-size:clamp(16px,2.6vw,24px);padding:.45em 1.5em;border-radius:40px;border:2px solid #4b4060;background:rgba(255,250,238,.8);color:#3b3550;cursor:pointer;margin:.6em .3em 0}
.btn:active{transform:scale(.96)}
#title{background:rgba(244,238,224,.6)}
#endc{background:rgba(250,245,233,.72);display:none}
#dlg{position:absolute;left:7%;right:7%;top:3.5%;min-height:3.6em;background:rgba(253,249,240,.93);border:1.5px solid rgba(70,60,80,.45);border-radius:14px;padding:.6em 3.2em .7em 1em;font-family:Georgia,serif;color:#352f3a;display:none;box-shadow:0 2px 0 rgba(60,50,70,.15)}
#dlg .who{font-size:clamp(12px,1.9vw,17px);font-style:italic;color:#7a5c3c;margin-bottom:.15em}
#dlg .txt{font-size:clamp(15px,2.6vw,25px);line-height:1.35}
#dlg .more{position:absolute;right:.7em;bottom:.45em;font-size:clamp(13px,2vw,18px);color:#8a7a6a}
#dlg .say{position:absolute;right:.45em;top:.35em;border:none;background:none;font-size:clamp(18px,3vw,26px);cursor:pointer;padding:.1em}
#hud{position:absolute;left:1.6%;top:2.5%;font-family:Georgia,serif;font-size:clamp(13px,2.2vw,22px);color:#5a4630;background:rgba(253,249,240,.75);padding:.15em .7em;border-radius:20px;display:none}
#build{position:absolute;right:1.2%;bottom:1%;font:12px Georgia,serif;color:rgba(255,250,235,.8);text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(253,249,240,.28);border:2px solid rgba(253,249,240,.55);color:rgba(255,255,255,.9);font-size:30px;display:none;align-items:center;justify-content:center;touch-action:none;bottom:max(18px,env(safe-area-inset-bottom))}
.tb.on{background:rgba(253,249,240,.55)}
body.touch.playing .tb{display:flex}
body.talking .tb,body.talking #hud{visibility:hidden}
#tl{left:18px}#tr{left:108px}#tj{right:22px;width:88px;height:88px}
body.portrait .tb{bottom:max(40px,env(safe-area-inset-bottom));width:90px;height:90px}
body.portrait #tr{left:126px}body.portrait #tj{width:104px;height:104px}
#rot{position:fixed;left:0;right:0;text-align:center;font:15px Georgia,serif;color:#cfc6bb;display:none}
body.portrait #rot{display:block}
</style>
</head>

// ---------- setup ----------
const VW = 960, VH = 540, GY = 440, LEVEL_W = 5800, PANG = LEVEL_W - VW, GATE = 5340;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let DPR = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  const portrait = h > w;
  document.body.classList.toggle('portrait', portrait);
  let sw = w, sh = w * VH / VW;
  if (sh > h) { sh = h; sw = h * VW / VH; }
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
  DPR = Math.min(2, (window.devicePixelRatio || 1) * sw / VW);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  document.getElementById('rot').style.top = (sh + 26) + 'px';
}
addEventListener('resize', fit); fit();
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

// ---------- small helpers ----------
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
// seeded random so the scenery is the same every time
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);
const rr = (a, b) => a + (b - a) * R();
let seed = 7;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
// fractal noise, -1..1: big slow shapes with smaller and smaller detail on top (how real land looks)
function mkNoise() {
  const o = R() * 1000, h = i => { const v = Math.sin(i * 127.1 + o) * 43758.5453; return v - Math.floor(v); };
  return (x, wl, oct = 5, gain = .5) => {
    let v = 0, a = 1, t = 0, f = 1 / wl;
    for (let k = 0; k < oct; k++) { const q = x * f + k * 31.7, i = Math.floor(q), u = q - i, w = u * u * (3 - 2 * u); v += a * (lerp(h(i), h(i + 1), w) * 2 - 1); t += a; a *= gain; f *= 2.07; }
    return v / t;

// ---------- people: drawn in code as one-colour silhouettes ----------
// Origin is the feet on the ground, facing right, about 145 tall at size 1.
// o: col, size, pose ('stand' | 'walk' | 'jump'), phase (walk cycle), lean, wide,
//    hood, burden, robe (long), cloak, hat, hair, beard, point, hips, staff
function person(c, o) {
  const z = o.size || 1, ph = o.phase || 0, pose = o.pose || 'stand', w = o.wide || 1;
  const TH = 30, SH = 32, hipY = -(TH + SH), walk = pose === 'walk', jump = pose === 'jump';
  const lean = (o.lean ?? .08) + (walk ? .07 : jump ? .04 : 0), sw = walk ? Math.sin(ph) : 0;
  // each leg: thigh angle (forward is +) and how far the knee bends
  const legs = jump ? [[.9, 1.15], [-.55, .7]]
    : walk ? [0, Math.PI].map(k => [.46 * Math.sin(ph + k), .1 + .8 * Math.max(0, Math.cos(ph + k))])
    : [[.09, .05], [-.1, .04]];
  const pts = legs.map(([a, b]) => { const kx = TH * Math.sin(a), ky = hipY + TH * Math.cos(a), s = a - b, fx = kx + SH * Math.sin(s), fy = ky + SH * Math.cos(s); return [kx, ky, fx, fy, fx + 11 * Math.cos(s), fy - 11 * Math.sin(s)]; });
  const lift = jump ? 0 : -Math.max(pts[0][3], pts[1][3], pts[0][5], pts[1][5]) - 4;   // keep the lower foot on the ground
  c.save(); c.scale(z, z); c.translate(0, lift);
  c.fillStyle = c.strokeStyle = o.col; c.lineCap = c.lineJoin = 'round';
  const line = (lw, p) => { c.lineWidth = lw; c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.stroke(); };
  // poly: straight sides with slightly rounded corners. soft: a rounded blob through the middle of each side
  const poly = (p, lw = 3) => { c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.closePath(); c.fill(); c.lineWidth = lw; c.stroke(); };
  const soft = p => { const n = p.length, m = i => [(p[i % n][0] + p[(i + 1) % n][0]) / 2, (p[i % n][1] + p[(i + 1) % n][1]) / 2]; c.beginPath(); let q = m(0); c.moveTo(q[0], q[1]); for (let i = 1; i <= n; i++) { q = m(i); c.quadraticCurveTo(p[i % n][0], p[i % n][1], q[0], q[1]); } c.fill(); };
  for (const q of pts) { line(12.5 * Math.sqrt(w), [[0, hipY], [q[0], q[1]]]); line(9.5 * Math.sqrt(w), [[q[0], q[1]], [q[2], q[3]]]); line(8, [[q[2], q[3]], [q[4], q[5]]]); }
  // the body leans from the hips: T(up, forward) is a point on it
  const ux = Math.sin(lean), uy = -Math.cos(lean), rx = Math.cos(lean), ry = Math.sin(lean);
  const T = (a, b) => [ux * a + rx * b, hipY + uy * a + ry * b];
  const hem = o.robe ? 56 : 40, fl = Math.abs(sw) * 9 + (jump ? 10 : 0), bk = walk ? Math.max(0, -sw) * 6 : 0, fr = walk ? Math.max(0, sw) * 6 : 0;
  if (o.cloak) poly([T(56, -6), T(50, -15), [-27 - fl, hipY + 8], [-30 - fl, hipY + 30], [-10, hipY + 26], T(30, -4)]);
  // tunic: shoulders, chest, hem that swings with the stride
  poly([T(56, -4), T(53, -12 * w), T(36, -12.5 * w), T(14, -12 * w), [-13 * w - fl * .5 - bk, hipY + hem * .6], [-13.5 * w - fl - bk, hipY + hem], [13.5 * w + fl + fr, hipY + hem], [13 * w + fl * .5 + fr, hipY + hem * .6], T(14, 11.5 * w), T(38, 11 * w), T(53, 10 * w), T(57, 3)], 4);
  if (o.burden) {                          // the heavy burden on his back
    const b = T(42 + (walk ? Math.sin(ph * 2) * 1.2 : 0), -27);
    c.save(); c.translate(b[0], b[1]); c.rotate(lean - .3);
    soft([[-17, -8], [-13, -22], [0, -27], [14, -22], [18, -6], [17, 12], [8, 24], [-8, 24], [-18, 10]]);
    soft([[-3, -24], [-6, -33], [2, -36], [8, -31], [5, -24]]); c.restore();
    line(5, [T(54, 8), T(30, -12)]);
  }
  const hd = T(68, 4);
  line(11, [T(52, 1), T(60, 3)]);
  c.beginPath(); c.ellipse(hd[0], hd[1], 10.5, 11.5, lean, 0, 6.2832); c.fill();
  if (o.hood) poly([T(49, -12), T(64, -13.5), T(77, -12), T(83, -3), T(80, 9), T(72, 14.5), T(61, 12.5), T(52, 12), T(47, 2)], 3.5);
  if (o.hair) poly([T(64, -9), T(76, -10), T(82, -2), T(81, 9), T(74, 13), T(72, 2)]);
  if (o.hat) { line(4, [T(77, -16), T(77, 19)]); poly([T(76, -8), T(88, -7), T(88, 9), T(76, 10)], 2); }
  if (o.beard) poly([T(66, 9), T(60, 17), T(44, 15), T(50, 3)]);
  // arms: angles from straight down, forward is +
  const S = T(50, 1);
  const arm = (a1, a2, l1 = 22, l2 = 20) => { a1 += lean; a2 += lean; const e = [S[0] + l1 * Math.sin(a1), S[1] + l1 * Math.cos(a1)], h = [e[0] + l2 * Math.sin(a2), e[1] + l2 * Math.cos(a2)]; line(10, [S, e]); line(8, [e, h]); return h; };
  if (o.hips) { arm(-.8, .9, 19, 18); arm(.8, -.9, 19, 18); }
  else if (jump) { arm(1.25, 1.9); arm(-.7, -.15); }
  else if (walk) { arm(-.5 * sw, -.5 * sw + .55); arm(.5 * sw, .5 * sw + .55); }
  else {
    if (o.point) arm(1.75, 1.85, 24, 25); else arm(.1, .45);
    if (o.staff) { const h = arm(.7, 1.3, 20, 17); line(4, [[h[0] + 1, -lift], [h[0] + 4, hipY - 96]]); }
  }
  c.restore();
}

// ---------- Christian: painted poses (SPR_SRC) turned into one-colour silhouettes ----------
// Each pose is baked in the road's rain colour (.c) and golden colour (.w). Thin paint is made solid so nothing shows through.
const SIL = {};
function loadSprites() {
  const col = layerCol(1);
  return Promise.all(Object.entries(SPR_SRC).map(([k, src]) => new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const sil = c0 => { const m = mk(im.width, im.height), c = m.getContext('2d'); c.drawImage(im, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = css(c0); c.fillRect(0, 0, m.width, m.height); c.globalCompositeOperation = 'source-over'; for (let r = 0; r < 5; r++) c.drawImage(m, 0, 0); return m; };
      SIL[k] = { c: sil(col[0]), w: sil(col[1]) }; res();
    };
    im.src = src;
  })));
}

const SOL = [], ONE = [], MUD = [], SPARKS = [], ROLLS = [], TRIG = [];
function crate(x, y, s = 60) { SOL.push({ x, y, w: s, h: s, k: 'crate' }); }
function buildLevel() {
  SOL.length = ONE.length = MUD.length = SPARKS.length = ROLLS.length = TRIG.length = 0;
  SOL.push({ x: 920, y: GY - 58, w: 48, h: 58, k: 'barrel' });
  crate(1150, GY - 60); crate(1210, GY - 60); crate(1210, GY - 120, 60);
  MUD.push({ x: 1420, w: 300 });
  SOL.push({ x: 1860, y: GY - 66, w: 150, h: 66, k: 'cart' });
  crate(2150, GY - 56, 56);
  ONE.push({ x: 2230, y: GY - 128, w: 170, k: 'awning' });
  TRIG.push({ x: 2420, kind: 'roll', n: 3, done: false });
  SOL.push({ x: 3020, y: GY - 40, w: 60, h: 40, k: 'wall' });
  SOL.push({ x: 3080, y: GY - 80, w: 60, h: 80, k: 'wall' });
  SOL.push({ x: 3140, y: GY - 104, w: 330, h: 104, k: 'wall' });
  SOL.push({ x: 3470, y: GY - 52, w: 60, h: 52, k: 'wall' });
  MUD.push({ x: 3620, w: 220 });
  TRIG.push({ x: 3960, kind: 'neighbors', done: false });
  crate(4320, GY - 60); crate(4380, GY - 60); crate(4380, GY - 120, 60); crate(4440, GY - 60);
  TRIG.push({ x: 4620, kind: 'roll', n: 4, done: false });
  SOL.push({ x: 5060, y: GY - 58, w: 48, h: 58, k: 'barrel' });
  TRIG.push({ x: 5520, kind: 'end', done: false });
  // sparks of light along the way
  const add = (x, y) => SPARKS.push({ x, y, got: false, ph: rnd() * 6 });
  for (const x of [330, 400, 470, 760, 830, 944, 1180, 1240, 1300, 1500, 1580, 1660, 1935, 2100, 2280, 2330, 2600, 2700, 2800, 3110, 3200, 3300, 3400, 3700, 3800, 4200, 4410, 4800, 4900, 5084, 5300])
    add(x, GY - 40 - (x % 3) * 18);
  for (const s of SPARKS) {
    for (const b of SOL) if (s.x > b.x - 10 && s.x < b.x + b.w + 10) s.y = Math.min(s.y, b.y - 40);
    for (const b of ONE) if (s.x > b.x && s.x < b.x + b.w) s.y = b.y - 40;
  }
}

let AC;
function tone(f, d = .25, type = 'sine', v = .08, when = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}
const chime = () => { tone(1320, .35, 'sine', .05); tone(1980, .3, 'sine', .025, .05); };

// ---------- game state ----------
const P = { x: 140, y: GY, vx: 0, vy: 0, w: 44, h: 118, face: 1, ground: true, coy: 0, buf: 0, anim: 0, hurt: 0, prevB: GY };
const G = { state: 'title', cam: 0, got: 0, t: 0, trail: [], pli: null, obst: null, evan: { x: 640 }, barrels: [], shake: 0, tipped: false };
const keys = { l: false, r: false, j: false };

const dlg = document.getElementById('dlg');

const INTRO = [
  [N, 'Christian lived in the City of Destruction.'],
  [N, 'One day he read in his book that the city was in danger. A heavy burden grew on his back.'],
  [C, 'What shall I do? Where can I go?'],
];
const EVAN = [
  [E, 'Why are you crying, Christian?'],
  [C, 'My burden is so heavy, and I don\'t know where to go.'],
  [E, 'Do you see that shining light far away? Keep it in front of you and run!'],
  [E, 'It will lead you to the Wicket Gate.'],
  [N, 'Run with ◀ ▶ and jump with ▲. The burden is heavy, so Christian can\'t jump very high.'],
];
const NEIGH = [
  [N, 'Two neighbors ran after Christian.'],
  [O, 'Come back home, Christian!'],
  [C, 'No. Come with me to the Celestial City!'],
  [O, 'Not me! I\'m going home.'],
  [PL, 'I will come with you, Christian!'],
];
const END = [[N, 'Christian and Pliable left the city behind. The shining light was ahead of them.']];

// ---------- physics ----------
const GRAV = .72, JUMP = -13.6, MAXV = 4.4;
function solidsNear(x0, x1) { return SOL.filter(b => b.x < x1 && b.x + b.w > x0); }
function update() {
  G.t++;
  if (G.state !== 'play') { cameraTick(); return; }
  const inMud = P.ground && MUD.some(m => P.x > m.x && P.x < m.x + m.w);
  const max = inMud ? 1.9 : MAXV;
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (P.hurt > 0) P.hurt--;
  if (dir && P.hurt < 20) { P.vx += dir * (P.ground ? .55 : .35); P.face = dir; }
  else P.vx *= P.ground ? .72 : .95;
  P.vx = Math.max(-max, Math.min(max, P.vx));
  if (Math.abs(P.vx) < .05) P.vx = 0;
  // jump with forgiveness: a little coyote time and a jump buffer
  P.coy = P.ground ? 7 : P.coy - 1;
  P.buf = keys.jPressed ? 8 : P.buf - 1; keys.jPressed = false;
  if (P.buf > 0 && P.coy > 0) { P.vy = inMud ? JUMP * .8 : JUMP; P.ground = false; P.coy = 0; P.buf = 0; tone(220, .12, 'triangle', .04); }
  if (!keys.j && P.vy < -5) P.vy = -5;
  P.vy = Math.min(P.vy + GRAV, 16);
  // move x
  P.x += P.vx;
  P.x = Math.max(30, Math.min(LEVEL_W - 30, P.x));
  for (const b of solidsNear(P.x - 40, P.x + 40)) {
    if (P.y > b.y + 2 && P.y - P.h < b.y + b.h && P.x + P.w / 2 > b.x && P.x - P.w / 2 < b.x + b.w) {
      if (P.x < b.x + b.w / 2) P.x = b.x - P.w / 2; else P.x = b.x + b.w + P.w / 2;
      P.vx = 0;
    }
  }
  // move y
  P.prevB = P.y; P.y += P.vy; P.ground = false;
  if (P.y >= GY) { P.y = GY; P.vy = 0; P.ground = true; }
  for (const b of solidsNear(P.x - P.w / 2, P.x + P.w / 2)) {
    if (P.x + P.w / 2 - 4 > b.x && P.x - P.w / 2 + 4 < b.x + b.w) {
      if (P.vy >= 0 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }
      else if (P.vy < 0 && P.y - P.h < b.y + b.h && P.prevB - P.h >= b.y + b.h - 1) { P.y = b.y + b.h + P.h; P.vy = 0; }
    }
  }
  for (const b of ONE) if (P.vy >= 0 && P.x > b.x - 10 && P.x < b.x + b.w + 10 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }
  if (P.ground && Math.abs(P.vx) > .3) P.anim += Math.abs(P.vx) * .045; else if (P.ground) P.anim = 0;
  if (inMud && Math.abs(P.vx) > .3 && G.t % 10 === 0) tone(90, .1, 'sine', .04);
  // sparks
  for (const s of SPARKS) if (!s.got && Math.abs(s.x - P.x) < 34 && s.y > P.y - P.h - 20 && s.y < P.y + 10) {
    s.got = true; s.ga = 1; G.got++; document.getElementById('cnt').textContent = G.got; chime();
  }
  // triggers
  if (!G.evanDone && P.x > G.evan.x - 120) { G.evanDone = true; P.vx = 0; P.face = 1; talk(EVAN, () => { G.evanGone = 1; }); }
  if (G.evanGone) G.evanGone++;
  for (const t of TRIG) if (!t.done && P.x > t.x) {
    t.done = true;
    if (t.kind === 'roll') { for (let i = 0; i < t.n; i++) G.barrels.push({ x: G.cam + VW + 60 + i * 260, y: GY - 28, vx: -3.4 - (i % 2) * .5, rot: 0, alive: true }); if (!G.tipped) { G.tipped = true; talk([[N, 'Look out! Barrels are rolling down the street. Jump over them!']]); } }
    if (t.kind === 'neighbors') { G.obst = { x: G.cam - 80, mode: 'run' }; G.pli = { x: G.cam - 140, mode: 'run' }; }
    if (t.kind === 'end') { P.vx = 0; talk(END, finish); }
  }
  // barrels
  for (const b of G.barrels) {
    if (!b.alive) continue;
    b.x += b.vx; b.rot += b.vx / 28;
    if (SOL.some(s => b.x - 22 < s.x + s.w && b.x + 22 > s.x && s.y < GY - 10 && s.h > 30)) { b.alive = false; continue; }
    if (b.x < G.cam - 120) b.alive = false;
    if (P.hurt === 0 && Math.abs(b.x - P.x) < 36 && P.y > GY - 54) {
      P.hurt = 50; P.vx = 6; P.vy = -7; P.ground = false; G.shake = 10; tone(110, .25, 'triangle', .07);
    }
  }
  // neighbors arrive, talk, then one goes home and one follows
  if (G.obst && G.obst.mode === 'run') {
    G.obst.x += 5.2; G.pli.x += 5.2;
    if (G.obst.x > P.x - 170) { G.obst.mode = 'talk'; G.pli.mode = 'talk'; P.vx = 0; P.face = -1; talk(NEIGH, () => { G.obst.mode = 'home'; G.pli.mode = 'follow'; P.face = 1; G.trail = []; }); }
  }
  if (G.obst && G.obst.mode === 'home') G.obst.x -= 3.4;
  G.trail.push({ x: P.x, y: P.y, face: P.face, moving: Math.abs(P.vx) > .3 && P.ground }); if (G.trail.length > 40) G.trail.shift();
  if (G.pli && G.pli.mode === 'follow' && G.trail.length > 30) { const t = G.trail[0]; G.pli.x = t.x - 70 * t.face; G.pli.y = t.y; G.pli.face = t.face; G.pli.moving = t.moving; }
  cameraTick();
}
function cameraTick() {
  const target = Math.max(0, Math.min(LEVEL_W - VW, P.x - VW * .38 + P.face * 40));
  G.cam += (target - G.cam) * .08;
  if (G.shake > 0) G.shake--;
}
function finish() {
  G.state = 'end'; document.body.classList.remove('playing');
  document.getElementById('endtxt').textContent = `You gathered ${G.got} of ${SPARKS.length} sparks of light.`;
  document.getElementById('endc').style.display = 'flex'; document.getElementById('hud').style.display = 'none';
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .6, 'sine', .05, i * .14));
}

// ---------- drawing ----------
// Things on the road are flat dark shapes in the ground's colour, with a few faint lines so they read as what they are.
let INK = '#000', HINT = 'rgba(255,255,255,.1)', SETC = '#333';
function thing(b) {
  const c = ctx, x = b.x, y = b.y, w = b.w, h = b.h;
  c.fillStyle = INK; c.strokeStyle = HINT; c.lineWidth = 1.4;
  if (b.k === 'crate') {
    c.fillRect(x, y, w, h);
    c.strokeRect(x + 5, y + 5, w - 10, h - 10); c.beginPath(); c.moveTo(x + 5, y + 5); c.lineTo(x + w - 5, y + h - 5); c.moveTo(x + w - 5, y + 5); c.lineTo(x + 5, y + h - 5); c.stroke();
  } else if (b.k === 'barrel') {
    barrelShape(c, x + w / 2, y + h / 2, w, h);
  } else if (b.k === 'cart') {
    c.fillRect(x, y, w, h - 26); c.fillRect(x + 4, y + h - 30, w - 8, 8);
    c.lineWidth = 6; c.strokeStyle = INK; c.lineCap = 'round'; c.beginPath(); c.moveTo(x + w - 4, y + 8); c.lineTo(x + w + 46, y + 34); c.stroke();
    for (const wx of [x + 32, x + w - 32]) {
      c.beginPath(); c.arc(wx, GY - 21, 21, 0, 6.2832); c.fill();
      c.strokeStyle = HINT; c.lineWidth = 1.4; c.beginPath(); c.arc(wx, GY - 21, 15, 0, 6.2832); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 4; c.moveTo(wx - Math.cos(a) * 15, GY - 21 - Math.sin(a) * 15); c.lineTo(wx + Math.cos(a) * 15, GY - 21 + Math.sin(a) * 15); } c.stroke();
    }
    c.strokeStyle = HINT; c.lineWidth = 1.4; c.beginPath(); for (let k = 1; k < 5; k++) { c.moveTo(x + k * w / 5, y + 4); c.lineTo(x + k * w / 5, y + h - 30); } c.stroke();
  } else if (b.k === 'wall') {
    c.fillRect(x, y, w, h + 2);
    c.beginPath(); for (let yy = y + 26; yy < y + h - 6; yy += 26) { c.moveTo(x + 3, yy); c.lineTo(x + w - 3, yy); } c.stroke();
  }
  // a faint line of light along the top, so kids can see where to land
  c.strokeStyle = HINT; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x + 2, y + 1); c.lineTo(x + w - 2, y + 1); c.stroke(); c.stroke();
}
function barrelShape(c, cx, cy, w, h) {
  c.beginPath(); c.moveTo(cx - w * .36, cy - h / 2); c.lineTo(cx + w * .36, cy - h / 2);
  c.quadraticCurveTo(cx + w * .62, cy, cx + w * .36, cy + h / 2); c.lineTo(cx - w * .36, cy + h / 2);
  c.quadraticCurveTo(cx - w * .62, cy, cx - w * .36, cy - h / 2); c.fill();
  c.lineWidth = 1.4; c.beginPath(); for (const k of [-.28, .28]) { c.moveTo(cx - w * .45, cy + h * k); c.lineTo(cx + w * .45, cy + h * k); } c.stroke();
}
function stall(b) {                        // a market stall: its awning is a platform you can jump up through
  const c = ctx;
  c.fillStyle = SETC;
  c.fillRect(b.x + 6, b.y + 14, 6, GY - b.y - 14); c.fillRect(b.x + b.w - 12, b.y + 14, 6, GY - b.y - 14);
  c.fillRect(b.x + 14, GY - 46, b.w - 28, 46);
  c.beginPath(); for (let k = 0; k < 6; k++) { c.moveTo(b.x + 40 + k * 22, GY - 50); c.arc(b.x + 30 + k * 22, GY - 50, 10, 0, 6.2832); } c.fill();
  c.fillStyle = INK;
  c.beginPath(); c.moveTo(b.x - 8, b.y); c.lineTo(b.x + b.w + 8, b.y); c.lineTo(b.x + b.w + 2, b.y + 16);
  for (let k = b.x + b.w + 2; k > b.x - 2; k -= 17) c.quadraticCurveTo(k - 8.5, b.y + 28, k - 17, b.y + 16);
  c.closePath(); c.fill();
  c.strokeStyle = HINT; c.lineWidth = 2; c.beginPath(); c.moveTo(b.x - 6, b.y + 1); c.lineTo(b.x + b.w + 6, b.y + 1); c.stroke();
}
function gate() {                          // the city gate: two towers and an arch, a little paler than the road so Christian shows against it
  const c = ctx; c.fillStyle = SETC;
  for (const gx of [5250, 5420]) { c.fillRect(gx, GY - 300, 56, 302); for (let k = 0; k < 3; k++) c.fillRect(gx - 4 + k * 24, GY - 314, 16, 16); }
  c.beginPath(); c.moveTo(5306, GY - 300); c.lineTo(5306, GY - 236); c.quadraticCurveTo(5363, GY - 292, 5420, GY - 236); c.lineTo(5420, GY - 300);
  c.lineTo(5400, GY - 300); c.lineTo(5363, GY - 348); c.lineTo(5326, GY - 300); c.closePath(); c.fill();
  // the city wall runs off behind the houses
  c.fillRect(5120, GY - 150, 130, 152); for (let k = 0; k < 6; k++) c.fillRect(5120 + k * 24, GY - 162, 14, 14);
  c.fillRect(5476, GY - 150, 60, 152); for (let k = 0; k < 3; k++) c.fillRect(5478 + k * 24, GY - 162, 14, 14);
}
function drawLight() {                     // the shining light, far away: small at first, larger as Christian comes near
  const lx = 880 - G.cam * .02, ly = 190, p = 1 + Math.sin(G.t / 30) * .08;
  const near = Math.min(1, G.cam / PANG), r = (22 + 24 * near) * p;
  const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 3);
  g.addColorStop(0, 'rgba(255,250,225,.9)'); g.addColorStop(.18, 'rgba(255,232,170,.42)'); g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, r * 3, 0, 7); ctx.fill();
}
function drawWho(o, x, y, face, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(face, 1); person(ctx, o); ctx.restore();
}
function groundUnder(x) { let g = GY; for (const b of SOL) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); for (const b of ONE) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); return g; }
const drops = []; { const r = rng(9); for (let i = 0; i < 240; i++) drops.push({ x: r() * (VW + 160), y: r() * VH, l: 14 + r() * 24, v: 9 + r() * 8, a: .12 + r() * .3 }); }
function draw() {
  const cam = G.cam;
  clearAt = lerp(1.02, -.32, smooth(0, 1, cam / PANG));   // rain in the city, golden light by the gate
  weatherSegs();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // sky
  const GD = Math.round((GY + 2) * DPR);
  ctx.drawImage(skyRain, 0, 0, 480, GD / DPR / 2, 0, 0, cv.width, GD);
  fade(skyGold, 0, .5, w => w, 0, GY + 2);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawLight(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the layers, far to near, each one colour, with mist between
  const vis = warm(SUN[0] / VW) * LOOK.gold, alpha = 1 - LOOK.thru * .62;
  for (let i = 0; i < 3; i++) {
    const Lr = SCN[i], off = cam * Lr.par;
    pair(Lr.cool, Lr.warm, off, Lr.q, alpha, Lr.top, GY + 2);
    pair(Lr.mistC, Lr.mistW, 0, 1, Lr.mistA, Lr.mistTop, GY + 2);
    if (i === 0) {
      fade(veilC, 0, .1, w => (1 - w) * LOOK.rain * .9, 0, GY + 2);
      if (vis > .01) { ctx.globalAlpha = vis; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(beamC, 0, 0, cv.width, cv.height); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.shake) ctx.translate((Math.random() - .5) * G.shake * .6, 0);
  // the road and everything on it
  const gcol = layerCol(1), wAt = x => warm((x - cam) / VW);
  ctx.save(); ctx.translate(-cam, 0);
  const grad = hGrad(ctx, gcol[0], gcol[1], 1, 1, cam);
  INK = grad; SETC = hGrad(ctx, ...layerCol(.84), 1, 1, cam); HINT = hGrad(ctx, PAL.hazeC, PAL.hazeW, .13, .17, cam);
  gate();
  for (const b of ONE) if (b.x < cam + VW + 40 && b.x + b.w > cam - 40) stall(b);
  ctx.fillStyle = grad; ctx.fillRect(cam - 20, GY, VW + 40, VH - GY);
  for (const t of TUFTS) if (t.x > cam - 30 && t.x < cam + VW + 30) for (const p of t.shapes) ctx.fill(p);
  // puddles of mud catch the sky
  for (const m of MUD) {
    if (m.x > cam + VW || m.x + m.w < cam) continue;
    const w = wAt(m.x + m.w / 2);
    ctx.fillStyle = css(mix(mix(PAL.skyC[1], PAL.hazeC, .5), PAL.hazeW, w), .42);
    ctx.beginPath(); ctx.ellipse(m.x + m.w / 2, GY + 9, m.w / 2, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = css(mix(PAL.skyC[1], PAL.hazeW, w), .3);
    ctx.beginPath(); ctx.ellipse(m.x + m.w * .4, GY + 8, m.w * .28, 3.5, 0, 0, 6.2832); ctx.fill();
  }
  for (const b of SOL) if (b.x < cam + VW + 60 && b.x + b.w > cam - 60) thing(b);
  ctx.restore();
  const ink = sx => colAt(gcol, sx);
  // Evangelist, pointing to the light; he fades away after speaking
  if (G.evanGone < 90) drawWho({ col: ink(G.evan.x - cam), size: 1.1, hood: 1, robe: 1, beard: 1, staff: 1, point: G.evanDone ? 1 : 0, lean: .02 }, G.evan.x - cam, GY, 1, 1 - G.evanGone / 90);
  if (G.obst && G.obst.x > cam - 100) { const run = G.obst.mode !== 'talk'; drawWho({ col: ink(G.obst.x - cam), size: .98, wide: 1.35, hat: 1, hips: !run, lean: 0, pose: run ? 'walk' : 'stand', phase: G.t / 4.5 }, G.obst.x - cam, GY, G.obst.mode === 'home' ? -1 : 1); }
  if (G.pli) { const run = G.pli.mode === 'run' || G.pli.moving; drawWho({ col: ink(G.pli.x - cam), size: .93, wide: .9, cloak: 1, hair: 1, lean: .04, pose: run ? 'walk' : 'stand', phase: G.t / 4.5 + 1 }, G.pli.x - cam, G.pli.y ?? GY, G.pli.face ?? 1); }
  // sparks of light
  for (const s of SPARKS) {
    if (s.got && !(s.ga > 0)) continue;
    const x = s.x - cam; if (x < -30 || x > VW + 30) continue;
    let y = s.y + Math.sin(G.t / 20 + s.ph) * 4, a = 1, r = 9;
    if (s.got) { s.ga -= .05; a = Math.max(0, s.ga); y -= (1 - s.ga) * 30; r = 9 + (1 - s.ga) * 14; }
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `rgba(255,250,225,${a})`); g.addColorStop(.3, `rgba(250,215,120,${.75 * a})`); g.addColorStop(1, 'rgba(240,200,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill();
  }
  for (const b of G.barrels) if (b.alive) { ctx.save(); ctx.translate(b.x - cam, b.y); ctx.rotate(b.rot); ctx.fillStyle = ink(b.x - cam); ctx.strokeStyle = css(mix(PAL.hazeC, PAL.hazeW, warm((b.x - cam) / VW)), .22); barrelShape(ctx, 0, 0, 46, 56); ctx.restore(); }
  // Christian: his painted poses as solid silhouettes, the rain-coloured one fading over the golden one
  if (G.state !== 'title') {
    let k = 'stand', bob = 0;
    if (!P.ground) k = 'jump';
    else if (Math.abs(P.vx) > .3) { k = Math.floor(P.anim) % 2 ? 'run' : 'walk'; bob = -Math.abs(Math.sin(P.anim * Math.PI)) * 3; }
    const im = SIL[k], z = .56, w = im.w.width * z, h = im.w.height * z, wm = warm((P.x - cam) / VW);
    ctx.save(); ctx.translate(P.x - cam, P.y + bob + 2); ctx.scale(P.face, 1);
    const a = P.hurt > 0 && (P.hurt >> 2) % 2 ? .5 : 1;
    ctx.globalAlpha = a; ctx.drawImage(im.w, -w * .55, -h, w, h);
    if (wm < .996) { ctx.globalAlpha = a * (1 - wm); ctx.drawImage(im.c, -w * .55, -h, w, h); }
    ctx.restore();
  }
  // grass and leaves in front
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, 0, 100);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, VH - 70, VH);
  // the rain side is dulled, the golden side is warmed
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = hGrad(ctx, mix(PAL.cloud, [255, 255, 255], .45), [255, 255, 255], .2 + LOOK.rain * .5, 0); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = hGrad(ctx, PAL.light, PAL.light, 0, LOOK.gold * .5); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // vignette and a little paper grain so flat colour feels painted
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(finishC, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // falling rain
  const n = Math.round(LOOK.rain * drops.length);
  ctx.strokeStyle = css(mix(PAL.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v; d.x -= d.v * .2; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)); if (a < .02) continue;
    ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();
  }

}
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- input ----------
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j' };
addEventListener('keydown', e => {
  if (G.state === 'dialog' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight')) { if (!e.repeat) next(); e.preventDefault(); return; }
  const k = KMAP[e.code]; if (!k) return; e.preventDefault();
  if (k === 'j' && !keys.j) keys.jPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
for (const [id, k] of [['tl', 'l'], ['tr', 'r'], ['tj', 'j']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); if (G.state === 'dialog') { next(); return; } if (k === 'j') keys.jPressed = true; keys[k] = true; el.classList.add('on'); });
  const up = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
cv.addEventListener('pointerdown', () => { if (G.state === 'dialog') next(); });

function start() {
  document.getElementById('title').style.display = 'none';
  document.getElementById('endc').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.body.classList.add('playing');
  reset(); tone(392, .4, 'sine', .04);
  talk(INTRO);
}
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;

// ---------- boot: build the scenery once, then play ----------
(async function boot() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#8f9aa8'; ctx.fillRect(0, 0, VW, VH);
  await new Promise(r => setTimeout(r, 30));
  await loadSprites();
  buildScenery();
  seed = 99; buildLevel();
  bakeFinish();
  reset();
  document.getElementById('sub').textContent = 'Level 1 · The City of Destruction';
  document.getElementById('play').style.visibility = 'visible';
  loop();
})();
</script>
