<style>
html,body{margin:0;height:100%;background:#2e2c33;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.portrait #wrap{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;border-radius:6px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#3a3340}
.card h1{font-weight:400;font-style:italic;font-size:clamp(28px,6.5vw,64px);margin:0 0 .15em;color:#3b3550;letter-spacing:.5px}
.card h2{font-weight:400;font-size:clamp(14px,2.6vw,24px);margin:0 0 1.2em;color:#6b5f55}
.card p{font-size:clamp(14px,2.3vw,20px);margin:.2em 1em;color:#4a4048}
.btn{font-family:Georgia,serif;font-size:clamp(16px,2.6vw,24px);padding:.45em 1.5em;border-radius:40px;border:2px solid #4b4060;background:rgba(255,250,238,.8);color:#3b3550;cursor:pointer;margin:.6em .3em 0}
.btn:active{transform:scale(.96)}
#title{background:rgba(244,238,224,.6)}
#endc{background:rgba(250,245,233,.72);display:none}
#dlg{position:absolute;left:0;right:0;top:82.5%;bottom:0;padding:0 7.5% 0 4%;font-family:Georgia,serif;color:#f4ecdc;display:none;background:linear-gradient(rgba(14,14,20,0),rgba(14,14,20,.4) 30%);border-radius:0 0 6px 6px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#dlg.on{display:flex;align-items:center}
#dlg .who{font-style:italic;color:#e8c27c}
#dlg .who:not(:empty)::after{content:': '}
#dlg .txt{font-size:clamp(13px,2.1vw,20px);line-height:1.3}
#dlg .more{position:absolute;right:1.2%;bottom:6%;font-size:clamp(11px,1.6vw,15px);color:rgba(244,236,220,.7)}
#dlg .say{position:absolute;right:.6%;top:8%;border:none;background:none;font-size:clamp(15px,2.4vw,22px);cursor:pointer;padding:.1em;opacity:.85}
#hud{position:absolute;left:1.6%;top:2.5%;font-family:Georgia,serif;font-size:clamp(13px,2.2vw,22px);color:#5a4630;background:rgba(253,249,240,.75);padding:.15em .7em;border-radius:20px;display:none}
#build{position:absolute;right:1.2%;bottom:1%;font:12px Georgia,serif;color:rgba(255,250,235,.8);text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(253,249,240,.28);border:2px solid rgba(253,249,240,.55);color:rgba(255,255,255,.9);font-size:30px;display:none;align-items:center;justify-content:center;touch-action:none;bottom:max(18px,env(safe-area-inset-bottom))}
.tb.on{background:rgba(253,249,240,.55)}
body.touch.playing .tb{display:flex}
body.talking .tb,body.talking #hud,body.talking #build{visibility:hidden}
#tl{left:18px}#tr{left:108px}#tj{right:22px;width:88px;height:88px}
body.portrait .tb{bottom:max(40px,env(safe-area-inset-bottom));width:90px;height:90px}
body.portrait #tr{left:126px}body.portrait #tj{width:104px;height:104px}
#rot{position:fixed;left:0;right:0;text-align:center;font:15px Georgia,serif;color:#cfc6bb;display:none}
body.portrait #rot{display:block}
</style>

// ---------- setup ----------
const VW = 960, VH = 540, GY = 440, LEVEL_W = 5800, PANG = LEVEL_W - VW, GATE = 5340;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let DPR = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  const portrait = h > w;
  document.body.classList.toggle('portrait', portrait);
  let sw = w, sh = w * VH / VW;
  if (sh > h) { sh = h; sw = h * VW / VH; }
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
  DPR = Math.min(2, (window.devicePixelRatio || 1) * sw / VW);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  document.getElementById('rot').style.top = (sh + 26) + 'px';
}
addEventListener('resize', fit); fit();
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

// ---------- small helpers ----------
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
// seeded random so the scenery is the same every time
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);
const rr = (a, b) => a + (b - a) * R();
let seed = 7;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
// fractal noise, -1..1: big slow shapes with smaller and smaller detail on top (how real land looks)
function mkNoise() {
  const o = R() * 1000, h = i => { const v = Math.sin(i * 127.1 + o) * 43758.5453; return v - Math.floor(v); };
  return (x, wl, oct = 5, gain = .5) => {
    let v = 0, a = 1, t = 0, f = 1 / wl;
    for (let k = 0; k < oct; k++) { const q = x * f + k * 31.7, i = Math.floor(q), u = q - i, w = u * u * (3 - 2 * u); v += a * (lerp(h(i), h(i + 1), w) * 2 - 1); t += a; a *= gain; f *= 2.07; }
    return v / t;
  };
}

// ---------- the look (settled in style-lab.html; keep the two files in step) ----------
// look=50.60.65.29.4.80.30.66.41.19.55.35.0-0.1.1.3 : Storm to gold, 4 layers
const LOOK = { rain: .6, gold: .65, mist: .29, depth: .8, thru: .3, soft: .66, hills: .38, trees: .55, win: .35 };
const PAL = { skyC: ['#5d6b80', '#b3bdc7'], skyW: ['#e6c687', '#fff2cc'], hazeC: '#b7c2cc', hazeW: '#ffe9b8', nearC: '#1d2838', nearW: '#3b2a1b', cloud: '#3f4a5c', light: '#fff0c4', win: '#ffd27a' };
for (const k in PAL) PAL[k] = Array.isArray(PAL[k]) ? PAL[k].map(hex) : hex(PAL[k]);
const SUN = [790, 195];
// the weather across the screen: 0 = rain, 1 = golden. It clears as Christian walks toward the light.
let clearAt = 1;
const warm = fx => smooth(clearAt - .32, clearAt + .32, fx);
// a left-to-right gradient that follows the weather. a and b are [r,g,b] with alphas aa, ab
function hGrad(c, a, b, aa = 1, ab = 1, x0 = 0) {
  const g = c.createLinearGradient(x0, 0, x0 + VW, 0);
  for (let i = 0; i <= 10; i++) { const t = i / 10, w = warm(t); g.addColorStop(t, css(mix(a, b, w), lerp(aa, ab, w))); }
  return g;
}
// one colour per layer by depth: pale far away, dark up close. d: 0 far .. 1 the ground
function layerCol(d) {
  const t = 1 - LOOK.depth * .95 * (1 - Math.pow(clamp(d), 1.35));
  return [mix(PAL.hazeC, PAL.nearC, t), mix(PAL.hazeW, PAL.nearW, t)];
}
const colAt = (col, sx) => css(mix(col[0], col[1], warm(sx / VW)));

// ---------- scenery shapes: everything is a filled outline ----------
let L;                                    // the layer being built
const poly = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); L.shapes.push(p); return p; };
const blob = (p, x, y, rx, ry) => { p.moveTo(x + rx, y); p.ellipse(x, y, rx, ry, 0, 0, 6.2832); };
function house(x, gy, w, h, s, tall) {
  const b = gy + 60, top = gy - h, ln = (R() - .5) * .035 * h, k = R();
  let rh;
  if (tall) {                             // a tower or steeple
    rh = w * rr(1.6, 2.6);
    poly([[x, b], [x, top], [x - 1.5 * s, top], [x + w / 2, top - rh], [x + w + 1.5 * s, top], [x + w, top], [x + w, b]]);
  } else if (k < .55) {                   // gable end toward us, sometimes with a jutting upper floor
    rh = w * rr(.5, .85);
    const j = R() < .45 ? 3.5 * s : 0, jy = top + h * rr(.4, .55);
    poly([[x, b], [x, jy], [x - j, jy], [x - j + ln, top], [x - j - 2 * s + ln, top], [x + w / 2 + ln, top - rh], [x + w + j + 2 * s + ln, top], [x + w + j + ln, top], [x + w + j, jy], [x + w, jy], [x + w, b]]);
  } else {                                // roof seen from the side: a long ridge
    rh = w * rr(.22, .38) + 8 * s;
    const e = w * rr(.08, .2);
    poly([[x, b], [x + ln, top], [x - 3 * s + ln, top], [x + e + ln, top - rh], [x + w - e + ln, top - rh], [x + w + 3 * s + ln, top], [x + w + ln, top], [x + w, b]]);
    if (R() < .4 && w > 50 * s) { const dx = x + w * rr(.3, .7), dw = 9 * s; poly([[dx - dw, top - rh * .2], [dx, top - rh * .2 - dw * 1.3], [dx + dw, top - rh * .2]]); }
  }
  if (!tall && R() < .75) {               // chimney
    const cx = x + w * rr(.18, .78) + ln, cw = rr(5, 8) * s, ct = top - rh * rr(.55, 1) - rr(5, 12) * s;
    poly([[cx, top], [cx, ct], [cx - 1.2 * s, ct], [cx - 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct], [cx + cw, ct], [cx + cw, top]]);
  }
  if (!tall && s > .4) {                  // windows that may be lit
    const cols = Math.max(1, Math.round(w / (24 * s))), rows = Math.max(1, Math.floor(h / (34 * s)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      L.wins.push([x + (c + .5) * w / cols - 3 * s + ln * (1 - r / rows), top + 12 * s + r * 32 * s, 6 * s, 8.5 * s, R()]);

}
function tree(x, gy, s, kind) {
  const p = new Path2D(), ln = rr(-5, 5) * s;
  if (kind === 0) {                       // round, leafy
    const th = rr(13, 26) * s, Rr = rr(24, 40) * s, cy = gy - th - Rr * .5;
    poly([[x - 4 * s, gy + 20], [x - 3 * s, gy], [x - 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 3 * s, gy], [x + 4 * s, gy + 20]]);
    for (let i = 0; i < 9; i++) { const a = R() * 6.283, d = R() * Rr * .55; blob(p, x + ln + Math.cos(a) * d * 1.35, cy + Math.sin(a) * d * .75, Rr * rr(.42, .68), Rr * rr(.36, .56)); }
    for (let i = 0; i < 22; i++) { const a = R() * 6.283; blob(p, x + ln + Math.cos(a) * Rr * 1.02, cy + Math.sin(a) * Rr * .6, Rr * rr(.1, .22), Rr * rr(.07, .15)); }
    poly([[x + ln * .6, gy - th * .7], [x + ln + Rr * .5, cy + Rr * .2], [x + ln + Rr * .45, cy + Rr * .3]]);
  } else if (kind === 1) {                // tall and narrow, like a poplar
    const hh = rr(62, 105) * s, w = rr(8, 12) * s, lf = [], rt = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, ww = w * Math.pow(Math.sin(Math.PI * Math.pow(t, .62)), .8) + .6 * s, y = gy - hh * (.1 + t * .9), cx = x + ln * t * .6; lf.push([cx - ww * rr(.82, 1.1), y]); rt.unshift([cx + ww * rr(.82, 1.1), y]); }

  } else {                                // a low bush or hedge
    const n = 3 + (R() * 4 | 0);
    for (let i = 0; i < n; i++) blob(p, x + (i - n / 2) * 11 * s + rr(-3, 3) * s, gy - rr(3, 9) * s, rr(8, 14) * s, rr(7, 13) * s);
  }

}

// ---------- physics ----------
const GRAV = .72, JUMP = -13.6, MAXV = 4.4;

function update() {

  const inMud = P.ground && MUD.some(m => P.x > m.x && P.x < m.x + m.w);
  const max = inMud ? 1.9 : MAXV;
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (P.hurt > 0) P.hurt--;

  if (P.buf > 0 && P.coy > 0) { P.vy = inMud ? JUMP * .8 : JUMP; P.ground = false; P.coy = 0; P.buf = 0; tone(220, .12, 'triangle', .04); }
  if (!keys.j && P.vy < -5) P.vy = -5;

  // move x
  P.x += P.vx;
  P.x = Math.max(30, Math.min(LEVEL_W - 30, P.x));
  for (const b of solidsNear(P.x - 40, P.x + 40)) {
    if (P.y > b.y + 2 && P.y - P.h < b.y + b.h && P.x + P.w / 2 > b.x && P.x - P.w / 2 < b.x + b.w) {
      if (P.x < b.x + b.w / 2) P.x = b.x - P.w / 2; else P.x = b.x + b.w + P.w / 2;
      P.vx = 0;
    }
  }
  // move y
  P.prevB = P.y; P.y += P.vy; P.ground = false;
  if (P.y >= GY) { P.y = GY; P.vy = 0; P.ground = true; }
  for (const b of solidsNear(P.x - P.w / 2, P.x + P.w / 2)) {
    if (P.x + P.w / 2 - 4 > b.x && P.x - P.w / 2 + 4 < b.x + b.w) {
      if (P.vy >= 0 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }
      else if (P.vy < 0 && P.y - P.h < b.y + b.h && P.prevB - P.h >= b.y + b.h - 1) { P.y = b.y + b.h + P.h; P.vy = 0; }
    }
  }
  for (const b of ONE) if (P.vy >= 0 && P.x > b.x - 10 && P.x < b.x + b.w + 10 && P.prevB <= b.y + 1 && P.y >= b.y) { P.y = b.y; P.vy = 0; P.ground = true; }

  for (const s of SPARKS) if (!s.got && Math.abs(s.x - P.x) < 34 && s.y > P.y - P.h - 20 && s.y < P.y + 10) {
    s.got = true; s.ga = 1; G.got++; document.getElementById('cnt').textContent = G.got; chime();
  }

  if (!G.evanDone && P.x > G.evan.x - 120) { G.evanDone = true; P.vx = 0; P.face = 1; talk(EVAN, () => { G.evanGone = 1; }); }
  if (G.evanGone) G.evanGone++;

    t.done = true;
    if (t.kind === 'roll') { for (let i = 0; i < t.n; i++) G.barrels.push({ x: G.cam + VW + 60 + i * 260, y: GY - 28, vx: -3.4 - (i % 2) * .5, rot: 0, alive: true }); if (!G.tipped) { G.tipped = true; talk([[N, 'Look out! Barrels are rolling down the street. Jump over them!']]); } }

  }

  }
  if (G.obst && G.obst.mode === 'home') G.obst.x -= 3.4;
  G.trail.push({ x: P.x, y: P.y, face: P.face, moving: Math.abs(P.vx) > .3 && P.ground }); if (G.trail.length > 40) G.trail.shift();

}

// ---------- drawing ----------
// Things on the road are flat dark shapes in the ground's colour, with a few faint lines so they read as what they are.
let INK = '#000', HINT = 'rgba(255,255,255,.1)', SETC = '#333';
function thing(b) {
  const c = ctx, x = b.x, y = b.y, w = b.w, h = b.h;
  c.fillStyle = INK; c.strokeStyle = HINT; c.lineWidth = 1.4;

    c.lineWidth = 6; c.strokeStyle = INK; c.lineCap = 'round'; c.beginPath(); c.moveTo(x + w - 4, y + 8); c.lineTo(x + w + 46, y + 34); c.stroke();

      c.strokeStyle = HINT; c.lineWidth = 1.4; c.beginPath(); c.arc(wx, GY - 21, 15, 0, 6.2832); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 4; c.moveTo(wx - Math.cos(a) * 15, GY - 21 - Math.sin(a) * 15); c.lineTo(wx + Math.cos(a) * 15, GY - 21 + Math.sin(a) * 15); } c.stroke();
    }
    c.strokeStyle = HINT; c.lineWidth = 1.4; c.beginPath(); for (let k = 1; k < 5; k++) { c.moveTo(x + k * w / 5, y + 4); c.lineTo(x + k * w / 5, y + h - 30); } c.stroke();

    c.fillRect(x, y, w, h + 2);
    c.beginPath(); for (let yy = y + 26; yy < y + h - 6; yy += 26) { c.moveTo(x + 3, yy); c.lineTo(x + w - 3, yy); } c.stroke();

function barrelShape(c, cx, cy, w, h) {
  c.beginPath(); c.moveTo(cx - w * .36, cy - h / 2); c.lineTo(cx + w * .36, cy - h / 2);
  c.quadraticCurveTo(cx + w * .62, cy, cx + w * .36, cy + h / 2); c.lineTo(cx - w * .36, cy + h / 2);
  c.quadraticCurveTo(cx - w * .62, cy, cx - w * .36, cy - h / 2); c.fill();
  c.lineWidth = 1.4; c.beginPath(); for (const k of [-.28, .28]) { c.moveTo(cx - w * .45, cy + h * k); c.lineTo(cx + w * .45, cy + h * k); } c.stroke();

  c.fillRect(b.x + 6, b.y + 14, 6, GY - b.y - 14); c.fillRect(b.x + b.w - 12, b.y + 14, 6, GY - b.y - 14);
  c.fillRect(b.x + 14, GY - 46, b.w - 28, 46);

  c.beginPath(); c.moveTo(5306, GY - 300); c.lineTo(5306, GY - 236); c.quadraticCurveTo(5363, GY - 292, 5420, GY - 236); c.lineTo(5420, GY - 300);

function drawLight() {                     // the shining light, far away: small at first, larger as Christian comes near

    ctx.beginPath(); ctx.ellipse(m.x + m.w / 2, GY + 9, m.w / 2, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = css(mix(PAL.skyC[1], PAL.hazeW, w), .3);
    ctx.beginPath(); ctx.ellipse(m.x + m.w * .4, GY + 8, m.w * .28, 3.5, 0, 0, 6.2832); ctx.fill();
  }
  for (const b of SOL) if (b.x < cam + VW + 60 && b.x + b.w > cam - 60) thing(b);
  ctx.restore();
  const ink = sx => colAt(gcol, sx);
  // Evangelist, pointing to the light; he fades away after speaking
  if (G.evanGone < 90) drawWho({ col: ink(G.evan.x - cam), size: 1.1, hood: 1, robe: 1, beard: 1, staff: 1, point: G.evanDone ? 1 : 0, lean: .02 }, G.evan.x - cam, GY, 1, 1 - G.evanGone / 90);
  if (G.obst && G.obst.x > cam - 100) { const run = G.obst.mode !== 'talk'; drawWho({ col: ink(G.obst.x - cam), size: .98, wide: 1.35, hat: 1, hips: !run, lean: 0, pose: run ? 'walk' : 'stand', phase: G.t / 4.5 }, G.obst.x - cam, GY, G.obst.mode === 'home' ? -1 : 1); }
  if (G.pli) { const run = G.pli.mode === 'run' || G.pli.moving; drawWho({ col: ink(G.pli.x - cam), size: .93, wide: .9, cloak: 1, hair: 1, lean: .04, pose: run ? 'walk' : 'stand', phase: G.t / 4.5 + 1 }, G.pli.x - cam, G.pli.y ?? GY, G.pli.face ?? 1); }
  // sparks of light
  for (const s of SPARKS) {
    if (s.got && !(s.ga > 0)) continue;
    const x = s.x - cam; if (x < -30 || x > VW + 30) continue;
    let y = s.y + Math.sin(G.t / 20 + s.ph) * 4, a = 1, r = 9;
    if (s.got) { s.ga -= .05; a = Math.max(0, s.ga); y -= (1 - s.ga) * 30; r = 9 + (1 - s.ga) * 14; }
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `rgba(255,250,225,${a})`); g.addColorStop(.3, `rgba(250,215,120,${.75 * a})`); g.addColorStop(1, 'rgba(240,200,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill();
  }
  for (const b of G.barrels) if (b.alive) { ctx.save(); ctx.translate(b.x - cam, b.y); ctx.rotate(b.rot); ctx.fillStyle = ink(b.x - cam); ctx.strokeStyle = css(mix(PAL.hazeC, PAL.hazeW, warm((b.x - cam) / VW)), .22); barrelShape(ctx, 0, 0, 46, 56); ctx.restore(); }
  // Christian: his painted poses as solid silhouettes, the rain-coloured one fading over the golden one
  if (G.state !== 'title') {
    // standing, walking (starting off), running (full speed), jumping; the walk and run poses take turns
    let k = 'stand';
    const sp = Math.abs(P.vx), f = Math.floor(P.anim) % 2;
    if (!P.ground) k = 'jump';
    else if (sp > .3) k = sp > 3.2 ? (f ? 'run2' : 'run1') : (f ? 'walk3' : 'walk2');
    const im = SIL[k], m = SPR_META[k], z = .56, w = im.w.width * z, h = im.w.height * z, wm = warm((P.x - cam) / VW);
    ctx.save(); ctx.translate(P.x - cam, P.y + 1); ctx.scale(P.face, 1);
    const a = P.hurt > 0 && (P.hurt >> 2) % 2 ? .5 : 1, x0 = -m[0] * z, y0 = -m[1] * z;
    ctx.globalAlpha = a; ctx.drawImage(im.w, x0, y0, w, h);
    if (wm < .996) { ctx.globalAlpha = a * (1 - wm); ctx.drawImage(im.c, x0, y0, w, h); }
    ctx.restore();
  }
  // grass and leaves in front
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, 0, 100);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, VH - 70, VH);
  // the rain side is dulled, the golden side is warmed
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = hGrad(ctx, mix(PAL.cloud, [255, 255, 255], .45), [255, 255, 255], .2 + LOOK.rain * .5, 0); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = hGrad(ctx, PAL.light, PAL.light, 0, LOOK.gold * .5); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // vignette and a little paper grain so flat colour feels painted
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(finishC, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // falling rain
  const n = Math.round(LOOK.rain * drops.length);
  ctx.strokeStyle = css(mix(PAL.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v; d.x -= d.v * .2; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)); if (a < .02) continue;
    ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- input ----------
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j' };
addEventListener('keydown', e => {
  if (G.state === 'dialog' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight')) { if (!e.repeat) next(); e.preventDefault(); return; }
  const k = KMAP[e.code]; if (!k) return; e.preventDefault();
  if (k === 'j' && !keys.j) keys.jPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
for (const [id, k] of [['tl', 'l'], ['tr', 'r'], ['tj', 'j']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); if (G.state === 'dialog') { next(); return; } if (k === 'j') keys.jPressed = true; keys[k] = true; el.classList.add('on'); });
  const up = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
cv.addEventListener('pointerdown', () => { if (G.state === 'dialog') next(); });

function start() {
  document.getElementById('title').style.display = 'none';
  document.getElementById('endc').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.body.classList.add('playing');
  reset(); tone(392, .4, 'sine', .04);
  talk(INTRO);
}
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;

// ---------- boot: build the scenery once, then play ----------
(async function boot() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#8f9aa8'; ctx.fillRect(0, 0, VW, VH);
  await new Promise(r => setTimeout(r, 30));
  await loadSprites();
  buildScenery();
  seed = 99; buildLevel();
  bakeFinish();
  reset();
  document.getElementById('sub').textContent = 'Level 1 · The City of Destruction';
  document.getElementById('play').style.visibility = 'visible';
  loop();
})();
</script>
