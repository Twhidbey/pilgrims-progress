<style>
html,body{margin:0;height:100%;background:#2e2c33;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.portrait #wrap{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;border-radius:6px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#3a3340}
.card h1{font-weight:400;font-style:italic;font-size:clamp(28px,6.5vw,64px);margin:0 0 .15em;color:#3b3550;letter-spacing:.5px}
.card h2{font-weight:400;font-size:clamp(14px,2.6vw,24px);margin:0 0 1.2em;color:#6b5f55}
.card p{font-size:clamp(14px,2.3vw,20px);margin:.2em 1em;color:#4a4048}
.btn{font-family:Georgia,serif;font-size:clamp(16px,2.6vw,24px);padding:.45em 1.5em;border-radius:40px;border:2px solid #4b4060;background:rgba(255,250,238,.8);color:#3b3550;cursor:pointer;margin:.6em .3em 0}
.btn:active{transform:scale(.96)}
#title{background:rgba(244,238,224,.6)}
#endc{background:rgba(250,245,233,.72);display:none}
#dlg{position:absolute;left:0;right:0;top:82.5%;bottom:0;padding:0 7.5% 0 4%;font-family:Georgia,serif;color:#f4ecdc;display:none;background:linear-gradient(rgba(14,14,20,0),rgba(14,14,20,.4) 30%);border-radius:0 0 6px 6px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#dlg.on{display:flex;align-items:center}
#dlg .who{font-style:italic;color:#e8c27c}
#dlg .who:not(:empty)::after{content:': '}
#dlg .txt{font-size:clamp(13px,2.1vw,20px);line-height:1.3}
#dlg .more{position:absolute;right:1.2%;bottom:6%;font-size:clamp(11px,1.6vw,15px);color:rgba(244,236,220,.7)}
#dlg .say{position:absolute;right:.6%;top:8%;border:none;background:none;font-size:clamp(15px,2.4vw,22px);cursor:pointer;padding:.1em;opacity:.85}
#hud{position:absolute;left:1.6%;top:2.5%;font-family:Georgia,serif;font-size:clamp(13px,2.2vw,22px);color:#5a4630;background:rgba(253,249,240,.75);padding:.15em .7em;border-radius:20px;display:none}
#build{position:absolute;right:1.2%;bottom:1%;font:12px Georgia,serif;color:rgba(255,250,235,.8);text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(253,249,240,.28);border:2px solid rgba(253,249,240,.55);color:rgba(255,255,255,.9);font-size:30px;display:none;align-items:center;justify-content:center;touch-action:none;bottom:max(18px,env(safe-area-inset-bottom))}
.tb.on{background:rgba(253,249,240,.55)}
body.touch.playing .tb{display:flex}
body.talking .tb,body.talking #hud,body.talking #build{visibility:hidden}
#tl{left:18px}#tr{left:108px}#tj{right:22px;width:88px;height:88px}
body.portrait .tb{bottom:max(40px,env(safe-area-inset-bottom));width:90px;height:90px}
body.portrait #tr{left:126px}body.portrait #tj{width:104px;height:104px}
#rot{position:fixed;left:0;right:0;text-align:center;font:15px Georgia,serif;color:#cfc6bb;display:none}
body.portrait #rot{display:block}
</style>

  const max = inMud ? 1.3 : MAXV;

  P.x += P.vx;
  P.x = Math.max(30, Math.min(LEVEL_W - 30, P.x));

    if (P.y > b.y + 2 && P.y - P.h < b.y + b.h && P.x + P.w / 2 > b.x && P.x - P.w / 2 < b.x + b.w) {
      if (P.x < b.x + b.w / 2) P.x = b.x - P.w / 2; else P.x = b.x + b.w + P.w / 2;

    if (P.x + P.w / 2 - 4 > b.x && P.x - P.w / 2 + 4 < b.x + b.w) {

  // When he stops, the walk plays on gently to the next frame with both feet down, and he pauses there.
  if (P.ground) {

    else if (!CHR_META.rest.includes(Math.floor(P.anim) % CHR_SRC.length)) P.anim += .5;
  }

  const near = Math.min(1, G.cam / PANG), r = (22 + 24 * near) * p;
  const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 3);
  g.addColorStop(0, 'rgba(255,250,225,.9)'); g.addColorStop(.18, 'rgba(255,232,170,.42)'); g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, r * 3, 0, 7); ctx.fill();
}
// ---------- Christian: the video frames, played in step with how far he walks ----------
// CHR_K: video pixels to screen (he is about 150 tall); CHR_STEP: how far he walks per video frame, so planted feet stay put
const CHR = [], CHR_K = .52, CHR_STEP = CHR_META.vpx * CHR_K;
function loadChristian() {
  return Promise.all(CHR_SRC.map((src, i) => new Promise(res => { const im = new Image(); im.onload = () => { CHR[i] = im; res(); }; im.src = src; })));
}
// the frame to show: walking follows P.anim; in the air he holds a full stride
function chrFrame() { return P.ground ? ((Math.floor(P.anim) % CHR.length) + CHR.length) % CHR.length : CHR_META.leap; }
// drawn on a small canvas: the grey painting, multiplied by the weather's tint, then cut back to his shape
const figC = mk(8, 8);
function drawChristian(x, y, face, alpha) {
  const im = CHR[chrFrame()], w = im.width * CHR_K, h = im.height * CHR_K;
  const W = Math.ceil(w * DPR), H = Math.ceil(h * DPR), c = figC.getContext('2d');
  if (figC.width !== W || figC.height !== H) { figC.width = W; figC.height = H; }
  const wm = warm(x / VW), tint = mix(mix(PAL.hazeC, PAL.nearC, .8), mix(PAL.hazeW, PAL.nearW, .8), wm);   // darker than the houses behind him, like the near layers
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H);
  c.drawImage(im, 0, 0, W, H);
  c.globalCompositeOperation = 'multiply'; c.fillStyle = css(tint); c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'destination-in'; c.drawImage(im, 0, 0, W, H);
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1); ctx.globalAlpha = alpha;
  ctx.drawImage(figC, -CHR_META.ax * CHR_K, -CHR_META.ground * CHR_K, w, h); ctx.restore();
}
// one sprite pose, standing on (x, y), in the road's colour for the weather where it stands
function drawSpr(k, x, y, face = 1, alpha = 1, bob = 0) {
  const im = SIL[k], m = SPR_META[k], z = .56, wm = warm(x / VW);
  ctx.save(); ctx.translate(x, y + 1 + bob); ctx.scale(face, 1);
  const x0 = -m[0] * z, y0 = -m[1] * z, w = im.w.width * z, h = im.w.height * z;
  ctx.globalAlpha = alpha; ctx.drawImage(im.w, x0, y0, w, h);
  if (wm < .996) { ctx.globalAlpha = alpha * (1 - wm); ctx.drawImage(im.c, x0, y0, w, h); }
  ctx.restore();
}
function groundUnder(x) { let g = GY; for (const b of SOL) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); for (const b of ONE) if (x > b.x && x < b.x + b.w && b.y >= P.y - 2) g = Math.min(g, b.y); return g; }
const drops = []; { const r = rng(9); for (let i = 0; i < 240; i++) drops.push({ x: r() * (VW + 160), y: r() * VH, l: 14 + r() * 24, v: 9 + r() * 8, a: .12 + r() * .3 }); }
function draw() {
  const cam = G.cam;
  clearAt = lerp(1.02, -.32, smooth(0, 1, cam / PANG));   // rain in the city, golden light by the gate
  weatherSegs();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // sky
  const GD = Math.round((GY + 2) * DPR);
  ctx.drawImage(skyRain, 0, 0, 480, GD / DPR / 2, 0, 0, cv.width, GD);
  fade(skyGold, 0, .5, w => w, 0, GY + 2);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawLight(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the layers, far to near, each one colour, with mist between
  const vis = warm(SUN[0] / VW) * LOOK.gold, alpha = 1 - LOOK.thru * .62;
  for (let i = 0; i < 3; i++) {
    const Lr = SCN[i], off = cam * Lr.par;
    pair(Lr.cool, Lr.warm, off, Lr.q, alpha, Lr.top, GY + 2);
    pair(Lr.mistC, Lr.mistW, 0, 1, Lr.mistA, Lr.mistTop, GY + 2);
    if (i === 0) {
      fade(veilC, 0, .1, w => (1 - w) * LOOK.rain * .9, 0, GY + 2);
      if (vis > .01) { ctx.globalAlpha = vis; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(beamC, 0, 0, cv.width, cv.height); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.shake) ctx.translate((Math.random() - .5) * G.shake * .6, 0);
  // the road and everything on it
  const gcol = layerCol(1), wAt = x => warm((x - cam) / VW);
  ctx.save(); ctx.translate(-cam, 0);
  const grad = hGrad(ctx, gcol[0], gcol[1], 1, 1, cam);
  INK = grad; SETC = hGrad(ctx, ...layerCol(.66), 1, 1, cam);   // gate and stall: paler than Christian so he shows in front of them HINT = hGrad(ctx, PAL.hazeC, PAL.hazeW, .13, .17, cam);
  gate();
  for (const b of ONE) if (b.x < cam + VW + 40 && b.x + b.w > cam - 40) stall(b);
  ctx.fillStyle = grad; ctx.fillRect(cam - 20, GY, VW + 40, VH - GY);
  for (const t of TUFTS) if (t.x > cam - 30 && t.x < cam + VW + 30) for (const p of t.shapes) ctx.fill(p);
  // puddles of mud catch the sky
  for (const m of MUD) {
    if (m.x > cam + VW || m.x + m.w < cam) continue;
    const w = wAt(m.x + m.w / 2);
    ctx.fillStyle = css(mix(mix(PAL.skyC[1], PAL.hazeC, .5), PAL.hazeW, w), .42);
    ctx.beginPath(); ctx.ellipse(m.x + m.w / 2, GY + 9, m.w / 2, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = css(mix(PAL.skyC[1], PAL.hazeW, w), .3);
    ctx.beginPath(); ctx.ellipse(m.x + m.w * .4, GY + 8, m.w * .28, 3.5, 0, 0, 6.2832); ctx.fill();
  }
  for (const b of SOL) if (b.x < cam + VW + 60 && b.x + b.w > cam - 60) thing(b);
  ctx.restore();
  const ink = sx => colAt(gcol, sx);
  // Evangelist, pointing to the light; he fades away after speaking
  // Evangelist points to the light once Christian reaches him, then fades away after speaking
  if (G.evanGone < 90) drawSpr(G.evanDone ? 'evan_point' : 'evan', G.evan.x - cam, GY, 1, 1 - G.evanGone / 90);
  const step = (t) => -Math.abs(Math.sin(t / 5)) * 3;
  if (G.obst && G.obst.x > cam - 100) { const run = G.obst.mode !== 'talk'; drawSpr(run ? 'obst_walk' : 'obst', G.obst.x - cam, GY, G.obst.mode === 'home' ? -1 : 1, 1, run ? step(G.t) : 0); }
  if (G.pli) { const run = G.pli.mode === 'run' || G.pli.moving; drawSpr(run && Math.floor(G.t / 9) % 2 ? 'pli_walk' : 'pli', G.pli.x - cam, G.pli.y ?? GY, G.pli.face ?? 1, 1, run ? step(G.t + 2) : 0); }
  // sparks of light
  for (const s of SPARKS) {
    if (s.got && !(s.ga > 0)) continue;
    const x = s.x - cam; if (x < -30 || x > VW + 30) continue;
    let y = s.y + Math.sin(G.t / 20 + s.ph) * 4, a = 1, r = 9;
    if (s.got) { s.ga -= .05; a = Math.max(0, s.ga); y -= (1 - s.ga) * 30; r = 9 + (1 - s.ga) * 14; }
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `rgba(255,250,225,${a})`); g.addColorStop(.3, `rgba(250,215,120,${.75 * a})`); g.addColorStop(1, 'rgba(240,200,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill();
  }
  for (const b of G.barrels) if (b.alive) { ctx.save(); ctx.translate(b.x - cam, b.y); ctx.rotate(b.rot); ctx.fillStyle = ink(b.x - cam); ctx.strokeStyle = css(mix(PAL.hazeC, PAL.hazeW, warm((b.x - cam) / VW)), .22); barrelShape(ctx, 0, 0, 46, 56); ctx.restore(); }
  // Christian: his painted poses as solid silhouettes, the rain-coloured one fading over the golden one
  if (G.state !== 'title') {
    // Christian: the monochrome watercolour walk from the video
    drawChristian(P.x - cam, P.y + 1, P.face, P.hurt > 0 && (P.hurt >> 2) % 2 ? .5 : 1);
  }
  // grass and leaves in front
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, 0, 100);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, VH - 70, VH);
  // the rain side is dulled, the golden side is warmed
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = hGrad(ctx, mix(PAL.cloud, [255, 255, 255], .45), [255, 255, 255], .2 + LOOK.rain * .5, 0); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = hGrad(ctx, PAL.light, PAL.light, 0, LOOK.gold * .5); ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // vignette and a little paper grain so flat colour feels painted
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(finishC, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  // falling rain
  const n = Math.round(LOOK.rain * drops.length);
  ctx.strokeStyle = css(mix(PAL.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v; d.x -= d.v * .2; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)); if (a < .02) continue;
    ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- input ----------
const KMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j' };
addEventListener('keydown', e => {
  if (G.state === 'dialog' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight')) { if (!e.repeat) next(); e.preventDefault(); return; }
  const k = KMAP[e.code]; if (!k) return; e.preventDefault();
  if (k === 'j' && !keys.j) keys.jPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
for (const [id, k] of [['tl', 'l'], ['tr', 'r'], ['tj', 'j']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); if (G.state === 'dialog') { next(); return; } if (k === 'j') keys.jPressed = true; keys[k] = true; el.classList.add('on'); });
  const up = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
cv.addEventListener('pointerdown', () => { if (G.state === 'dialog') next(); });

function start() {
  document.getElementById('title').style.display = 'none';
  document.getElementById('endc').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.body.classList.add('playing');
  reset(); tone(392, .4, 'sine', .04);
  talk(INTRO);
}
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;

// ---------- boot: build the scenery once, then play ----------
(async function boot() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#8f9aa8'; ctx.fillRect(0, 0, VW, VH);
  await new Promise(r => setTimeout(r, 30));
  await loadSprites(); await loadChristian();
  buildScenery();
  seed = 99; buildLevel();
  bakeFinish();
  reset();
  document.getElementById('sub').textContent = 'Level 1 · The City of Destruction';
  document.getElementById('play').style.visibility = 'visible';
  loop();
})();
</script>
