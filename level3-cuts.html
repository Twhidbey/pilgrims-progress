<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilgrim's Progress: Level 3 cuts</title>
<style>html,body{margin:0;background:#16151b;color:#e9e4da;font:16px/1.4 Georgia,serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#16151bee;backdrop-filter:blur(6px);border-bottom:1px solid #333;padding:8px 10px}
h1{font-size:17px;margin:0 0 4px;font-weight:normal;color:#e8c48a}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tab{border:1px solid #555;border-radius:14px;padding:3px 10px;font-size:13px;background:none;color:#ccc}
.tab.on{background:#e8c48a;color:#16151b;border-color:#e8c48a}
.tot{font-size:12.5px;color:#aaa}.tot b{color:#e9e4da}
.help{font-size:13px;color:#aaa;padding:8px 10px;margin:0}
.row{border-bottom:1px solid #2b2a31;padding:9px 10px}
.row.cut .txt{opacity:.38;text-decoration:line-through}
.top{display:flex;gap:8px;align-items:baseline}
.n{color:#777;font-size:12px;min-width:26px}
.who{color:#e8c48a;font-style:italic;font-size:14px}
.tag{font-size:11px;color:#999;border:1px solid #444;border-radius:8px;padding:0 5px;margin-left:4px}
.txt{margin:3px 0 6px 34px}
.new{display:block;color:#bfe0b4;margin-top:3px}
.new:before{content:"→ "}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-left:34px;align-items:center}
.b{border:1px solid #555;background:#222128;color:#ddd;border-radius:7px;padding:5px 9px;font:13px Georgia,serif}
.b.on.keep{background:#4f6b4a;border-color:#7a9a72;color:#fff}
.b.on.cut{background:#7a3d3d;border-color:#a55;color:#fff}
.b.on.reword{background:#3d5a7a;border-color:#6a8db0;color:#fff}
.b.on.own{background:#6b5a2f;border-color:#a8904e;color:#fff}
.b.walk.on{background:#3b3b5a;border-color:#8a8ac0;color:#fff}
.b:disabled{opacity:.3}
.play{border:none;background:none;color:#e8c48a;font-size:15px;padding:2px 4px}
textarea{display:block;width:calc(100% - 34px);margin:6px 0 0 34px;box-sizing:border-box;background:#0f0f13;color:#eee;border:1px solid #555;border-radius:6px;font:15px Georgia,serif;padding:6px;min-height:52px}
.prop{font-size:11px;color:#888;margin-left:6px}
footer{padding:14px 10px 40px}
#out{width:100%;box-sizing:border-box;min-height:140px;background:#0f0f13;color:#ddd;border:1px solid #555;border-radius:6px;font:13px ui-monospace,Menlo,monospace;padding:6px}
.big{font-size:15px;padding:9px 14px;background:#e8c48a;color:#16151b;border:none;border-radius:8px;margin:6px 6px 6px 0}

.place{display:block;background:#201f27;color:#e8c48a;padding:10px 10px 6px;font-size:15px;border-bottom:1px solid #333}
.place small{color:#999;font-size:12px;display:block}
.note{font-size:12px;color:#9a9;margin:0 0 6px 34px;font-style:italic}
.idea{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid #2b2a31}
.idea input{transform:scale(1.4);margin-top:5px}
.idea b{color:#e8c48a}
</style></head><body>
<header>
  <h1>Level 3: choose for each line</h1>
  <div class="tot" id="tot"></div>
  <button class="big" id="done1" style="font-size:13px;padding:5px 12px;margin:4px 0 0">✓ Done</button>
</header>
<p class="help"><b>Keep</b> it · <b>Cut</b> it · <b>Reword</b>: my shorter wording (in green) · <b>Own</b>: type your own. My proposal is set to begin with; ▶ plays the line as recorded. At the bottom: ideas to show in pictures what the cut lines used to say.</p>
<div id="list"></div>
<div class="place">Show instead of tell<small>tick the ideas you want</small></div>
<div id="ideas"></div>
<footer>
  <button class="big" id="copy">✓ Done: send my choices</button><button class="big" id="reset" style="background:#444;color:#ddd">Back to my proposal</button>
  <textarea id="out" readonly></textarea>
</footer>
<script>
const ROWS = [{"who":"N","name":"Storyteller","t":"His name was Mr. Worldly Wiseman, from the great town of Carnal Policy, near Christian's own city.","h":"ba360873","d":9.2,"pl":"plain","prop":"cut","r":"","note":"Evangelist names him later"},{"who":"WW","name":"Wiseman","t":"How now, good fellow! Where are you going, with such a burden?","h":"38e4f90f","d":3.8,"pl":"plain","prop":"keep","r":"","note":""},{"who":"C","name":"Christian","t":"Sir, I am going to that little gate ahead. There I will be shown how to be rid of my heavy burden.","h":"e3cd3d59","d":7.4,"pl":"plain","prop":"reword","r":"To that little gate ahead, to be rid of my burden.","note":"said while walking"},{"who":"WW","name":"Wiseman","t":"Who sent you this way?","h":"b6ff8c68","d":1.2,"pl":"plain","prop":"cut","r":"","note":""},{"who":"C","name":"Christian","t":"A great and good man, called Evangelist.","h":"5b5ad9a3","d":2.6,"pl":"plain","prop":"cut","r":"","note":""},{"who":"WW","name":"Wiseman","t":"There is no more dangerous way in all the world! I see the mud of the Slough of Despond is on you already.","h":"6c6fadc3","d":7.8,"pl":"plain","prop":"reword","r":"There is no more dangerous way in all the world!","note":""},{"who":"WW","name":"Wiseman","t":"In that village, Morality, lives a gentleman named Legality. He can take burdens like yours away.","h":"04b5fe05","d":7.4,"pl":"plain","prop":"keep","r":"","note":""},{"who":"C","name":"Christian","t":"Sir, which way is his house?","h":"0df41d19","d":2.3,"pl":"plain","prop":"cut","r":"","note":"Wiseman points without being asked"},{"who":"WW","name":"Wiseman","t":"Do you see that hill?","h":"34f7dce5","d":1.2,"pl":"plain","prop":"reword","r":"Do you see that hill? Go by it. The first house you come to is his.","note":"one line; you touch the hill after it"},{"who":"WW","name":"Wiseman","t":"Go by that hill. The first house you come to is his.","h":"ae603f0b","d":3.3,"pl":"plain","prop":"cut","r":"","note":"merged into the line above"},{"who":"N","name":"Storyteller","t":"So Christian turned out of his way, to go to Mr. Legality's house for help.","h":"820c4730","d":6.5,"pl":"turn","prop":"cut","r":"","note":"the dark sky and the bent tune show it"},{"who":"N","name":"Storyteller","t":"But close to, the hill was so high, and hung so far over the way, that Christian was afraid it would fall on his head.","h":"2b306c52","d":10.2,"pl":"foot","prop":"reword","r":"The hill hung so far over the way that Christian was afraid it would fall on his head.","note":""},{"who":"N","name":"Storyteller","t":"Flashes of fire came out of the hill, and Christian was afraid he would be burned.","h":"0c1e20e8","d":6.6,"pl":"foot","prop":"cut","r":"","note":"the fire is shown"},{"who":"N","name":"Storyteller","t":"Now he was sorry he had listened to Mr. Worldly Wiseman.","h":"06478579","d":4.8,"pl":"foot","prop":"cut","r":"","note":"his trembling shows it"},{"who":"E","name":"Evangelist","t":"What are you doing here, Christian?","h":"13b4e9e3","d":2.1,"pl":"evan","prop":"reword","r":"What are you doing here, Christian? You are out of the way.","note":""},{"who":"E","name":"Evangelist","t":"Why have you turned aside so soon? You are out of the way.","h":"8dfcf57c","d":5.3,"pl":"evan","prop":"cut","r":"","note":"merged into the line above"},{"who":"C","name":"Christian","t":"Just after the Slough, I met a gentleman. He said a man in that village could take my burden off.","h":"39137c64","d":6.4,"pl":"evan","prop":"keep","r":"","note":""},{"who":"N","name":"Storyteller","t":"Then Christian fell down at his feet, crying:","h":"561393cf","d":3.7,"pl":"evan","prop":"cut","r":"","note":"the kneel shows it"},{"who":"C","name":"Christian","t":"Woe is me, for I am undone!","h":"41c1340b","d":4.9,"pl":"evan","prop":"keep","r":"","note":""},{"who":"N","name":"Storyteller","t":"At the sight of this, Evangelist caught him by the right hand.","h":"0b285d54","d":4.6,"pl":"evan","prop":"cut","r":"","note":"shown: you touch his hand (idea B)"},{"who":"E","name":"Evangelist","t":"All manner of sin shall be forgiven unto men. Be not faithless, but believing.","h":"268a2216","d":6.4,"pl":"evan","prop":"keep","r":"","note":""},{"who":"N","name":"Storyteller","t":"Then Christian revived a little, and stood up trembling.","h":"d890a4fe","d":4.2,"pl":"evan","prop":"cut","r":"","note":"the rise shows it"},{"who":"E","name":"Evangelist","t":"That man was Worldly Wiseman. Mr. Legality cannot free you from your burden. No one was ever freed by him.","h":"6490e99e","d":9.8,"pl":"evan","prop":"reword","r":"That man was Worldly Wiseman. Mr. Legality cannot free you.","note":""},{"who":"C","name":"Christian","t":"Sir, is there hope? May I go back to the gate? I am sorry I listened to him. May I be forgiven?","h":"418ff6c6","d":9.6,"pl":"evan","prop":"reword","r":"Sir, is there hope? May I go back to the gate?","note":""},{"who":"E","name":"Evangelist","t":"Your sin is very great. Yet the man at the gate will receive you, for he has goodwill for men.","h":"fb32a8e5","d":7.9,"pl":"evan","prop":"keep","r":"","note":""},{"who":"N","name":"Storyteller","t":"Then Evangelist gave him one smile, and bid him God-speed.","h":"8060db69","d":5.7,"pl":"evan","prop":"reword","r":"God-speed.","note":"said by Evangelist himself"},{"who":"N","name":"Storyteller","t":"He hurried like one treading on forbidden ground, and did not feel safe until he was back on the right way.","h":"589eea39","d":8.2,"pl":"back","prop":"cut","r":"","note":"shown: the run back (idea D)"},{"who":"N","name":"Storyteller","t":"So, in time, Christian got up to the gate. Now over the gate there was written: Knock, and it shall be opened unto you.","h":"636d121b","d":13.2,"pl":"gate","prop":"cut","r":"","note":"the sign glows; touch it to read"},{"who":"N","name":"Storyteller","t":"He knocked, more than once or twice, saying:","h":"dd22d88e","d":3.8,"pl":"gate","prop":"cut","r":"","note":"a quiet tip: \"Knock on the gate.\""},{"who":"C","name":"Christian","t":"May I come in? Will he open to me, sorry as I am?","h":"c61f0669","d":7.2,"pl":"gate","prop":"keep","r":"","note":""},{"who":"N","name":"Storyteller","t":"At last there came a grave person to the gate, named Good-will.","h":"eb1686f5","d":6.9,"pl":"gate","prop":"keep","r":"","note":""}];
const PLACES = { plain: ['The plain and the oak', 'Wiseman meets him and points to the hill'], turn: ['Over the bump', 'he turns out of his way'], foot: ['The foot of the mountain', 'the overhang, the fire, the wide shot'], evan: ['Evangelist', 'the longest wait: 12 lines in a row'], back: ['Hurrying back', 'along the rocky path, then the mist'], gate: ['The gate', 'the lantern, the sign, the knocking'] };
const IDEAS = [
  ['A', 'At the foot', 'a creak, a trickle of stones beside him, and he stops and lifts his head toward the overhang.', 1],
  ['B', "Evangelist's hand", 'Evangelist reaches down in the warm light and you touch his hand to raise Christian, an echo of Help\'s hand in the Slough.', 1],
  ['C', 'The fire sinks', 'already built: on "the man at the gate will receive you" the fire dies down. (Untick to take it out.)', 1],
  ['D', 'Hurrying back', 'he runs, stones fall behind him, and at the crossing the far light shows again over the hill\'s shoulder.', 1],
  ['E', "Evangelist's farewell", 'a small lift of his hand as Christian runs off; the warm light lingers where he stood.', 1],
  ['F', 'The sign', 'a soft glint on the carved stone as he arrives, inviting a touch to read it close up.', 1],
];
const KEY = 'pp-level3-cuts';
const S = JSON.parse(localStorage.getItem(KEY) || '{}');
ROWS.forEach((r, i) => { r.i = i + 1; if (!S[r.i]) S[r.i] = { c: r.prop, o: '' }; });
IDEAS.forEach(d => { if (S[d[0]] === undefined) S[d[0]] = !!d[3]; });
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const words = t => t.trim().split(/\s+/).length;
function secs(r) {
  const s = S[r.i];
  if (s.c === 'cut') return 0;
  if (s.c === 'reword' && r.r) return Math.min(r.d, r.d * words(r.r) / words(r.t) + .6);
  if (s.c === 'own' && s.o.trim()) return words(s.o) / 2.3;
  return r.d;
}
function totals() {
  let was = 0, now = 0, n = 0, ev = 0, ev0 = 0, rew = 0;
  for (const r of ROWS) { const d = secs(r); was += r.d; now += d; if (d) n++; if (r.pl === 'evan') { ev0 += r.d; ev += d; } const c = S[r.i].c; if (c === 'reword' || c === 'own') rew++; }
  const m = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
  document.getElementById('tot').innerHTML = '<div>Speech: <b>' + m(now) + '</b> (was ' + m(was) + ') · <b>' + n + '</b> lines (was ' + ROWS.length + ')</div><div>Evangelist: <b>' + Math.round(ev) + ' s</b> (was ' + Math.round(ev0) + ') · new recordings: ' + rew + ' (about ' + rew + '¢)</div>';
}
let audioEl = null;
function play(r) { if (audioEl) audioEl.pause(); audioEl = new Audio('assets/voice/' + r.h + '.mp3'); audioEl.play().catch(() => {}); }
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function render() {
  const L = document.getElementById('list'); L.innerHTML = ''; let pl = '';
  for (const r of ROWS) {
    if (r.pl !== pl) { pl = r.pl; const h = document.createElement('div'); h.className = 'place'; h.innerHTML = PLACES[pl][0] + '<small>' + PLACES[pl][1] + '</small>'; L.appendChild(h); }
    const s = S[r.i], d = document.createElement('div'); d.className = 'row ' + s.c;
    d.innerHTML = '<div class="top"><span class="n">' + r.i + '</span><span class="who">' + r.name + '</span><button class="play" title="play">▶</button><span class="prop">' + r.d.toFixed(0) + ' s · proposed: ' + r.prop + '</span></div>'
      + '<div class="txt">' + esc(r.t) + (r.r ? '<span class="new">' + esc(r.r) + (r.rwho ? ' (' + r.rwho + ')' : '') + '</span>' : '') + '</div>'
      + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '')
      + '<div class="btns">' + ['keep', 'cut', 'reword', 'own'].map(c => '<button class="b ' + c + (s.c === c ? ' on' : '') + '" data-c="' + c + '"' + (c === 'reword' && !r.r ? ' disabled' : '') + '>' + (c === 'own' ? 'Own words' : c[0].toUpperCase() + c.slice(1)) + '</button>').join('') + '</div>'
      + (s.c === 'own' ? '<textarea placeholder="Your words for this line">' + esc(s.o) + '</textarea>' : '');
    d.querySelectorAll('.b[data-c]').forEach(b => b.onclick = () => { s.c = b.dataset.c; save(); render(); totals(); });
    d.querySelector('.play').onclick = () => play(r);
    const ta = d.querySelector('textarea'); if (ta) ta.oninput = () => { s.o = ta.value; save(); totals(); };
    L.appendChild(d);
  }
  const I = document.getElementById('ideas'); I.innerHTML = '';
  for (const [k, t, x] of IDEAS) {
    const d = document.createElement('label'); d.className = 'idea';
    d.innerHTML = '<input type="checkbox"' + (S[k] ? ' checked' : '') + '><span><b>' + k + '. ' + t + ':</b> ' + x + '</span>';
    d.querySelector('input').onchange = e => { S[k] = e.target.checked; save(); };
    I.appendChild(d);
  }
}
function done() {
  const ch = [];
  for (const r of ROWS) { const s = S[r.i]; if (s.c !== r.prop || s.c === 'own') ch.push('#' + r.i + ' ' + s.c + (s.c === 'own' ? ': "' + s.o.trim() + '"' : '')); }
  const ideas = IDEAS.filter(d => S[d[0]]).map(d => d[0]).join(', ') || 'none';
  const txt = 'LEVEL 3 CUTS: everything else as proposed (' + ch.length + ' changes)\n' + (ch.length ? ch.join('\n') : '(no changes)') + '\nIdeas: ' + ideas;
  const o = document.getElementById('out'); o.value = txt; o.select(); o.scrollIntoView({ block: 'center' });
  const copied = () => { document.getElementById('copy').textContent = 'Copied ✓ now paste it in the chat'; };
  const copy = () => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(copied).catch(() => { try { document.execCommand('copy'); copied(); } catch (e) {} });
  if (navigator.share) navigator.share({ title: 'Level 3 cuts', text: txt }).catch(copy); else copy();
}
document.getElementById('copy').onclick = done; document.getElementById('done1').onclick = done;
document.getElementById('reset').onclick = () => { if (!confirm('Put every line back to my proposal?')) return; for (const r of ROWS) S[r.i] = { c: r.prop, o: '' }; IDEAS.forEach(d => S[d[0]] = !!d[3]); save(); render(); totals(); };
render(); totals();
</script>
<!-- Level 3's line chooser (after build 364): delete once the owner's choices are in the game -->
</body></html>
