<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilgrim's Progress: Level 2 cuts</title>
<style>html,body{margin:0;background:#16151b;color:#e9e4da;font:16px/1.4 Georgia,serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#16151bee;backdrop-filter:blur(6px);border-bottom:1px solid #333;padding:8px 10px}
h1{font-size:17px;margin:0 0 4px;font-weight:normal;color:#e8c48a}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tab{border:1px solid #555;border-radius:14px;padding:3px 10px;font-size:13px;background:none;color:#ccc}
.tab.on{background:#e8c48a;color:#16151b;border-color:#e8c48a}
.tot{font-size:12.5px;color:#aaa}.tot b{color:#e9e4da}
.help{font-size:13px;color:#aaa;padding:8px 10px;margin:0}
.row{border-bottom:1px solid #2b2a31;padding:9px 10px}
.row.cut .txt{opacity:.38;text-decoration:line-through}
.top{display:flex;gap:8px;align-items:baseline}
.n{color:#777;font-size:12px;min-width:26px}
.who{color:#e8c48a;font-style:italic;font-size:14px}
.tag{font-size:11px;color:#999;border:1px solid #444;border-radius:8px;padding:0 5px;margin-left:4px}
.txt{margin:3px 0 6px 34px}
.new{display:block;color:#bfe0b4;margin-top:3px}
.new:before{content:"→ "}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-left:34px;align-items:center}
.b{border:1px solid #555;background:#222128;color:#ddd;border-radius:7px;padding:5px 9px;font:13px Georgia,serif}
.b.on.keep{background:#4f6b4a;border-color:#7a9a72;color:#fff}
.b.on.cut{background:#7a3d3d;border-color:#a55;color:#fff}
.b.on.reword{background:#3d5a7a;border-color:#6a8db0;color:#fff}
.b.on.own{background:#6b5a2f;border-color:#a8904e;color:#fff}
.b.walk.on{background:#3b3b5a;border-color:#8a8ac0;color:#fff}
.b:disabled{opacity:.3}
.play{border:none;background:none;color:#e8c48a;font-size:15px;padding:2px 4px}
textarea{display:block;width:calc(100% - 34px);margin:6px 0 0 34px;box-sizing:border-box;background:#0f0f13;color:#eee;border:1px solid #555;border-radius:6px;font:15px Georgia,serif;padding:6px;min-height:52px}
.prop{font-size:11px;color:#888;margin-left:6px}
footer{padding:14px 10px 40px}
#out{width:100%;box-sizing:border-box;min-height:140px;background:#0f0f13;color:#ddd;border:1px solid #555;border-radius:6px;font:13px ui-monospace,Menlo,monospace;padding:6px}
.big{font-size:15px;padding:9px 14px;background:#e8c48a;color:#16151b;border:none;border-radius:8px;margin:6px 6px 6px 0}

.place{display:block;background:#201f27;color:#e8c48a;padding:10px 10px 6px;font-size:15px;border-bottom:1px solid #333}
.place small{color:#999;font-size:12px;display:block}
.note{font-size:12px;color:#9a9;margin:0 0 6px 34px;font-style:italic}
.idea{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid #2b2a31}
.idea input{transform:scale(1.4);margin-top:5px}
.idea b{color:#e8c48a}
</style></head><body>
<header>
  <h1>Level 2, the Slough: choose for each line</h1>
  <div class="tot" id="tot"></div>
  <button class="big" id="done1" style="font-size:13px;padding:5px 12px;margin:4px 0 0">✓ Done</button>
</header>
<p class="help"><b>Keep</b> it · <b>Cut</b> it · <b>Reword</b>: my shorter wording (in green) · <b>Own</b>: type your own. My proposal is set to begin with; ▶ plays the line as recorded. The totals at the top show how much speech is left.</p>
<div id="list"></div>
<div id="ideas"></div>
<footer>
  <button class="big" id="copy">✓ Done: send my choices</button><button class="big" id="reset" style="background:#444;color:#ddd">Back to my proposal</button>
  <textarea id="out" readonly></textarea>
</footer>
<script>
const ROWS = [{"who": "Pliable", "name": "Pliable", "t": "Tell me more of the place where we are going.", "h": "c6b14890", "d": 2.3, "pl": "plain", "prop": "keep", "r": "", "note": "opens the talk; the city seen in the sky comes on the next line"}, {"who": "Christian", "name": "Christian", "t": "There shall be no more crying, nor sorrow. We shall shine like the sun.", "h": "801cb809", "d": 6.9, "pl": "plain", "prop": "keep", "r": "We shall shine like the sun.", "note": "the shining city appears in the sky as he says it"}, {"who": "Pliable", "name": "Pliable", "t": "I'm glad to hear it! Come on, let's walk faster!", "h": "acf33f2d", "d": 2.7, "pl": "plain", "prop": "cut", "r": "", "note": "with the next line cut too, the plain is one question and one answer"}, {"who": "Christian", "name": "Christian", "t": "I cannot go fast, because of this burden on my back.", "h": "92fd2179", "d": 3.9, "pl": "plain", "prop": "cut", "r": "", "note": "the picture shows him slow under the burden"}, {"who": "", "name": "Storyteller", "t": "Not looking where they went, they fell into the bog. Its name was Despond.", "h": "2305258f", "d": 8.1, "pl": "fall", "prop": "reword", "r": "They fell into the bog. Its name was Despond.", "note": "the fall is shown; keep only the name"}, {"who": "Pliable", "name": "Pliable", "t": "Ah, neighbor Christian, where are you now?", "h": "3e24b12f", "d": 3, "pl": "fall", "prop": "keep", "r": "", "note": ""}, {"who": "Christian", "name": "Christian", "t": "Truly, I do not know.", "h": "a883b588", "d": 2.7, "pl": "fall", "prop": "cut", "r": "", "note": "Pliable can go straight on to his anger"}, {"who": "Pliable", "name": "Pliable", "t": "Is this the happiness you told me of? You can have your fine country all to yourself!", "h": "a6ded318", "d": 4.9, "pl": "fall", "prop": "reword", "r": "You can have your fine country all to yourself!", "note": "the angrier half alone"}, {"who": "", "name": "Storyteller", "t": "He struggled out on his own side, and Christian saw him no more.", "h": "cae9dbd4", "d": 6.7, "pl": "fall", "prop": "cut", "r": "", "note": "shown: he climbs out and walks off into the mist"}, {"who": "", "name": "Storyteller", "t": "Christian turned back toward his own house. The mist grew thick and dark.", "h": "fce6e767", "d": 6.7, "pl": "back", "prop": "cut", "r": "", "note": "shown: he turns and the mist darkens"}, {"who": "Christian", "name": "Christian", "t": "No. I must struggle on, toward the gate.", "h": "2df198f2", "d": 6.7, "pl": "back", "prop": "keep", "r": "", "note": "the turn back to the way"}, {"who": "", "name": "Storyteller", "t": "So Christian was left alone.", "h": "82ca3baf", "d": 3.9, "pl": "wade", "prop": "cut", "r": "", "note": "shown: the camera comes in close on him alone"}, {"who": "", "name": "Storyteller", "t": "Many fears and doubts came over him, and settled in that place.", "h": "23cbe94c", "d": 6.4, "pl": "wade", "prop": "keep", "r": "", "note": "the darkness and drums come on this line"}, {"who": "", "name": "Storyteller", "t": "But at the far side he could not get out, because of the burden on his back.", "h": "71c1f1f7", "d": 6.4, "pl": "help", "prop": "reword", "r": "He could not get out, because of the burden on his back.", "note": ""}, {"who": "", "name": "Storyteller", "t": "Then a man came to him, whose name was Help.", "h": "5fcdd54b", "d": 4.5, "pl": "help", "prop": "keep", "r": "", "note": "the only place Help is named"}, {"who": "Help", "name": "Help", "t": "Why did you not look for the steps?", "h": "9aee521a", "d": 2, "pl": "help", "prop": "keep", "r": "", "note": ""}, {"who": "Christian", "name": "Christian", "t": "Fear followed me so hard that I fled the nearest way, and fell in.", "h": "2e336789", "d": 7.5, "pl": "help", "prop": "reword", "r": "Fear followed me so hard that I fell in.", "note": ""}, {"who": "Help", "name": "Help", "t": "Give me your hand.", "h": "8389bee3", "d": 1.3, "pl": "help", "prop": "keep", "r": "", "note": "the child takes his hand"}, {"who": "", "name": "Storyteller", "t": "There were good steps through the middle of the bog, but in the mist they were hard to see.", "h": "32622bcb", "d": 6.2, "pl": "steps", "prop": "cut", "r": "", "note": "shown: the lights find the stones while the camera draws back over the bog"}, {"who": "Help", "name": "Help", "t": "Go on your way.", "h": "86e5a87b", "d": 1.1, "pl": "steps", "prop": "keep", "r": "", "note": ""}];
const PLACES = { plain: ['The plain', 'the two walking and talking, in gold'], fall: ['The fall', 'into the bog, Pliable\'s anger, he leaves'], back: ['Going back (only if chosen)', 'not counted in the totals'], wade: ['Alone in the mire', 'wading across'], help: ['The far bank', 'stuck, then Help comes'], steps: ['Out', 'the steps, and on his way'] };
const IDEAS = [];
const KEY = 'pp-level2-cuts-2';
const S = JSON.parse(localStorage.getItem(KEY) || '{}');
ROWS.forEach((r, i) => { r.i = i + 1; if (!S[r.i]) S[r.i] = { c: r.prop, o: '' }; });
IDEAS.forEach(d => { if (S[d[0]] === undefined) S[d[0]] = !!d[3]; });
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const words = t => t.trim().split(/\s+/).length;
function secs(r) {
  const s = S[r.i];
  if (s.c === 'cut') return 0;
  if (s.c === 'reword' && r.r) return Math.min(r.d, r.d * words(r.r) / words(r.t) + .6);
  if (s.c === 'own' && s.o.trim()) return words(s.o) / 2.3;
  return r.d;
}
function totals() {
  let was = 0, now = 0, n = 0, n0 = 0, ev = 0, ev0 = 0, rew = 0;
  for (const r of ROWS) { const d = secs(r); if (r.pl !== 'back') { was += r.d; now += d; n0++; if (d) n++; } if (r.pl === 'help') { ev0 += r.d; ev += d; } const c = S[r.i].c; if (c === 'reword' || c === 'own') rew++; }
  const m = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
  document.getElementById('tot').innerHTML = '<div>Speech: <b>' + m(now) + '</b> (was ' + m(was) + ') · <b>' + n + '</b> lines (was ' + n0 + '), the main way</div><div>The far bank: <b>' + Math.round(ev) + ' s</b> (was ' + Math.round(ev0) + ') · new recordings: ' + rew + ' (about ' + rew + '¢)</div>';
}
let audioEl = null;
function play(r) { if (audioEl) audioEl.pause(); audioEl = new Audio('assets/voice/' + r.h + '.mp3'); audioEl.play().catch(() => {}); }
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function render() {
  const L = document.getElementById('list'); L.innerHTML = ''; let pl = '';
  for (const r of ROWS) {
    if (r.pl !== pl) { pl = r.pl; const h = document.createElement('div'); h.className = 'place'; h.innerHTML = PLACES[pl][0] + '<small>' + PLACES[pl][1] + '</small>'; L.appendChild(h); }
    const s = S[r.i], d = document.createElement('div'); d.className = 'row ' + s.c;
    d.innerHTML = '<div class="top"><span class="n">' + r.i + '</span><span class="who">' + r.name + '</span><button class="play" title="play">▶</button><span class="prop">' + r.d.toFixed(0) + ' s · proposed: ' + r.prop + '</span></div>'
      + '<div class="txt">' + esc(r.t) + (r.r ? '<span class="new">' + esc(r.r) + (r.rwho ? ' (' + r.rwho + ')' : '') + '</span>' : '') + '</div>'
      + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '')
      + '<div class="btns">' + ['keep', 'cut', 'reword', 'own'].map(c => '<button class="b ' + c + (s.c === c ? ' on' : '') + '" data-c="' + c + '"' + (c === 'reword' && !r.r ? ' disabled' : '') + '>' + (c === 'own' ? 'Own words' : c[0].toUpperCase() + c.slice(1)) + '</button>').join('') + '</div>'
      + (s.c === 'own' ? '<textarea placeholder="Your words for this line">' + esc(s.o) + '</textarea>' : '');
    d.querySelectorAll('.b[data-c]').forEach(b => b.onclick = () => { s.c = b.dataset.c; save(); render(); totals(); });
    d.querySelector('.play').onclick = () => play(r);
    const ta = d.querySelector('textarea'); if (ta) ta.oninput = () => { s.o = ta.value; save(); totals(); };
    L.appendChild(d);
  }
  const I = document.getElementById('ideas'); I.innerHTML = '';
  for (const [k, t, x] of IDEAS) {
    const d = document.createElement('label'); d.className = 'idea';
    d.innerHTML = '<input type="checkbox"' + (S[k] ? ' checked' : '') + '><span><b>' + k + '. ' + t + ':</b> ' + x + '</span>';
    d.querySelector('input').onchange = e => { S[k] = e.target.checked; save(); };
    I.appendChild(d);
  }
}
function done() {
  const ch = [];
  for (const r of ROWS) { const s = S[r.i]; if (s.c !== r.prop || s.c === 'own') ch.push('#' + r.i + ' ' + s.c + (s.c === 'own' ? ': "' + s.o.trim() + '"' : '')); }
  const ideas = IDEAS.filter(d => S[d[0]]).map(d => d[0]).join(', ') || 'none';
  const txt = 'LEVEL 2 CUTS (round 2): everything else as proposed (' + ch.length + ' changes)\n' + (ch.length ? ch.join('\n') : '(no changes)') ;
  const o = document.getElementById('out'); o.value = txt; o.select(); o.scrollIntoView({ block: 'center' });
  const copied = () => { document.getElementById('copy').textContent = 'Copied ✓ now paste it in the chat'; };
  const copy = () => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(copied).catch(() => { try { document.execCommand('copy'); copied(); } catch (e) {} });
  if (navigator.share) navigator.share({ title: 'Level 2 cuts', text: txt }).catch(copy); else copy();
}
document.getElementById('copy').onclick = done; document.getElementById('done1').onclick = done;
document.getElementById('reset').onclick = () => { if (!confirm('Put every line back to my proposal?')) return; for (const r of ROWS) S[r.i] = { c: r.prop, o: '' }; IDEAS.forEach(d => S[d[0]] = !!d[3]); save(); render(); totals(); };
render(); totals();
</script>
<!-- Level 2's line chooser (round 2, after build 388): delete once the owner's choices are in the game -->
</body></html>
