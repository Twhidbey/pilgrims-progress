<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pilgrim's Progress · story lab</title>
<style>
html,body{margin:0;height:100%;background:#1b1c22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.portrait #wrap{align-items:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
#stage{position:relative;overflow:hidden;border-radius:6px}
canvas{display:block;width:100%;height:100%}
button{font-family:Georgia,'Times New Roman',serif;-webkit-appearance:none;appearance:none}
/* title and end: pale words over the living scene, no box */
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;color:#f4ecdc;text-shadow:0 1px 10px rgba(8,10,16,.75);transition:opacity 1.6s ease}
.card h1{font-weight:400;font-style:italic;font-size:clamp(28px,6.5vw,64px);margin:0 0 .12em;letter-spacing:.5px}
.card h2{font-weight:400;font-size:clamp(13px,2.3vw,22px);margin:0 0 1.3em;color:rgba(244,236,220,.82);letter-spacing:.14em;text-transform:uppercase}
.card p{font-size:clamp(14px,2.2vw,20px);margin:.25em 1em;color:rgba(244,236,220,.9)}
.btn{font-size:clamp(16px,2.6vw,24px);font-style:italic;padding:.4em 1.7em;border-radius:40px;border:1px solid rgba(244,236,220,.7);background:rgba(20,22,30,.28);color:#f4ecdc;cursor:pointer;margin:.7em .3em 0}
.btn:active{transform:scale(.96)}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(18,20,28,.2),rgba(18,20,28,.62))}
#endc{background:radial-gradient(ellipse at 50% 45%,rgba(60,40,10,.05),rgba(40,26,8,.42));opacity:0;pointer-events:none}
#endc.on{opacity:1;pointer-events:auto}
/* the words: a thin strip of light text on the dark road, under everyone's feet */
#dlg{position:absolute;left:0;right:0;top:82.5%;bottom:0;padding:0 7.5% 0 4%;font-family:Georgia,serif;color:#f4ecdc;display:none;background:linear-gradient(rgba(14,14,20,0),rgba(14,14,20,.4) 30%);text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
#dlg.on{display:flex;align-items:center}
#dlg .who{font-style:italic;color:#e8c27c}
#dlg .who:not(:empty)::after{content:': '}
#dlg .txt{font-size:clamp(13px,2.1vw,20px);line-height:1.3;animation:rise .5s ease both}
#dlg.hint .txt{font-style:italic;color:rgba(244,236,220,.85)}
#dlg .more{position:absolute;right:1.2%;bottom:6%;font-size:clamp(11px,1.6vw,15px);color:rgba(244,236,220,.7)}
#dlg.cap .more,#dlg.cap .say{display:none}
#dlg.wait .more{visibility:hidden}
#dlg.act .more{color:#e8c27c;font-style:italic;animation:glowtxt 2.2s ease-in-out infinite}
#dlg .say.off{opacity:.3}
#dlg .say{position:absolute;right:.6%;top:8%;border:none;background:none;font-size:clamp(15px,2.4vw,22px);cursor:pointer;padding:.1em;opacity:.85;pointer-events:auto}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes glowtxt{0%,100%{opacity:.55}50%{opacity:1}}
/* a choice: two quiet buttons on the road */
#choice{position:absolute;left:0;right:0;top:82.5%;bottom:0;display:none;align-items:center;justify-content:center;gap:5%;background:linear-gradient(rgba(14,14,20,0),rgba(14,14,20,.45) 30%)}
#choice.on{display:flex}
#choice button{font-size:clamp(14px,2.3vw,21px);font-style:italic;color:#f4ecdc;background:rgba(20,22,30,.3);border:1px solid rgba(244,236,220,.55);border-radius:40px;padding:.35em 1.4em;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.8);animation:rise .6s ease both}
#choice button:active{transform:scale(.96)}
#snd{position:absolute;right:1%;top:1.5%;width:2.2em;height:2.2em;border-radius:50%;border:none;background:rgba(20,22,30,.22);color:rgba(244,236,220,.8);font-size:clamp(14px,2vw,19px);cursor:pointer;display:none}
body.playing #snd,body.opened #snd{display:block}
#play{animation:rise 1.4s ease both}
#snd.off{color:rgba(244,236,220,.35);text-decoration:line-through}
#build{position:absolute;right:1.2%;bottom:1%;font:12px Georgia,serif;color:rgba(255,250,235,.7);text-shadow:0 0 3px rgba(0,0,0,.7);pointer-events:none}
body.talking #build,body.capped #build{visibility:hidden}
#rot{position:fixed;left:0;right:0;text-align:center;font:15px Georgia,serif;color:#cfc6bb;display:none}
body.portrait #rot{display:block}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="dlg"><div class="txt"><span class="who"></span><span class="t"></span></div><div class="more">tap ▸</div><button class="say" aria-label="Voice on or off">🔊</button></div>
  <div id="choice"><button id="chHome">Go home</button><button id="chOn">Go on to the light</button></div>
  <div id="title" class="card">
    <h1>Pilgrim's Progress</h1>
    <h2 id="sub">Getting ready…</h2>
    <button class="btn" id="open" style="visibility:hidden">Open the book</button>
    <button class="btn" id="play" style="display:none">Begin</button>
  </div>
  <div id="endc" class="card">
    <h1 style="font-size:clamp(24px,5vw,48px)">Out of the city</h1>
    <p>The lights he gathered went on ahead of him.</p>
    <p style="color:rgba(244,236,220,.7)">Next: the Slough of Despond</p>
    <button class="btn" id="again">Walk again</button>
  </div>
  <button id="snd" aria-label="Sound on or off">♪</button>
  <div id="build">story lab · build 31 · Nov 15 2026</div>
</div></div>
<div id="rot">Turn your phone sideways for a bigger picture</div>
<script>
// STORY LAB: Level 1 as a story walk. No jumps, no obstacles, no score.
//   Hold to walk toward the light. Lights on the road each sing one note of a hymn as Christian gathers them.
//   Things answer a touch (lamps, windows, birds, the bell, puddles, the far light). Story moments ask for one simple act.
// The scenery code below (setup .. bakeFinish) is copied from index.html: keep the two in step.
// The characters' frames are NOT in this file: they load from assets/*.pack (made by tools/pack-frames.py from index.html).
// The spoken lines are recordings in assets/voice (made by tools/make-voice.py from the words in this file).
const CHR_META={"ax": 93, "ground": 295, "frames": 38, "vpx": 4.9, "rest": [12, 29], "leap": 10};
const PLI_META={"ax": 98, "ground": 298, "frames": 32, "vpx": 6.0, "rest": [0, 18]};
const OBS_META={"ax": 95, "ground": 307, "frames": 32, "vpx": 6.0, "rest": [23]};
const EVA_META={"ax": 82, "ground": 311, "frames": 80, "src": [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 46, 49, 52, 55, 58, 61, 64, 67, 70, 73, 76, 79, 82, 85, 88, 91, 94, 97, 100, 103, 106, 109, 112, 115, 118, 121, 124, 127, 130, 133, 136, 139, 142, 145, 148, 151, 154, 157, 160, 163, 166, 169, 172, 175, 178, 180, 182, 184, 186, 188, 190, 192, 194, 196, 198, 200, 202, 204, 206, 208, 210, 212, 216, 220, 224, 228, 232, 236]};
const STD_META={"ax": 101, "ground": 302, "frames": 79, "src": [0, 2, 4, 6, 8, 10, 12, 14, 16, 17, 19, 21, 23, 25, 27, 29, 31, 33, 35, 37, 39, 41, 43, 45, 47, 49, 51, 53, 55, 57, 59, 61, 63, 65, 67, 69, 71, 73, 75, 77, 79, 81, 83, 85, 87, 89, 91, 93, 95, 96, 100, 104, 108, 112, 116, 120, 124, 128, 132, 136, 140, 144, 148, 152, 156, 160, 164, 168, 172, 176, 180, 184, 188, 192, 196, 200, 204, 208, 212]};

// ---------- setup ----------
const VW = 960, VH = 540, GY = 440, LEVEL_W = 5800, PANG = LEVEL_W - VW, GATE = 5340;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let DPR = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  const portrait = h > w;
  document.body.classList.toggle('portrait', portrait);
  let sw = w, sh = w * VH / VW;
  if (sh > h) { sh = h; sw = h * VW / VH; }
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
  DPR = Math.min(2, (window.devicePixelRatio || 1) * sw / VW);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  document.getElementById('rot').style.top = (sh + 26) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- small helpers ----------
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
// seeded random so the scenery is the same every time
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);
const rr = (a, b) => a + (b - a) * R();
let seed = 7;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
// fractal noise, -1..1: big slow shapes with smaller and smaller detail on top (how real land looks)
function mkNoise() {
  const o = R() * 1000, h = i => { const v = Math.sin(i * 127.1 + o) * 43758.5453; return v - Math.floor(v); };
  return (x, wl, oct = 5, gain = .5) => {
    let v = 0, a = 1, t = 0, f = 1 / wl;
    for (let k = 0; k < oct; k++) { const q = x * f + k * 31.7, i = Math.floor(q), u = q - i, w = u * u * (3 - 2 * u); v += a * (lerp(h(i), h(i + 1), w) * 2 - 1); t += a; a *= gain; f *= 2.07; }
    return v / t;
  };
}

// ---------- the look (settled in style-lab.html; keep the two files in step) ----------
// look=50.60.65.29.4.80.30.66.41.19.55.35.0-0.1.1.3 : Storm to gold, 4 layers
const LOOK = { rain: .6, gold: .65, mist: .29, depth: .8, thru: .3, soft: .66, hills: .38, trees: .55, win: .35 };
const PAL = { skyC: ['#5d6b80', '#b3bdc7'], skyW: ['#e6c687', '#fff2cc'], hazeC: '#b7c2cc', hazeW: '#ffe9b8', nearC: '#1d2838', nearW: '#3b2a1b', cloud: '#3f4a5c', light: '#fff0c4', win: '#ffd27a' };
for (const k in PAL) PAL[k] = Array.isArray(PAL[k]) ? PAL[k].map(hex) : hex(PAL[k]);
const SUN = [790, 195];
// the weather across the screen: 0 = rain, 1 = golden. It clears as Christian walks toward the light.
let clearAt = 1;
const warm = fx => smooth(clearAt - .32, clearAt + .32, fx);
// a left-to-right gradient that follows the weather. a and b are [r,g,b] with alphas aa, ab
function hGrad(c, a, b, aa = 1, ab = 1, x0 = 0) {
  const g = c.createLinearGradient(x0, 0, x0 + VW, 0);
  for (let i = 0; i <= 10; i++) { const t = i / 10, w = warm(t); g.addColorStop(t, css(mix(a, b, w), lerp(aa, ab, w))); }
  return g;
}
// one colour per layer by depth: pale far away, dark up close. d: 0 far .. 1 the ground
function layerCol(d) {
  const t = 1 - LOOK.depth * .95 * (1 - Math.pow(clamp(d), 1.35));
  return [mix(PAL.hazeC, PAL.nearC, t), mix(PAL.hazeW, PAL.nearW, t)];
}
const colAt = (col, sx) => css(mix(col[0], col[1], warm(sx / VW)));

// ---------- scenery shapes: everything is a filled outline ----------
let L;                                    // the layer being built
const poly = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); L.shapes.push(p); return p; };
const blob = (p, x, y, rx, ry) => { p.moveTo(x + rx, y); p.ellipse(x, y, rx, ry, 0, 0, 6.2832); };
function house(x, gy, w, h, s, tall) {
  const b = gy + 60, top = gy - h, ln = (R() - .5) * .035 * h, k = R();
  let rh;
  if (tall) {                             // a tower or steeple
    rh = w * rr(1.6, 2.6);
    poly([[x, b], [x, top], [x - 1.5 * s, top], [x + w / 2, top - rh], [x + w + 1.5 * s, top], [x + w, top], [x + w, b]]);
    if (L.steeples) L.steeples.push([x + w / 2, top - rh, -1e9, false]);   // where a bell can be rung
  } else if (k < .55) {                   // gable end toward us, sometimes with a jutting upper floor
    rh = w * rr(.5, .85);
    const j = R() < .45 ? 3.5 * s : 0, jy = top + h * rr(.4, .55);
    poly([[x, b], [x, jy], [x - j, jy], [x - j + ln, top], [x - j - 2 * s + ln, top], [x + w / 2 + ln, top - rh], [x + w + j + 2 * s + ln, top], [x + w + j + ln, top], [x + w + j, jy], [x + w, jy], [x + w, b]]);
  } else {                                // roof seen from the side: a long ridge
    rh = w * rr(.22, .38) + 8 * s;
    const e = w * rr(.08, .2);
    poly([[x, b], [x + ln, top], [x - 3 * s + ln, top], [x + e + ln, top - rh], [x + w - e + ln, top - rh], [x + w + 3 * s + ln, top], [x + w + ln, top], [x + w, b]]);
    if (R() < .4 && w > 50 * s) { const dx = x + w * rr(.3, .7), dw = 9 * s; poly([[dx - dw, top - rh * .2], [dx, top - rh * .2 - dw * 1.3], [dx + dw, top - rh * .2]]); }
  }
  if (!tall && R() < .75) {               // chimney
    const cx = x + w * rr(.18, .78) + ln, cw = rr(5, 8) * s, ct = top - rh * rr(.55, 1) - rr(5, 12) * s;
    poly([[cx, top], [cx, ct], [cx - 1.2 * s, ct], [cx - 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct], [cx + cw, ct], [cx + cw, top]]);
  }
  if (!tall && s > .4) {                  // windows that may be lit
    const cols = Math.max(1, Math.round(w / (24 * s))), rows = Math.max(1, Math.floor(h / (34 * s)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      L.wins.push([x + (c + .5) * w / cols - 3 * s + ln * (1 - r / rows), top + 12 * s + r * 32 * s, 6 * s, 8.5 * s, R()]);
  }
}
function tree(x, gy, s, kind) {
  const p = new Path2D(), ln = rr(-5, 5) * s;
  if (kind === 0) {                       // round, leafy
    const th = rr(13, 26) * s, Rr = rr(24, 40) * s, cy = gy - th - Rr * .5;
    poly([[x - 4 * s, gy + 20], [x - 3 * s, gy], [x - 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 3 * s, gy], [x + 4 * s, gy + 20]]);
    for (let i = 0; i < 9; i++) { const a = R() * 6.283, d = R() * Rr * .55; blob(p, x + ln + Math.cos(a) * d * 1.35, cy + Math.sin(a) * d * .75, Rr * rr(.42, .68), Rr * rr(.36, .56)); }
    for (let i = 0; i < 22; i++) { const a = R() * 6.283; blob(p, x + ln + Math.cos(a) * Rr * 1.02, cy + Math.sin(a) * Rr * .6, Rr * rr(.1, .22), Rr * rr(.07, .15)); }
    poly([[x + ln * .6, gy - th * .7], [x + ln + Rr * .5, cy + Rr * .2], [x + ln + Rr * .45, cy + Rr * .3]]);
  } else if (kind === 1) {                // tall and narrow, like a poplar
    const hh = rr(62, 105) * s, w = rr(8, 12) * s, lf = [], rt = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, ww = w * Math.pow(Math.sin(Math.PI * Math.pow(t, .62)), .8) + .6 * s, y = gy - hh * (.1 + t * .9), cx = x + ln * t * .6; lf.push([cx - ww * rr(.82, 1.1), y]); rt.unshift([cx + ww * rr(.82, 1.1), y]); }
    poly([[x - 1.5 * s, gy + 20], ...lf, ...rt, [x + 1.5 * s, gy + 20]]);
  } else {                                // a low bush or hedge
    const n = 3 + (R() * 4 | 0);
    for (let i = 0; i < n; i++) blob(p, x + (i - n / 2) * 11 * s + rr(-3, 3) * s, gy - rr(3, 9) * s, rr(8, 14) * s, rr(7, 13) * s);
  }
  L.shapes.push(p);
}
function tuft(x, gy, hgt) {
  const n = 3 + (R() * 4 | 0);
  for (let i = 0; i < n; i++) { const bx = x + (i - n / 2) * 3, h = hgt * rr(.5, 1), lx = rr(-.5, .5) * h; poly([[bx - 1.3, gy + 4], [bx + lx, gy - h], [bx + 1.3, gy + 4]]); }
}
// a field fence far enough back to look the right size next to Christian
function fence(x0, gy, n) {
  for (let k = 0, x = x0; k < n; k++, x += 15) {
    const t = rr(-1, 1), y = gy(x), y2 = gy(x + 15);
    poly([[x - 1.1, y + 3], [x - 1.1 + t, y - 13 - rr(0, 2)], [x + 1.1 + t, y - 13], [x + 1.1, y + 3]]);
    if (k < n - 1) { poly([[x, y - 10.5], [x + 15, y2 - 10.5 + rr(-.7, .7)], [x + 15, y2 - 9], [x, y - 9]]); poly([[x, y - 5.5], [x + 15, y2 - 5.5 + rr(-.7, .7)], [x + 15, y2 - 4.2], [x, y - 4.2]]); }
  }
}

// ---------- build the scenery once ----------
// Each layer is baked twice, in its rain colour and its golden colour; draw() blends the two by the weather.
const SCN = [], TUFTS = [];
let FRONT, skyRain, skyGold, beamC, veilC;
function stencil(Lr, q) {
  const m = mk(Math.ceil(Lr.W * q) + 4, Math.ceil(VH * q) + 2), c = m.getContext('2d');
  c.scale(q, q); c.fillStyle = '#fff';
  if (Lr.back) { c.globalAlpha = .5; c.fill(Lr.back); c.globalAlpha = 1; }
  for (const p of Lr.shapes) c.fill(p);
  return m;
}
function tinted(mask, col) { const m = mk(mask.width, mask.height), c = m.getContext('2d'); c.drawImage(mask, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = css(col); c.fillRect(0, 0, m.width, m.height); c.globalCompositeOperation = 'source-over'; return m; }
function bake(Lr, q, col) {
  Lr.q = q; const m = stencil(Lr, q); Lr.cool = tinted(m, col[0]); Lr.warm = tinted(m, col[1]);
  // the highest thing in the layer, so draw() can skip the empty sky above it
  const t = mk(32, 135), c = t.getContext('2d'); c.drawImage(m, 0, 0, m.width, VH * q, 0, 0, 32, 135);
  const px = c.getImageData(0, 0, 32, 135).data; let row = 0;
  search: for (; row < 135; row++) for (let x = 0; x < 32; x++) if (px[(row * 32 + x) * 4 + 3] > 0) break search;
  Lr.top = Math.max(0, row * 4 - 8);
}
function buildScenery() {
  SCN.length = 0;
  for (let i = 0; i < 3; i++) {
    const d = i / 3, first = i === 0;
    R = rng(3 * 7919 + i * 977 + 11);
    const par = .05 + .95 * Math.pow(d, 1.6), W = VW + PANG * par + 60;
    const s = .26 + .74 * Math.pow(d, 1.15), base = lerp(280, GY, Math.pow(d, .9));
    const edge = 420 + (GATE - 420) * par;                  // where the city ends in this layer: lines up with the gate
    const amp = lerp(105, 24, Math.pow(d, .55)) * LOOK.hills * (first ? 1.25 : 1);
    const nz = mkNoise(), cl = mkNoise(), wd = mkNoise(), fine = mkNoise(), wl = lerp(380, 640, d);
    // a mountain range: long ridgelines that rise to rounded peaks, with shoulders and small crags
    const range = (x, w, sharp) => {
      const n0 = nz(x + 70 * wd(x, 400, 2), w, 3, .45) * 2.3, r = 1 - Math.min(1, Math.sqrt(n0 * n0 + .02) - .1);
      const roll = clamp(nz(x + 999, w * .55, 4, .5) * 1.7 * .5 + .5);
      return Math.pow(r, sharp) * .68 + roll * .32 + fine(x, 46, 3, .5) * .022;
    };
    const gy = x => {
      if (first) return base - 14 - amp * range(x, 820, 1.7);
      // rolling hills: broad rounded tops, wide valleys, and a rough edge where woods grow on the skyline
      let v = clamp(nz(x + 90 * wd(x, 500, 2), wl, 5, .46) * 1.9 * .5 + .5);
      v = Math.pow(v, 1.25);
      const woods = smooth(.05, .4, wd(x + 300, 260 * s + 90, 2)) * (fine(x, 15 * s + 3, 2, .6) * .5 + .5) * 5.5 * s;
      const cityFlat = lerp(.5, 1, smooth(edge - 120, edge + 260, x));
      return base - amp * v * cityFlat - woods * cityFlat;
    };

  for (const m of PUDDLES) {
    if (!on(m.x, m.w)) continue;
    const w = wAt(m.x + m.w / 2);
    ctx.fillStyle = css(mix(mix(PAL.skyC[1], PAL.hazeC, .5), PAL.hazeW, w), .42);
    ctx.beginPath(); ctx.ellipse(m.x + m.w / 2, GY + 9, m.w / 2, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = css(mix(PAL.skyC[1], PAL.hazeW, w), .3);
    ctx.beginPath(); ctx.ellipse(m.x + m.w * .4, GY + 8, m.w * .28, 3.5, 0, 0, 6.2832); ctx.fill();
  }
  ctx.lineWidth = 1.2;
  for (const r of G.ripples) for (const k of [0, 14]) {
    const t = r.t - k; if (t < 0) continue;
    ctx.strokeStyle = css(mix(PAL.hazeC, PAL.hazeW, wAt(r.x)), .55 * (1 - t / 70)); ctx.beginPath(); ctx.ellipse(r.x, GY + 9, 4 + t * .55, 1.2 + t * .1, 0, 0, 6.2832); ctx.stroke();
  }
  // light from the open gate lies across the road
  if (G.gateOpen > .02) {
    const e = G.gateOpen, g = ctx.createLinearGradient(DOORM, 0, DOORM - 420, 0); g.addColorStop(0, css(PAL.light, .5 * e)); g.addColorStop(1, css(PAL.light, 0));
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(DOOR0 + 20, GY); ctx.lineTo(DOOR1 - 20, GY); ctx.lineTo(DOOR1 + 40, VH); ctx.lineTo(DOOR0 - 420, VH); ctx.closePath(); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  // the people
  if (Math.abs(G.evan.x - cam - VW / 2) < VW) { const t = G.evan.pt ? (G.evan.pt < 239 ? G.evan.pt : 212 + 27 * (.5 + .5 * Math.sin(G.t / 50))) : G.evan.idle || 0; drawFrame(EVA[atTime(EVA_META, t)], EVA_META, G.evan.x - cam, GY, 1, 1); }
  if (G.obst && G.obst.x > cam - 100) drawFrame(OBS[Math.floor(G.obst.anim ?? OBS_META.rest[0]) % OBS.length], OBS_META, G.obst.x - cam, GY, G.obst.mode === 'home' ? -1 : 1, 1);
  if (G.pli) drawFrame(PLI[Math.floor(G.pli.anim ?? 0) % PLI.length], PLI_META, G.pli.x - cam, GY, 1, 1);
  drawChristian(P.x - cam, P.y + 1, P.face, 1);
  // birds in the air
  ctx.lineCap = 'round'; ctx.strokeStyle = css(mix(gcol[0], gcol[1], warm(.5)), .9);
  for (const f of G.flyers) {
    const x = f.x - cam * f.par, s = f.s * (1 - Math.min(.5, f.life / 900)), w = Math.sin(f.ph) * 5.5 * s; if (x < -20 || x > VW + 20) continue;
    ctx.globalAlpha = Math.min(1, (700 - f.life) / 120); ctx.lineWidth = 1.7 * s;
    ctx.beginPath(); ctx.moveTo(x - 7.5 * s, f.y - w); ctx.quadraticCurveTo(x - 3 * s, f.y - w * .25 - 1.6 * s, x, f.y); ctx.quadraticCurveTo(x + 3 * s, f.y - w * .25 - 1.6 * s, x + 7.5 * s, f.y - w); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // grass and leaves in front
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, 0, 100);
  pair(FRONT.cool, FRONT.warm, cam * FRONT.par, FRONT.q, 1, VH - 70, VH);
  // the rain side is dulled, the golden side is warmed
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = hGrad(ctx, mix(PAL.cloud, [255, 255, 255], .45), [255, 255, 255], .2 + LOOK.rain * .5, 0); ctx.fillRect(0, 0, VW, VH);
  if (G.gloom > .01) { ctx.fillStyle = css(mix(PAL.cloud, [20, 22, 34], .5), .5 * G.gloom); ctx.fillRect(0, 0, VW, VH); }
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = hGrad(ctx, PAL.light, PAL.light, 0, LOOK.gold * .5); ctx.fillRect(0, 0, VW, VH);
  if (G.flare > .02) { ctx.fillStyle = css(PAL.light, Math.min(.5, G.flare * .32)); ctx.fillRect(0, 0, VW, VH); }
  // vignette and a little paper grain so flat colour feels painted
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(finishC, 0, 0, VW, VH);
  // everything that shines, drawn last so it glows in the gloom
  ctx.globalCompositeOperation = 'screen';
  const dim = 1 - .7 * G.gloom;
  for (const l of LAMPS) if (l.lit && on(l.x, 30, 160)) { const a = Math.min(1, (G.t - l.lit) / 40) * lerp(1, .45, wAt(l.x)) * (.94 + .06 * Math.sin(G.t / 9 + l.x)); glow(l.x + 20 - cam, GY - 108, 190, .5 * a); glow(l.x + 20 - cam, GY - 108, 46, .9 * a); ctx.globalAlpha = .34 * a; ctx.drawImage(GLOW, l.x - 80 - cam, GY - 6, 200, 30); }
  for (const s of LIGHTS) {
    const x = s.x - cam; if (s.got || x < -40 || x > VW + 40) continue;
    const y = s.y + Math.sin(G.t / 26 + s.ph) * 4, tw = .82 + .18 * Math.sin(G.t / 11 + s.ph * 3);
    glow(x, y, 54, .5 * tw); glow(x, y, 17, 1);
  }
  if (G.state !== 'title') glow(P.x - cam, GY - 84, 210 + G.got * 2.2, (.1 + Math.min(.2, G.got * .0045)) * dim);   // the warmth he carries
  for (const m of G.motes) { const x = m.x - cam, tw = .75 + .25 * Math.sin(G.t / 9 + m.tw); glow(x, m.y, 26, .5 * tw * dim); glow(x, m.y, 8.5, dim); }
  for (const g of G.glints) { const x = g.x - cam * g.par, a = Math.sin(Math.PI * g.t / 56); glow(x, g.y, 30, .5 * a); ctx.globalAlpha = .9 * a; ctx.strokeStyle = '#fff6da'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 8, g.y); ctx.lineTo(x + 8, g.y); ctx.moveTo(x, g.y - 8); ctx.lineTo(x, g.y + 8); ctx.stroke(); }
  for (const t of G.taps) { ctx.globalAlpha = .5 * (1 - t.t / 26); ctx.strokeStyle = '#fff3d0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(t.x, t.y, 6 + t.t * 1.3, 0, 6.2832); ctx.stroke(); }
  if (G.ring) { const [x, y] = G.ring(); ctx.strokeStyle = '#ffe6ae'; ctx.lineWidth = 2; for (const k of [0, .5]) { const ph = (G.t / 80 + k) % 1; ctx.globalAlpha = .65 * (1 - ph); ctx.beginPath(); ctx.arc(x, y, 14 + ph * 40, 0, 6.2832); ctx.stroke(); } }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // falling rain
  const n = Math.round(LOOK.rain * drops.length);
  ctx.strokeStyle = css(mix(PAL.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v * STEPS; d.x -= d.v * .2 * STEPS; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)) * (1 + .6 * G.gloom); if (a < .02) continue;
    ctx.globalAlpha = Math.min(1, a); ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
// the same speed on every screen: the world ticks 60 times a second however often the screen redraws
let lastT = 0, acc = 0;
function loop(ts) {
  acc += Math.min(100, ts - lastT); lastT = ts; STEPS = 0;
  while (acc >= 16.6 && STEPS < 5) { update(); acc -= 16.667; STEPS++; }
  if (STEPS) draw();
  requestAnimationFrame(loop);
}

// ---------- input: hold to walk, touch things ----------
function scenePt(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH]; }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  e.preventDefault();
  const [sx, sy] = scenePt(e);
  if (G.state !== 'title' && G.state !== 'end') G.taps.push({ x: sx, y: sy, t: 0 });
  if (G.state === 'dialog') {
    if (G.act === 'light') { const l = lightPos(); if (Math.hypot(sx - l.x, sy - l.y) < 95) lightTouched(); else G.actT = Math.max(G.actT, 149); return; }
    if (G.act === 'gate') { if (Math.abs(sx - (DOORM - G.cam)) < 120 && sy > GY - 340 && sy < GY + 40) { pushing = true; pushId = e.pointerId; } else G.actT = Math.max(G.actT, 39); return; }
    next(); return;
  }
  if (G.state !== 'play') return;
  downs.set(e.pointerId, G.t); touchAt(sx, sy);
});
const lift = e => { if (e.type === 'blur') { downs.clear(); pushing = false; return; } downs.delete(e.pointerId); if (e.pointerId === pushId) pushing = false; };
addEventListener('pointerup', lift); addEventListener('pointercancel', lift); addEventListener('blur', lift);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const go = e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight' || e.code === 'KeyD';
  if (G.state === 'choice') { if (e.code === 'ArrowLeft') pick(true); if (e.code === 'ArrowRight') pick(false); return; }
  if (!go) return; e.preventDefault();
  if (G.state === 'dialog') {
    if (G.act === 'gate') keys.push = true;
    else if (G.act === 'light') { if (!e.repeat) lightTouched(); }
    else if (!e.repeat) next();
    return;
  }
  keys.r = true;
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = keys.push = false; });
const sayEl = dlg.querySelector('.say');
sayEl.addEventListener('click', () => { voiceOn = !voiceOn; sayEl.classList.toggle('off', !voiceOn); if (voiceOn) say(dWho.textContent, dTxt.textContent); else hush(); });
const sndEl = document.getElementById('snd');
sndEl.onclick = () => { muted = !muted; sndEl.classList.toggle('off', muted); if (AC) OUT.gain.setTargetAtTime(muted ? 0 : 1, AC.currentTime, .05); };

let runN = 0;
function start() {
  document.getElementById('title').style.opacity = 0; setTimeout(() => { document.getElementById('title').style.display = 'none'; }, 900);
  document.getElementById('endc').className = 'card';
  document.body.classList.add('playing'); G.opening = null;
  reset();
  hush(); if (audio()) { AC.resume(); setTimeout(() => sfx.bell(.6), 300); fetchVoices(); }
  if (START_X > 140) { G.state = 'play'; return; }
  const run = ++runN; G.state = 'wait'; setTimeout(() => { if (run === runN && G.state === 'wait') talk(INTRO); }, 1700);   // the bell, then the story
}
document.getElementById('play').onclick = start;
document.getElementById('open').onclick = () => {
  document.getElementById('open').style.display = 'none'; document.body.classList.add('opened');
  if (audio()) { AC.resume(); G.opening = { t: 0, next: 70, n: 0, last: 0 }; fetchVoices(); }
  setTimeout(() => { document.getElementById('play').style.display = ''; }, 2600);
};
document.getElementById('again').onclick = start;

// ---------- boot: build the scenery, fetch Christian, then the others while the child is already playing ----------
(async function boot() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#5d6b80'; ctx.fillRect(0, 0, VW, VH);
  await new Promise(r => setTimeout(r, 30));
  const chr = Promise.all([loadPack('christian-walk', CHR), loadPack('christian-stand', STD)]);
  buildScenery(); seed = 99; buildLevel(); bakeFinish();
  await chr;
  reset();
  document.getElementById('sub').textContent = 'The City of Destruction';
  document.getElementById('open').style.visibility = 'visible';
  requestAnimationFrame(t => { lastT = t; loop(t); });
  loadPack('evangelist', EVA).then(() => Promise.all([loadPack('obstinate', OBS), loadPack('pliable', PLI)]));
  for (const [who, txt] of INTRO) vox(who, txt);          // the first words, ready before Begin is pressed
})();
</script>
