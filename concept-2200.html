// ============================================================
// Style lab: one screen of the layered-silhouette look.
// Every depth layer is one colour. Far layers are pale, near layers dark,
// with mist between them. Rain on the left clears to golden light on the right.
// ============================================================
const VW = 960, VH = 540, GY = 455, PAN = 520;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const tmp = mk(8, 8), tctx = tmp.getContext('2d');      // one scratch canvas, reused for every layer
const sceneC = mk(8, 8), sctx = sceneC.getContext('2d'); // the finished painting (everything but the falling rain)
const skyC = mk(480, 270), kctx = skyC.getContext('2d'); // sky is soft, so half size is plenty
let S = 1;                                                // canvas pixels per scene unit

// ---------- controls ----------
const CTRL = [
  ['Light and weather'],
  { id: 'clear', label: 'Rain ↔ golden light', v: 50 },
  { id: 'rain', label: 'Rain', v: 60 },
  { id: 'gold', label: 'Golden glow', v: 65 },
  { id: 'mist', label: 'Mist between layers', v: 29 },
  ['Layers'],
  { id: 'n', label: 'How many layers', v: 4, min: 2, max: 9 },
  { id: 'depth', label: 'Pale far layers', v: 80 },
  { id: 'thru', label: 'See-through overlap', v: 30 },
  { id: 'soft', label: 'Soft edges', v: 66 },
  ['Shapes'],
  { id: 'city', label: 'Countryside ↔ city', v: 41 },
  { id: 'hills', label: 'Hills', v: 19 },
  { id: 'trees', label: 'Trees', v: 55 },
  { id: 'win', label: 'Lit windows', v: 35 },
  ['Look around'],
  { id: 'walk', label: 'Walk along', v: 0 },
];
const SL = CTRL.filter(c => !Array.isArray(c));
const V = { pal: 0, who: 1, fg: 1, seed: 3 };
for (const c of SL) V[c.id] = c.v;
const DEF = { ...V };

// each palette: rain side (cool) and golden side (warm)
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const PALS = [
  { name: 'Storm to gold', skyC: ['#5d6b80', '#b3bdc7'], skyW: ['#e6c687', '#fff2cc'], hazeC: '#b7c2cc', hazeW: '#ffe9b8', nearC: '#1d2838', nearW: '#3b2a1b', cloud: '#3f4a5c', light: '#fff0c4', win: '#ffd27a' },
  { name: 'Violet dusk', skyC: ['#4c4a6c', '#a8a2be'], skyW: ['#eeb48a', '#ffe6c6'], hazeC: '#aea8c2', hazeW: '#ffdcc0', nearC: '#1c1932', nearW: '#42233a', cloud: '#34304e', light: '#ffe2c2', win: '#ffc978' },
  { name: 'Green morning', skyC: ['#667c7a', '#bccbc4'], skyW: ['#e6da98', '#fbf6d2'], hazeC: '#bfcdc6', hazeW: '#f6efc0', nearC: '#1a2e2b', nearW: '#2f3a1d', cloud: '#465c5a', light: '#fdf6cc', win: '#ffdf8a' },
  { name: 'Ink and paper', skyC: ['#a59c8c', '#ddd5c4'], skyW: ['#e6d5a8', '#f8f0da'], hazeC: '#dcd4c4', hazeW: '#f4e8c8', nearC: '#26221f', nearW: '#3a2c1d', cloud: '#6e665a', light: '#fff4d6', win: '#f6d48e' },
].map(p => { const o = {}; for (const k in p) o[k] = k === 'name' ? p[k] : Array.isArray(p[k]) ? p[k].map(hex) : hex(p[k]); return o; });
const WHO = ['Plain black', 'Silhouette', 'Hidden'];   // owner chose the silhouette (Nov 14 2026)

// ---------- small helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${+a.toFixed(3)})`;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(1);
const rr = (a, b) => a + (b - a) * R();
// fractal noise, -1..1: big slow shapes with smaller and smaller detail on top (how real land looks)
function mkNoise() {
  const o = R() * 1000, h = i => { const v = Math.sin(i * 127.1 + o) * 43758.5453; return v - Math.floor(v); };
  return (x, wl, oct = 5, gain = .5) => {
    let v = 0, a = 1, t = 0, f = 1 / wl;
    for (let k = 0; k < oct; k++) { const q = x * f + k * 31.7, i = Math.floor(q), u = q - i, w = u * u * (3 - 2 * u); v += a * (lerp(h(i), h(i + 1), w) * 2 - 1); t += a; a *= gain; f *= 2.07; }
    return v / t;
  };
}

// ---------- the weather: 0 = rain, 1 = golden, across the screen ----------
let clearAt = .5;
const warm = fx => smooth(clearAt - .32, clearAt + .32, fx);
// a left-to-right gradient that follows the weather. a and b are [r,g,b] with alphas aa, ab
function hGrad(c, a, b, aa = 1, ab = 1, x0 = 0) {
  const g = c.createLinearGradient(x0, 0, x0 + VW, 0);
  for (let i = 0; i <= 10; i++) { const t = i / 10, w = warm(t); g.addColorStop(t, css(mix(a, b, w), lerp(aa, ab, w))); }
  return g;
}
// draw something soft: paint it small on the scratch canvas, then stretch it back up
function soft(c, q, alpha, op, fn) {
  const w = Math.max(2, Math.ceil(cv.width * q)), h = Math.max(2, Math.ceil(cv.height * q));
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, w + 2, h + 2);
  tctx.setTransform(w / VW, 0, 0, h / VH, 0, 0);
  fn(tctx);
  c.save(); c.globalAlpha = alpha; c.globalCompositeOperation = op || 'source-over';
  c.drawImage(tmp, 0, 0, w, h, 0, 0, VW, VH); c.restore();
}

// ---------- shapes: everything is a filled outline ----------
let L;                                    // the layer being built
const poly = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); L.shapes.push(p); };
const blob = (p, x, y, rx, ry) => { p.moveTo(x + rx, y); p.ellipse(x, y, rx, ry, 0, 0, 6.2832); };

function house(x, gy, w, h, s, tall) {
  const b = gy + 60, top = gy - h, ln = (R() - .5) * .035 * h, k = R();
  let rh;
  if (tall) {                             // a tower or steeple
    rh = w * rr(1.6, 2.6);
    poly([[x, b], [x, top], [x - 1.5 * s, top], [x + w / 2, top - rh], [x + w + 1.5 * s, top], [x + w, top], [x + w, b]]);
  } else if (k < .55) {                   // gable end toward us, sometimes with a jutting upper floor
    rh = w * rr(.5, .85);
    const j = R() < .45 ? 3.5 * s : 0, jy = top + h * rr(.4, .55);
    poly([[x, b], [x, jy], [x - j, jy], [x - j + ln, top], [x - j - 2 * s + ln, top], [x + w / 2 + ln, top - rh], [x + w + j + 2 * s + ln, top], [x + w + j + ln, top], [x + w + j, jy], [x + w, jy], [x + w, b]]);
  } else {                                // roof seen from the side: a long ridge
    rh = w * rr(.22, .38) + 8 * s;
    const e = w * rr(.08, .2);
    poly([[x, b], [x + ln, top], [x - 3 * s + ln, top], [x + e + ln, top - rh], [x + w - e + ln, top - rh], [x + w + 3 * s + ln, top], [x + w + ln, top], [x + w, b]]);
    if (R() < .4 && w > 50 * s) { const dx = x + w * rr(.3, .7), dw = 9 * s; poly([[dx - dw, top - rh * .2], [dx, top - rh * .2 - dw * 1.3], [dx + dw, top - rh * .2]]); }
  }
  if (!tall && R() < .75) {               // chimney
    const cx = x + w * rr(.18, .78) + ln, cw = rr(5, 8) * s, ct = top - rh * rr(.55, 1) - rr(5, 12) * s;
    poly([[cx, top], [cx, ct], [cx - 1.2 * s, ct], [cx - 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct - 2.5 * s], [cx + cw + 1.2 * s, ct], [cx + cw, ct], [cx + cw, top]]);
  }
  // windows that may be lit
  if (!tall && s > .4) {
    const cols = Math.max(1, Math.round(w / (24 * s))), rows = Math.max(1, Math.floor(h / (34 * s)));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      L.wins.push([x + (c + .5) * w / cols - 3 * s + ln * (1 - r / rows), top + 12 * s + r * 32 * s, 6 * s, 8.5 * s, R()]);
  }
}
function tree(x, gy, s, kind) {
  const p = new Path2D(), ln = rr(-5, 5) * s;
  if (kind === 0) {                       // round, leafy
    const th = rr(13, 26) * s, Rr = rr(24, 40) * s, cy = gy - th - Rr * .5;
    poly([[x - 4 * s, gy + 20], [x - 3 * s, gy], [x - 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 1.8 * s + ln * .6, gy - th - Rr * .3], [x + 3 * s, gy], [x + 4 * s, gy + 20]]);
    for (let i = 0; i < 9; i++) { const a = R() * 6.283, d = R() * Rr * .55; blob(p, x + ln + Math.cos(a) * d * 1.35, cy + Math.sin(a) * d * .75, Rr * rr(.42, .68), Rr * rr(.36, .56)); }
    for (let i = 0; i < 22; i++) { const a = R() * 6.283; blob(p, x + ln + Math.cos(a) * Rr * 1.02, cy + Math.sin(a) * Rr * .6, Rr * rr(.1, .22), Rr * rr(.07, .15)); }
    // a branch or two showing under the leaves
    poly([[x + ln * .6, gy - th * .7], [x + ln + Rr * .5, cy + Rr * .2], [x + ln + Rr * .45, cy + Rr * .3]]);
  } else if (kind === 1) {                // tall and narrow, like a poplar
    const hh = rr(62, 105) * s, w = rr(8, 12) * s, lf = [], rt = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, ww = w * Math.pow(Math.sin(Math.PI * Math.pow(t, .62)), .8) + .6 * s, y = gy - hh * (.1 + t * .9), cx = x + ln * t * .6; lf.push([cx - ww * rr(.82, 1.1), y]); rt.unshift([cx + ww * rr(.82, 1.1), y]); }
    poly([[x - 1.5 * s, gy + 20], ...lf, ...rt, [x + 1.5 * s, gy + 20]]);
  } else {                                // a low bush or hedge
    const n = 3 + (R() * 4 | 0);
    for (let i = 0; i < n; i++) blob(p, x + (i - n / 2) * 11 * s + rr(-3, 3) * s, gy - rr(3, 9) * s, rr(8, 14) * s, rr(7, 13) * s);
  }
  L.shapes.push(p);
}
function tuft(x, gy, hgt) {
  const n = 3 + (R() * 4 | 0);
  for (let i = 0; i < n; i++) { const bx = x + (i - n / 2) * 3, h = hgt * rr(.5, 1), lx = rr(-.5, .5) * h; poly([[bx - 1.3, gy + 4], [bx + lx, gy - h], [bx + 1.3, gy + 4]]); }
}
// a field fence far enough back to look the right size next to Christian
function fence(x0, gy, n) {
  for (let k = 0, x = x0; k < n; k++, x += 15) {
    const t = rr(-1, 1), y = gy(x), y2 = gy(x + 15);
    poly([[x - 1.1, y + 3], [x - 1.1 + t, y - 13 - rr(0, 2)], [x + 1.1 + t, y - 13], [x + 1.1, y + 3]]);
    if (k < n - 1) { poly([[x, y - 10.5], [x + 15, y2 - 10.5 + rr(-.7, .7)], [x + 15, y2 - 9], [x, y - 9]]); poly([[x, y - 5.5], [x + 15, y2 - 5.5 + rr(-.7, .7)], [x + 15, y2 - 4.2], [x, y - 4.2]]); }
  }
}


// ============================================================
// Year 2200 concepts. Same painting code as the style lab; only the
// shapes and colours differ. Four directions to choose from (V.pal).
// ============================================================
PALS.length = 0;
PALS.push(...[
  { name: 'A · Fallen towers', skyC: ['#4f6470', '#a9bcc0'], skyW: ['#e6c687', '#fff2cc'], hazeC: '#b3c4c6', hazeW: '#ffe9b8', nearC: '#16262e', nearW: '#3b2a1b', cloud: '#394b55', light: '#fff0c4', win: '#ffb866' },
  { name: 'B · Rust and ash', skyC: ['#74675a', '#c9b8a2'], skyW: ['#ecc57a', '#fff0c8'], hazeC: '#cdbca6', hazeW: '#ffe6b0', nearC: '#2a1c17', nearW: '#33321a', cloud: '#544739', light: '#fff0c4', win: '#ffae5c' },
  { name: 'C · The green return', skyC: ['#5f7672', '#b6c8c0'], skyW: ['#e6da98', '#fbf6d2'], hazeC: '#bccbc2', hazeW: '#f4eebc', nearC: '#172b27', nearW: '#2c3a1a', cloud: '#445a57', light: '#fdf6cc', win: '#ffd98a' },
  { name: 'D · Glass age', skyC: ['#4c4a6c', '#a8a2be'], skyW: ['#eeb48a', '#ffe6c6'], hazeC: '#aea8c2', hazeW: '#ffdcc0', nearC: '#1c1932', nearW: '#42233a', cloud: '#34304e', light: '#ffe2c2', win: '#9fe6e0' },
].map(p => { const o = {}; for (const k in p) o[k] = k === 'name' ? p[k] : Array.isArray(p[k]) ? p[k].map(hex) : hex(p[k]); return o; }));
const DTEXT = [
  'A dead city of leaning towers you can see the sky through, power lines sagging from pylon to pylon, a broken motorway. Cold steel-blue rain. People live in shacks among the ruins, with a few firelit windows.',
  'An industrial wasteland: cooling towers, wind turbines with missing blades, cranes, tanks and pipes, homes made from shipping containers. Brown dust and ash in the air instead of clean rain.',
  'The gentlest one. The old city is almost swallowed by trees: towers with groves on their roofs, vines hanging from everything. The ruins are sad but the green is already coming back.',
  'The furthest future: cracked glass domes, needle spires, a sky-rail on tall legs, and a piece of a giant ring fallen behind the mountains. Violet dusk, cold blue lamps.',
];
const SEEDS = [3, 2, 3, 2];

      k.globalCompositeOperation = 'source-over'; for (let r = 0; r < 5; r++) k.drawImage(figSil, 0, 0);   // make thin paint solid, so no pale spots show through
      // the light catches his front edge

      const g = k.createLinearGradient(fig.width * .45, 0, fig.width, 0); g.addColorStop(0, css(P.light, 0)); g.addColorStop(1, css(P.light, .3 * gold * (.3 + .7 * wm)));

    }
  }
  // framing in front
  if (V.fg) { const col = layerCol(P, 1).map(v => mix(v, [8, 8, 12], .4)); paintLayer(c, P, front, pan * front.par, col, 1, 1 / (1 + .6 + sf)); }
  // the rain side is dulled, the golden side is warmed

  c.globalCompositeOperation = 'soft-light';
  c.fillStyle = hGrad(c, P.light, P.light, 0, gold * .5); c.fillRect(0, 0, VW, VH);
  c.globalCompositeOperation = 'source-over';

const paper = mk(200, 200);
{ const c = paper.getContext('2d'), d = c.createImageData(200, 200), r = rng(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = 205 + r() * 50; d.data[i] = v; d.data[i + 1] = v - 2; d.data[i + 2] = v - 6; d.data[i + 3] = 255; }
  c.putImageData(d, 0, 0); }

// ---------- falling rain (the only thing that moves) ----------
const drops = []; { const r = rng(9); for (let i = 0; i < 260; i++) drops.push({ x: r() * (VW + 160), y: r() * VH, l: 14 + r() * 24, v: 9 + r() * 8, a: .12 + r() * .3 }); }
function frame() {
  if (dirty) { if (dirty > 1) build(); paint(); dirty = 0; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sceneC, 0, 0);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  const P = PALS[V.pal], n = Math.round(V.rain / 100 * drops.length);
  ctx.strokeStyle = css(mix(P.hazeC, [255, 255, 255], .5)); ctx.lineCap = 'round'; ctx.lineWidth = 1.1;
  for (let i = 0; i < n; i++) {
    const d = drops[i]; d.y += d.v; d.x -= d.v * .2; if (d.y > VH + 20) { d.y = -30; d.x = Math.random() * (VW + 160); }
    const a = d.a * (1 - warm(d.x / VW)); if (a < .02) continue;
    ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .2, d.y + d.l); ctx.stroke();

// ---------- page plumbing ----------
let dirty = 2;
function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  S = clamp(cv.clientWidth * dpr / VW, .4, 2);
  const w = Math.round(VW * S), h = Math.round(VH * S);
  if (cv.width === w && cv.height === h) return;
  for (const k of [cv, tmp, sceneC]) { k.width = w; k.height = h; }

}
const $ = id => document.getElementById(id);
function save() {
  const s = 'ABCD'[V.pal] + V.seed;
  $('code').textContent = s;
  try { history.replaceState(null, '', '#' + s + '.' + V.walk + '.' + V.clear + '.' + V.fg); } catch (e) {}
}
function load() {
  const m = /^([A-D])(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:\.([01]))?/.exec(location.hash.slice(1)); if (!m) return;
  V.pal = 'ABCD'.indexOf(m[1]); V.seed = +m[2] || 1;
  if (m[3] !== undefined) V.walk = clamp(+m[3], 0, 100);
  if (m[4] !== undefined) V.clear = clamp(+m[4], 0, 100);

}
function ui() {
  const el = $('dirs'); el.innerHTML = '';
  PALS.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name; b.className = V.pal === i ? 'on' : ''; b.onclick = () => { V.pal = i; V.seed = SEEDS[i]; dirty = 2; ui(); save(); }; el.appendChild(b); });
  $('dname').textContent = PALS[V.pal].name; $('dtext').textContent = DTEXT[V.pal];
  $('fg').className = V.fg ? 'on' : ''; $('walk').value = V.walk; $('clear').value = V.clear;
}
$('new').onclick = () => { V.seed = (V.seed % 999) + 1; dirty = 2; save(); };
$('fg').onclick = () => { V.fg = V.fg ? 0 : 1; dirty = Math.max(dirty, 1); ui(); save(); };
$('walk').oninput = e => { V.walk = +e.target.value; dirty = Math.max(dirty, 1); save(); };
$('clear').oninput = e => { V.clear = +e.target.value; dirty = Math.max(dirty, 1); save(); };
addEventListener('resize', fit);
addEventListener('hashchange', () => { load(); dirty = 2; ui(); });
load(); ui(); fit(); save();
{ const im = new Image(); im.onload = () => { fig = im; dirty = Math.max(dirty, 1); }; im.src = SPR_SRC; }
requestAnimationFrame(frame);
</script>
